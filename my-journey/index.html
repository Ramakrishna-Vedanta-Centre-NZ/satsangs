<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Course Dashboard | Vedanta NZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&family=Noto+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../assets/rvc-type.css?v=3">
<style>
:root{--navy:#12285A;--cream:#FBF5EA;--gold:#C9A24A;--goldt:#6B4E0E;--green:#2F5A2E;--pink:#C2557A;--ink:#1E1E1E;--line:#E6DAC3;--card:#FFFDF8}
*{margin:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans',Arial,sans-serif}
header{background:var(--navy);color:var(--cream);text-align:center;padding:9px 16px}
header img{width:44px;height:52px;object-fit:contain}
.ey{font:700 var(--fs-micro,11px) 'Noto Sans',sans-serif;letter-spacing:4px;color:#E6C36A;margin-top:4px}
h1{font:600 20px/1.2 'Noto Serif',serif}
header p.hi{font:italic var(--fs-question,16px) 'Noto Serif',serif;color:#F3E6C4;margin-top:4px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 24px}
.bar1{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:8px;flex:1 1 360px;min-width:0}
.pick label{font:700 var(--fs-micro,11px) 'Noto Sans',sans-serif;letter-spacing:2px;color:var(--goldt);white-space:nowrap}
.pick select{flex:1;min-width:0;font:600 var(--fs-question,16px) 'Noto Serif',serif;color:#13295B;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:9px 12px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 14px;text-align:center;min-width:104px}
.tile b{display:block;font:600 20px/1.1 'Noto Serif',serif;color:#13295B}
.tile span{display:block;margin-top:2px;font-size:11px;color:#5A5A5A;letter-spacing:.4px}
.prog{height:7px;background:#EEE6D6;border-radius:4px;overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--green);border-radius:4px}
.next{background:var(--navy);color:var(--cream);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.next .k{font:700 var(--fs-micro,11px) 'Noto Sans',sans-serif;letter-spacing:3px;color:#E6C36A}
.next .t{font:500 var(--fs-question,16px)/1.3 "Noto Serif",serif;flex:1 1 240px;color:var(--cream)}
.next .done{font:italic var(--fs-question,16px) 'Noto Serif',serif;color:#F3E6C4}
details{margin-bottom:10px}
summary{cursor:pointer;list-style:none;font:600 15px 'Noto Serif',serif;color:#13295B;padding:6px 2px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary:before{content:'\25B8';margin-right:8px;color:var(--gold)}
details[open]>summary:before{content:'\25BE'}
summary .cnt{font:400 var(--fs-small,12.5px) 'Noto Sans',sans-serif;color:#5A5A5A;white-space:nowrap;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px;margin-top:4px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-width:0}
.item.d{border-color:#9DBE98;background:#F3F9F0}
.mk{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #BDB4A0;color:#fff;font:700 13px/18px 'Noto Sans',sans-serif;text-align:center}
.item.d .mk{background:var(--green);border-color:var(--green)}
.item.p .mk{border-color:var(--gold);background:#FBF1D6;color:var(--goldt)}
.tx{flex:1;min-width:0}
.ql{color:inherit;text-decoration:underline;text-decoration-color:#B99A4A;text-underline-offset:2px}
.t{font:400 14px/1.3 'Noto Serif',serif;color:#13295B;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{font-size:12px;line-height:1.35;color:#5A5A5A;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m b{font-weight:500}.ok{color:#2F5A2E}.no{color:#8A8A8A}
.q{display:inline-block;height:6px;width:46px;background:#EEE6D6;border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:4px}
.q i{display:block;height:100%}
.acts{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.acts a,.next a{text-decoration:none;font-weight:400;font-size:12.5px;border-radius:8px;padding:5px 11px;display:inline-block;text-align:center}
.next a{font-size:var(--fs-btn,14px);padding:8px 14px;border-radius:10px}
.a1{background:var(--navy);color:var(--cream)}.a2{background:var(--gold);color:var(--navy)}
.empty,.note{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:18px;text-align:center;line-height:1.55}
footer{text-align:center;font-size:var(--fs-small,12.5px);color:#5A5A5A;padding:0 16px 18px}
@media (max-width:560px){.grid{grid-template-columns:1fr}main{padding:12px 10px 20px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{min-width:0;padding:6px 8px}.tile span{letter-spacing:.2px}}
</style></head><body>
<header><h1>My Course Dashboard</h1></header>
<main id="app"><div class="note">Loading my dashboard…</div></main>
<script>
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SITE='https://www.vedanta.nz/';
const QUIZ=SITE+'quiz?q=';
let LIST=null,DATA=null,SEL=null;
const PRAC=new Set('1-1 1-2 1-3 1-5 1-6 2-1 2-2 2-3 2-4 2-5 2-6 2-7 3-1 3-3 3-4 3-5 3-6 3-7 4-3 4-4 4-5 4-6 5-1 5-2 5-4 5-5 5-7'.split(' ')); // Advanced Mind lessons that have a practice quiz
const ADVQ='https://www.vedanta.nz/understanding-check?q=';
function advUrl(code){let m=/^ADV-P-(\d+)-(\d+)$/.exec(code);if(m)return ADVQ+m[1]+'.'+m[2]+'&kind=practice';m=/^ADV-M(\d)$/.exec(code);if(m)return ADVQ+'m'+m[1];m=/^ADV-(\d+)-(\d+)$/.exec(code);return m?ADVQ+m[1]+'.'+m[2]:''}
function advQs(title){const m=/^(\d+)\.(\d+)\s/.exec(title||'');if(!m)return [];const k=m[1]+'-'+m[2];const q=[{code:'ADV-'+k,label:'Check'}];if(PRAC.has(k))q.push({code:'ADV-P-'+k,label:'Practice'});return q}
function colour(p){return p>=70?'#2F5A2E':p>=50?'#6B4E0E':'#C2557A'}
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}
function lessonUrl(c,id){return SITE+'participant-page/'+encodeURIComponent(c.slug)+'/step/'+encodeURIComponent(id)}
function courseList(d){
 let cs=(d.courses||[]).filter(c=>c.sections.some(s=>s.steps.length));
 if(!cs.length&&LIST){cs=[{id:'sat',slug:'satsang-study',title:'Satsang Study',sections:[
  {title:'Auckland satsangs',steps:LIST.filter(x=>x.series==='Auckland').map(x=>[x.lessonStepId,x.lessonTitle,'ARTICLE'])},
  {title:'Hamilton satsangs',steps:LIST.filter(x=>x.series==='Hamilton').map(x=>[x.lessonStepId,x.lessonTitle,'ARTICLE'])}]}]}
 cs.sort((a,b)=>(a.slug==='satsang-study'?-1:b.slug==='satsang-study'?1:a.title.localeCompare(b.title)));
 return cs}
function render(){
 if(!DATA||(!LIST&&!(DATA.courses&&DATA.courses.length)))return;
 const d=DATA; 
 const done=new Set(d.completedSteps||[]);
 const cs=courseList(d);
 if(!cs.length){app.innerHTML='<div class="empty">I have not joined a course yet. Open <a href="'+SITE+'courses" target="_top">Courses</a> to begin.</div>';return}
 let saved=null;try{saved=sessionStorage.getItem('rvcCourse')}catch(e){}
 if(!SEL||!cs.some(c=>c.id===SEL))SEL=(cs.some(c=>c.id===saved)?saved:cs[0].id);
 const c=cs.find(x=>c0(x)===SEL)||cs[0];
 const best={},tries={};
 (d.results||[]).forEach(r=>{tries[r.code]=(tries[r.code]||0)+1;if(!best[r.code]||r.percent>best[r.code].percent)best[r.code]=r});
 const meta={};(LIST||[]).forEach(x=>meta[x.lessonStepId]=x);
 const today=new Date().toISOString().slice(0,10);
 const sat=c.slug==='satsang-study',adv=c.slug==='know-thy-mind';
 let items=[];
 c.sections.forEach(sec=>sec.steps.forEach(st=>{
  const id=st[0],m=sat?meta[id]:null,isQuiz=st[2]==='QUIZ';
  const b=m?best[m.code]:null,studied=done.has(id);
  const qb=adv?advQs(st[1]).map(q=>({code:q.code,label:q.label,b:best[q.code]||null})):[];
  items.push({qb:qb,sec:sec.title,id:id,title:m?m.title:st[1],code:m&&m.code,date:m&&m.date,series:m&&m.series,studied:studied,isQuiz:isQuiz,b:b,tries:m?(tries[m.code]||0):0,
   upcoming:!!(m&&m.date>today),st:isQuiz?(studied?'done':'pend'):(m?((studied&&b)?'done':((studied||b)?'prog':'pend')):(studied?'done':'pend'))});
 }));
 if(adv)c.sections.forEach(sec=>{const mm=/^0?(\d)\s*-/.exec(sec.title||'');if(!mm)return;const code='ADV-M'+mm[1];items.push({mod:true,isQuiz:true,studied:false,sec:sec.title,id:null,title:'Module '+mm[1]+' understanding check',qb:[{code:code,label:'Module check',b:best[code]||null}],st:best[code]?'done':'pend'})});
 const core=items.filter(i=>!i.mod);
 const n=core.length,les=items.filter(i=>!i.isQuiz),nStud=items.filter(i=>!i.isQuiz&&i.studied).length;
 const quizzes=sat?items.filter(i=>i.b):items.filter(i=>i.isQuiz&&i.studied);
 const avg=sat&&quizzes.length?Math.round(quizzes.reduce((s,i)=>s+i.b.percent,0)/quizzes.length):null;
 const nDone=core.filter(i=>i.st==='done').length;
 const qAll=items.reduce((a,i)=>a.concat(i.qb||[]),[]),qDone=qAll.filter(x=>x.b);
 const qAvg=qDone.length?Math.round(qDone.reduce((s,x)=>s+x.b.percent,0)/qDone.length):null;
 let h='<div class="bar1"><div class="pick"><label for="cs">MY COURSE</label><select id="cs">'+cs.map(x=>'<option value="'+esc(c0(x))+'"'+(c0(x)===c0(c)?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></div><div class="tiles">'
  +'<div class="tile"><b>'+(sat?nDone+' of '+n:nStud+' of '+les.length)+'</b><span>'+(sat?'SATSANGS COMPLETED':'LESSONS STUDIED')+'</span></div>'
  +(sat?'<div class="tile"><b>'+nStud+'</b><span>LESSONS STUDIED</span></div>':'')
  +(adv&&qAll.length?'<div class="tile"><b>'+qDone.length+' of '+qAll.length+'</b><span>QUIZZES DONE</span></div>':(sat||quizzes.length||items.some(i=>i.isQuiz)?'<div class="tile"><b>'+quizzes.length+'</b><span>QUIZZES DONE</span></div>':''))
  +(adv&&qAvg!=null?'<div class="tile"><b>'+qAvg+'%</b><span>AVERAGE BEST SCORE</span></div>':(avg==null?'':'<div class="tile"><b>'+avg+'%</b><span>AVERAGE BEST SCORE</span></div>'))+'</div></div>';
 h+='<div class="prog"><i style="width:'+Math.round(100*nDone/Math.max(1,n))+'%"></i></div>';
 const nxt=core.find(i=>i.st!=='done'&&!i.upcoming);
 h+='<div class="next"><span class="k">MY NEXT STEP</span>';
 if(nxt){h+='<span class="t">'+esc(nxt.title)+'</span><a class="a2" href="'+lessonUrl(c,nxt.id)+'" target="_top">'+(nxt.studied?'Continue':'Open lesson')+'</a>'+(nxt.code&&!nxt.b?'<a class="a1" style="background:#2A4180" href="'+QUIZ+esc(nxt.code)+'" target="_top">Take the quiz</a>':'')}
 else h+='<span class="done">I am up to date in this course. Thank you for studying with us.</span>';
 h+='</div>';
 const secs=[];c.sections.forEach(s=>{const its=items.filter(i=>i.sec===s.title);if(its.length)secs.push([s.title,its])});
 const big=n>40||window.innerWidth<560;
 secs.forEach(sc=>{
  const its=sc[1],cn=its.filter(i=>!i.mod),dn=cn.filter(i=>i.st==='done').length,hasNext=nxt&&its.indexOf(nxt)>=0;
  h+='<details'+((!big||hasNext)?' open':'')+'><summary>'+esc(sc[0])+'<span class="cnt">'+dn+' of '+cn.length+' done</span></summary><div class="grid">';
  its.forEach(i=>{
   const cls=i.st==='done'?'d':(i.st==='prog'?'p':'');
   let m;
   if(i.code){m=[i.series,fmt(i.date)].join(' · ')+' · '+(i.studied?'<b class="ok">✓ Completed</b>':'<b class="no">Not started</b>')+' · Quiz: '+(i.b?'<b class="ok">'+i.b.percent+'%</b><span class="q"><i style="width:'+Math.max(4,i.b.percent)+'%;background:'+colour(i.b.percent)+'"></i></span>':'<b class="no">to do</b>')}
   else if(i.qb&&i.qb.length){const ql=i.qb.map(x=>'<a class="ql" href="'+advUrl(x.code)+'" target="_top">'+x.label+'</a>: '+(x.b?'<b class="ok">'+x.b.percent+'%</b>':'<b class="no">to do</b>'));m=(i.mod?'':(i.studied?'<b class="ok">✓ Completed</b>':'<b class="no">Not started</b>')+' · ')+ql.join(' · ')}
   else m=(i.isQuiz?'Quiz · ':'')+(i.studied?'<b class="ok">✓ Completed</b>':'<b class="no">Not started</b>');
   h+='<div class="item '+cls+'"><span class="mk">'+(i.st==='done'?'✓':(i.st==='prog'?'…':''))+'</span><div class="tx"><p class="t">'+esc(i.title)+'</p><p class="m">'+m+'</p></div><div class="acts">'+(i.mod?'':'<a class="a1" href="'+lessonUrl(c,i.id)+'" target="_top">Lesson</a>')+(i.code?'<a class="a2" href="'+QUIZ+esc(i.code)+'" target="_top">'+(i.b?'Retake':'Quiz')+'</a>':(i.qb&&i.qb.length?'<a class="a2" href="'+advUrl((i.qb.find(x=>!x.b)||i.qb[0]).code)+'" target="_top">'+(i.qb.every(x=>x.b)?'Retake':'Quiz')+'</a>':''))+'</div></div>';
  });
  h+='</div></details>';
 });
 app.innerHTML=h;
 document.getElementById('cs').onchange=function(){SEL=this.value;try{sessionStorage.setItem('rvcCourse',SEL)}catch(e){}render()};
}
function c0(c){return c.id}
window.addEventListener('message',e=>{const d=e.data||{};
 if(d.type==='journey'){DATA=d;render()}
 else if(d.type==='notMember')app.innerHTML='<div class="note">Please sign in to vedanta.nz to see my dashboard.</div>'});
fetch('../satsangs.json').then(r=>r.json()).then(j=>{LIST=j.satsangs||[];render()}).catch(()=>{LIST=[];render()});
if(window.self===window.top){app.innerHTML='<div class="note">My Course Dashboard shows my own progress when I open it on <a href="https://www.vedanta.nz/my-course-dashboard">vedanta.nz</a> while signed in.</div>'}
else{let got=false,n=0;window.addEventListener('message',e=>{if(e.data&&(e.data.type==='journey'||e.data.type==='notMember'))got=true});const ping=()=>{if(got||n++>15)return;try{window.parent.postMessage({type:'ready'},'*')}catch(e){}setTimeout(ping,1000)};ping()}
</script></body></html>
