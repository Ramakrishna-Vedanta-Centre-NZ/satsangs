<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Journey | Vedanta NZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&family=Noto+Sans:wght@400..700&display=swap">
<style>
:root{--navy:#12285A;--cream:#FBF5EA;--gold:#C9A24A;--goldt:#6B4E0E;--green:#2F5A2E;--pink:#C2557A;--ink:#1E1E1E;--line:#E6DAC3;--card:#FFFDF8}
*{margin:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans',Arial,sans-serif}
header{background:var(--navy);color:var(--cream);text-align:center;padding:26px 16px 22px}
header img{width:64px;height:76px;object-fit:contain}
.ey{font:700 12px 'Noto Sans',sans-serif;letter-spacing:4px;color:#E6C36A;margin-top:8px}
h1{font:700 30px/1.2 'Noto Serif',serif;margin-top:4px}
header p.hi{font:italic 17px 'Noto Serif',serif;color:#F3E6C4;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:20px 16px 30px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 2px 8px rgba(19,41,91,.06)}
.tile b{display:block;font:700 30px/1.1 'Noto Serif',serif;color:#13295B}
.tile span{font-size:12.5px;color:#5A5A5A;letter-spacing:.5px}
h2{font:700 19px 'Noto Serif',serif;color:#13295B;margin:6px 0 10px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(19,41,91,.06)}
.res .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.res .code{font:700 11.5px 'Noto Sans',sans-serif;letter-spacing:2px;color:var(--goldt)}
.res .t{font:700 16.5px/1.35 'Noto Serif',serif;color:#13295B;margin:2px 0 8px}
.res .pct{font:700 22px 'Noto Serif',serif;color:#13295B;white-space:nowrap}
.bar{height:8px;background:#EEE6D6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:#5A5A5A;margin-top:6px}
.band{font-weight:700}
.empty,.note{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:18px;text-align:center;line-height:1.55}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.links a{flex:1;min-width:200px;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 14px}
.a1{background:var(--navy);color:var(--cream)}.a2{background:var(--gold);color:var(--navy)}
footer{text-align:center;font-size:13px;color:#5A5A5A;padding:0 16px 24px}
@media (max-width:420px){.tile b{font-size:24px}}
</style></head><body>
<header><img src="logo.png" alt="Ramakrishna Vedanta NZ emblem"><p class="ey">VEDANTA NZ</p><h1>My Journey</h1><p class="hi" id="hi">Your satsangs, studies and quizzes</p></header>
<main id="app"><div class="note">Loading your journey…</div></main>
<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz" target="_top" style="color:#13295B">www.vedanta.nz</a></footer>
<script>
const app=document.getElementById('app');
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function band(p){return p>=90?['Excellent','#2F5A2E']:p>=70?['Very good','#2F5A2E']:p>=50?['A good start','#6B4E0E']:['Keep going','#C2557A']}
function render(d){
 if(d.name)document.getElementById('hi').textContent='Namaste, '+d.name;
 const items=(d.results||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
 const best={};items.forEach(r=>{if(!best[r.code]||r.percent>best[r.code].percent)best[r.code]=r});
 const bestList=Object.values(best);
 const avg=bestList.length?Math.round(bestList.reduce((s,r)=>s+r.percent,0)/bestList.length):0;
 let h='<div class="tiles"><div class="tile"><b>'+bestList.length+'</b><span>QUIZZES COMPLETED</span></div><div class="tile"><b>'+(bestList.length?avg+'%':'–')+'</b><span>AVERAGE BEST SCORE</span></div><div class="tile"><b>'+items.length+'</b><span>ATTEMPTS IN ALL</span></div></div>';
 if(!items.length)h+='<div class="empty">You have not taken a quiz yet.<br>Begin with the latest satsang in <b>Satsang Study</b>, then take its revision quiz. Your results will appear here.</div>';
 else{h+='<h2>Your best result for each quiz</h2>';
  bestList.sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(r=>{const b=band(r.percent);const tries=items.filter(x=>x.code===r.code).length;
   h+='<div class="res"><div class="top"><div><p class="code">'+esc(r.code)+(r.programme?' · '+esc(r.programme).toUpperCase():'')+'</p><p class="t">'+esc(r.title)+'</p></div><p class="pct">'+r.percent+'%</p></div><div class="bar"><i style="width:'+Math.max(2,r.percent)+'%;background:'+b[1]+'"></i></div><div class="meta"><span class="band" style="color:'+b[1]+'">'+b[0]+'</span><span>'+r.score+' / '+r.maxScore+' · '+new Date(r.date).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})+(tries>1?' · '+tries+' attempts':'')+'</span></div></div>'});}
 h+='<div class="links"><a class="a1" href="https://www.vedanta.nz/course/satsang-study" target="_top">Continue Satsang Study</a><a class="a2" href="https://www.vedanta.nz/satsang-quiz?q=SAT-001" target="_top">Take the latest quiz</a></div>';
 app.innerHTML=h}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='journey')render(d);else if(d.type==='notMember')app.innerHTML='<div class="note">Please sign in to vedanta.nz to see your journey.</div>'});
if(window.self===window.top){app.innerHTML='<div class="note">This page shows your results when you open <b>My Journey</b> on <a href="https://www.vedanta.nz/my-journey">vedanta.nz</a> while signed in.</div>'}
else{let got=false,n=0;window.addEventListener('message',e=>{if(e.data&&(e.data.type==='journey'||e.data.type==='notMember'))got=true});const ping=()=>{if(got||n++>15)return;try{window.parent.postMessage({type:'ready'},'*')}catch(e){}setTimeout(ping,1000)};ping()}
</script></body></html>
