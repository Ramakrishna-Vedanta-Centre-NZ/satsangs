<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Course Dashboard | Vedanta NZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&family=Noto+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="../assets/rvc-type.css?v=3">
<style>
:root{--navy:#12285A;--cream:#FBF5EA;--gold:#C9A24A;--goldt:#6B4E0E;--green:#2F5A2E;--pink:#C2557A;--ink:#1E1E1E;--line:#E6DAC3;--card:#FFFDF8}
*{margin:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans',Arial,sans-serif}
header{background:var(--navy);color:var(--cream);text-align:center;padding:26px 16px 22px}
header img{width:64px;height:76px;object-fit:contain}
.ey{font:700 var(--fs-micro,11px) 'Noto Sans',sans-serif;letter-spacing:4px;color:#E6C36A;margin-top:8px}
h1{font:700 var(--fs-title,24px)/1.2 'Noto Serif',serif;margin-top:4px}
header p.hi{font:italic var(--fs-question,16px) 'Noto Serif',serif;color:#F3E6C4;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:20px 16px 30px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(19,41,91,.06)}
.tile b{display:block;font:700 28px/1.1 'Noto Serif',serif;color:#13295B}
.tile span{display:block;margin-top:4px;font-size:var(--fs-small,12.5px);color:#5A5A5A;letter-spacing:.5px}
h2{font:700 var(--fs-heading,21px) 'Noto Serif',serif;color:#13295B;margin:22px 0 10px}
.next{background:var(--navy);color:var(--cream);border-radius:14px;padding:16px 18px;margin-bottom:6px}
.next .k{font:700 var(--fs-micro,11px) 'Noto Sans',sans-serif;letter-spacing:3px;color:#E6C36A}
.next .t{font:700 var(--fs-question,16px)/1.35 "Noto Serif",serif;margin:4px 0 10px;color:var(--cream)}
.next .done{font:italic var(--fs-question,16px) 'Noto Serif',serif;color:#F3E6C4}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(19,41,91,.06)}
.row .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.code{font:700 var(--fs-micro,11px) 'Noto Sans',sans-serif;letter-spacing:2px;color:var(--goldt)}
.t{font:700 var(--fs-question,16px)/1.35 'Noto Serif',serif;color:#13295B;margin:2px 0 4px}
.dt{font-size:var(--fs-small,12.5px);color:#5A5A5A}
.badge{font:700 var(--fs-small,12.5px) 'Noto Sans',sans-serif;border-radius:999px;padding:4px 11px;white-space:nowrap;border:1px solid}
.b-done{color:#2F5A2E;border-color:#2F5A2E;background:#EAF3E6}
.b-prog{color:#6B4E0E;border-color:#C9A24A;background:#FBF1D6}
.b-pend{color:#5A5A5A;border-color:#BDB4A0;background:#F4EFE4}
.b-soon{color:#13295B;border-color:#13295B;background:#E7ECF7}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 6px;font-size:var(--fs-small,12.5px)}
.chips span{color:#5A5A5A}.chips b{font-weight:700}
.ok{color:#2F5A2E}.no{color:#8A8A8A}
.bar{height:8px;background:#EEE6D6;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts a,.next a{text-decoration:none;font-weight:700;font-size:var(--fs-btn,14px);border-radius:10px;padding:9px 14px;display:inline-block}
.a1{background:var(--navy);color:var(--cream)}.a2{background:var(--gold);color:var(--navy)}
.next .a2{margin-right:8px}
.empty,.note{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:18px;text-align:center;line-height:1.55}
footer{text-align:center;font-size:var(--fs-small,12.5px);color:#5A5A5A;padding:0 16px 24px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}main{padding:16px 10px 24px}}
</style></head><body>
<header><img src="logo.png" alt="Ramakrishna Vedanta NZ emblem"><p class="ey">VEDANTA NZ</p><h1>My Course Dashboard</h1><p class="hi" id="hi">My lessons and quizzes</p></header>
<main id="app"><div class="note">Loading my dashboard…</div></main>
<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz" target="_top" style="color:#13295B">www.vedanta.nz</a></footer>
<script>
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const LESSON='https://www.vedanta.nz/participant-page/satsang-study/step/';
const QUIZ='https://www.vedanta.nz/quiz?q=';
let LIST=null, DATA=null;
function colour(p){return p>=70?'#2F5A2E':p>=50?'#6B4E0E':'#C2557A'}
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}
function render(){
 if(!LIST||!DATA)return;
 const d=DATA; if(d.name)document.getElementById('hi').textContent='Namaste, '+d.name;
 const known=Array.isArray(d.completedSteps);
 const best={},tries={};
 (d.results||[]).forEach(r=>{tries[r.code]=(tries[r.code]||0)+1;if(!best[r.code]||r.percent>best[r.code].percent)best[r.code]=r});
 const today=new Date().toISOString().slice(0,10);
 const rows=LIST.map(s=>{
  const b=best[s.code], studied=known&&d.completedSteps.indexOf(s.lessonStepId)>=0, quiz=!!b, upcoming=s.date>today;
  let st=known?((studied&&quiz)?'done':((studied||quiz)?'prog':'pend')):(quiz?'done':'pend');
  return Object.assign({},s,{b:b,studied:studied,quiz:quiz,upcoming:upcoming,st:st,tries:tries[s.code]||0});
 });
 const nDone=rows.filter(r=>r.st==='done').length, nStudied=rows.filter(r=>r.studied).length, nQuiz=rows.filter(r=>r.quiz).length;
 const avg=nQuiz?Math.round(rows.filter(r=>r.quiz).reduce((s,r)=>s+r.b.percent,0)/nQuiz):null;
 let h='<div class="tiles"><div class="tile"><b>'+nDone+' of '+rows.length+'</b><span>SATSANGS COMPLETED</span></div>'
  +(known?'<div class="tile"><b>'+nStudied+'</b><span>LESSONS STUDIED</span></div>':'')
  +'<div class="tile"><b>'+nQuiz+'</b><span>QUIZZES DONE</span></div>'
  +'<div class="tile"><b>'+(avg==null?'–':avg+'%')+'</b><span>AVERAGE BEST SCORE</span></div></div>';
 const nxt=rows.find(r=>r.st!=='done'&&!r.upcoming);
 h+='<div class="next"><p class="k">MY NEXT STEP</p>';
 if(nxt){const what=(known&&!nxt.studied)?'Study the lesson':(!nxt.quiz?'Take the quiz':'Finish this satsang');
  h+='<p class="t">'+esc(nxt.lessonTitle)+'</p><a class="a2" href="'+LESSON+esc(nxt.lessonStepId)+'" target="_top">'+(known&&!nxt.studied?'Open the lesson':'Open lesson')+'</a>'+(nxt.quiz?'':'<a class="a1" style="background:#2A4180" href="'+QUIZ+esc(nxt.code)+'" target="_top">Take the quiz</a>')+'</div>';}
 else h+='<p class="done">I am up to date with every satsang so far. Thank you for studying with us.</p></div>';
 ['Auckland','Hamilton'].forEach(series=>{
  const rs=rows.filter(r=>r.series===series); if(!rs.length)return;
  h+='<h2>My '+series+' satsangs</h2>';
  rs.forEach(r=>{
   const badge=r.st==='done'?['b-done','Completed']:(r.upcoming&&r.st==='pend'?['b-soon','Upcoming']:(r.st==='prog'?['b-prog','In progress']:['b-pend','Pending']));
   h+='<div class="row"><div class="top"><div><p class="code">'+esc(r.code)+'</p><p class="t">'+esc(r.title)+'</p><p class="dt">'+fmt(r.date)+'</p></div><span class="badge '+badge[0]+'">'+badge[1]+'</span></div>';
   h+='<div class="chips">'+(known?'<span>Lesson: <b class="'+(r.studied?'ok':'no')+'">'+(r.studied?'✓ Studied':'Not yet')+'</b></span>':'')
    +'<span>Quiz: '+(r.quiz?'<b class="ok">'+r.b.percent+'%</b> ('+r.b.score+' / '+r.b.maxScore+(r.tries>1?', '+r.tries+' attempts':'')+')':'<b class="no">Not taken</b>')+'</span></div>';
   if(r.quiz)h+='<div class="bar"><i style="width:'+Math.max(2,r.b.percent)+'%;background:'+colour(r.b.percent)+'"></i></div>';
   h+='<div class="acts"><a class="a1" href="'+LESSON+esc(r.lessonStepId)+'" target="_top">Open lesson</a><a class="a2" href="'+QUIZ+esc(r.code)+'" target="_top">'+(r.quiz?'Retake quiz':'Take quiz')+'</a></div></div>';
  });
 });
 app.innerHTML=h;
}
window.addEventListener('message',e=>{const d=e.data||{};
 if(d.type==='journey'){DATA=d;render()}
 else if(d.type==='notMember')app.innerHTML='<div class="note">Please sign in to vedanta.nz to see my dashboard.</div>'});
fetch('../satsangs.json').then(r=>r.json()).then(j=>{LIST=j.satsangs||[];render()}).catch(()=>{app.innerHTML='<div class="note">I could not load the satsang list just now. Please try again in a moment.</div>'});
if(window.self===window.top){app.innerHTML='<div class="note">My Course Dashboard shows my own progress when I open it on <a href="https://www.vedanta.nz/my-course-dashboard">vedanta.nz</a> while signed in.</div>'}
else{let got=false,n=0;window.addEventListener('message',e=>{if(e.data&&(e.data.type==='journey'||e.data.type==='notMember'))got=true});const ping=()=>{if(got||n++>15)return;try{window.parent.postMessage({type:'ready'},'*')}catch(e){}setTimeout(ping,1000)};ping()}
</script></body></html>
