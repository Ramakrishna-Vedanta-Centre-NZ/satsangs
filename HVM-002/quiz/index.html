const Q=[{"t": "mc", "s": 3, "q": "In 2026, on which night do Kali Puja and Diwali both fall?", "o": ["Sunday 8 November", "Wednesday 4 November", "Friday 13 November", "Sunday 1 November"], "a": 0, "e": "Kali Puja and Diwali fall together on the new moon night of Kartik, Sunday 8 November 2026. The Hamilton class was held four days before, so its practices were meant for the days leading up to that night.", "r": "What will I actually do on that night, and with whom?"}, {"t": "mc", "s": 4, "q": "Sri Ramakrishna compared Brahman and Shakti to fire and its power to burn. What was he teaching by it?", "o": ["That Shakti is a lower stage, to be passed through", "That the two cannot be separated: accept one and you must accept the other", "That fire is a symbol of the Divine Mother's anger", "That Brahman creates Shakti as its first product"], "a": 1, "e": "“Brahman and Shakti are identical, like fire and its power to burn. If you accept the one you must accept the other.” You cannot have a fire that does not burn, nor burning without fire. So Kali is not a lesser god beside the Absolute.", "r": "Do I secretly treat the personal God as a lower stage than the formless?"}, {"t": "match", "s": 4, "q": "Which illustration goes with which point? Choose one for each line.", "rows": ["“If you accept the one you must accept the other.”", "“Thinking of the snake, one must think of its wriggling motion.”", "“The sea calm is the Absolute; the same sea in waves is Divine Mother.”", "“This Kali is Brahman in manifestation.”"], "c": ["Fire and its power to burn", "The snake still and moving", "The calm sea and the waves"], "ans": [0, 1, 2, 1], "e": "The first is Sri Ramakrishna's fire illustration, the second his snake illustration, the third Swami Vivekananda's sea in the Inspired Talks. The fourth is Swami Vivekananda at Belur Math on a Kali Puja night, and he answered it by recalling the snake moving and the snake at rest.", "r": "Which of the three pictures helps me most, and why that one?"}, {"t": "mc", "s": 5, "q": "Who said of the Divine Mother, “She is the sum total of the energy in the universe. Every manifestation of power in the universe is ‘Mother’”?", "o": ["Sri Ramakrishna, at Dakshineswar", "Holy Mother Sri Sarada Devi, at Jayrambati", "Swami Vivekananda, in the Inspired Talks", "Sister Nivedita, in her notes"], "a": 2, "e": "Swami Vivekananda, speaking at Thousand Island Park on 2 July 1895. He added, “She is life, She is intelligence, She is Love,” and “She is time, space and causation.”", "r": "Where did I see power, life, intelligence or love at work today? Whose power was it?"}, {"t": "mc", "s": 6, "q": "After his vision in the Kali temple that “it was She who had become everything”, what did Sri Ramakrishna do that brought a complaint to Mathur Babu?", "o": ["He stopped dressing the image", "He refused to let anyone else enter the shrine", "He sold the temple's silver vessels", "He fed a cat with the food meant as the Mother's offering"], "a": 3, "e": "“I fed a cat with the food that was to be offered to the Divine Mother. I clearly perceived that the Divine Mother Herself had become everything, even the cat.” Mathur Babu, who understood the state his priest was in, told the officials to leave him alone.", "r": "Which person or creature in my day am I least able to see as Hers?"}, {"t": "mc", "s": 8, "q": "Govinda asked why the Divine Mother is black. What was Sri Ramakrishna's answer?", "o": ["That She appears black because we are far from Her, as lake water looks black from a distance", "That black is the colour of time and so of death", "That the image was painted so by the sculptor's custom", "That Her blackness hides Her true form from the unworthy"], "a": 0, "e": "“You see Her as black because you are far away from Her. Go near and you will find Her devoid of all colour.” He compared it to the water of a lake and to the blue of the sky, and added, “The nearer you come to God, the more you will realize that He has neither name nor form.”", "r": "What in my life looks dark mainly because I am standing far away from it?"}, {"t": "mc", "s": 9, "q": "Sri Ramakrishna explained the Mother standing on Siva as the union of Purusha and Prakriti. What does the prostrate figure stand for?", "o": ["Death, which She has conquered", "Pure consciousness, which does not act, and on which all activity rests", "The ego of the devotee, crushed underfoot", "A demon killed in battle"], "a": 1, "e": "“Purusha is inactive; therefore Siva lies on the ground like a corpse. Prakriti performs all Her activities in conjunction with Purusha.” Read as a picture of ourselves: all our activity standing on a ground of awareness we have forgotten, and never separated from it.", "r": "Where do I act as though my own deepest Self were lying still, forgotten, under my busyness?"}, {"t": "mc", "s": 11, "q": "The garland of heads is read as the varnamala, the garland of letters. What does each letter stand for?", "o": ["A demon She killed in battle", "A year of Her existence", "A living power, a Matrika or “little mother”, from which the cosmos is produced", "A verse of the Devi Mahatmya"], "a": 2, "e": "The aksharas of the alphabet, counted as fifty in the Tantric texts and as fifty-two where ksa, tra and jna are counted too, are the Matrikas, the mother-powers of sound. The Shiva Sutras call Matrika the ground of knowledge: even our thinking runs on Her letters. The older reading of the heads as egos given up does not conflict with this one.", "r": "If every word I speak is made of Her, which of my words today would I take back?"}, {"t": "match", "s": 10, "q": "What does each detail of the image stand for? Choose one for each line.", "rows": ["The garland of heads", "The girdle of hands", "The sword", "The raised open hand"], "c": ["Egos given up, worn at Her heart", "Our actions, made into Her ornament", "The cutting of bondage and ignorance", "“Do not fear”"], "ans": [0, 1, 2, 3], "e": "Two hands destroy and two hands protect, in one figure: the sword cuts bondage, not people; the lower hand gives; the raised hand says, do not fear. The garland is read as the ego severed and kept close to Her, the girdle as the hands of action worn as an ornament once they work for Her.", "r": "What would I have to let Her cut away to come closer to Her?"}, {"t": "mc", "s": 12, "q": "In the illustration of the monkey and the kitten, what distinguishes the kitten?", "o": ["It climbs higher than the monkey", "It holds on to its mother with great effort", "It finds its own food and needs no mother", "It cannot cling at all; it cries and is carried"], "a": 3, "e": "“The kitten, of itself, cannot cling to its mother. It lies on the ground and cries, ‘Mew, mew!’ It leaves everything to its mother.” Sri Ramakrishna said his own nature was that of a kitten. Both ways reach the mother; one arrives exhausted.", "r": "In which part of my life am I clinging like the monkey?"}, {"t": "mc", "s": 13, "q": "In his prayer for pure love, what did Sri Ramakrishna ask the Mother to take from him?", "o": ["His virtue and his vice, his knowledge and his ignorance, both of each pair", "Only his vices and his ignorance", "His family duties", "His desire for Brahmajnana only"], "a": 0, "e": "“Mother, here is Thy virtue, here is Thy vice. Take them both and grant me only pure love for Thee. Here is Thy knowledge, here is Thy ignorance. Take them both.” Even the virtues and the knowledge are handed back.", "r": "If I could ask Her for one thing only, what would it be?"}, {"t": "mc", "s": 14, "q": "What did Sri Ramakrishna mean by telling devotees to give God “the power of attorney”?", "o": ["To stop working and wait for God to act", "To hand over the authority to decide, and cry to Her with a fervent heart", "To make a legal will in favour of the temple", "To take a vow of silence for a fixed period"], "a": 1, "e": "“Give God the power of attorney. Let Him do whatever He wants. Be like a kitten and cry to Him with a fervent heart.” Surrender in a legal image: the authority to decide is signed over, while the work continues.", "r": "What one decision could I hand over this week?"}, {"t": "mc", "s": 14, "q": "Holy Mother gave a plain reason for keeping a regular time for japa and meditation. What was it?", "o": ["Because the scriptures prescribe dawn and dusk only", "Because the mind becomes steady within forty days", "Because no one knows when the auspicious moment will come", "Because a teacher must be able to check one's progress"], "a": 2, "e": "“There should be a regular time for the practice of Japa and meditation. For no one knows when the auspicious moment will come. It comes suddenly, one has no hint of it before hand.” She also said, “Whether the mind becomes steady or not, practise Japa.”", "r": "What hour of the day could hold one fixed minute of japa, starting tomorrow?"}, {"t": "mc", "s": 15, "q": "On the night of the Phalaharini Kali Puja in 1872, what did Sri Ramakrishna do?", "o": ["He left Dakshineswar for Kamarpukur", "He first entered samadhi before the image", "He refused to perform the worship at all", "He worshipped his wife, Sarada Devi, as the Divine Mother"], "a": 3, "e": "He worshipped Sarada Devi as the Divine Mother and placed the fruits of all his spiritual practice at her feet. He told her, “Think of her as the direct embodiment of the Divine Mother of the Universe.” Note that this was a different night from the Kali Puja of Kartik.", "r": "Whom in my life have I failed to see as an embodiment of the Divine?"}, {"t": "mc", "s": 15, "q": "In Holy Mother's dream during the Master's throat illness, why was Mother Kali standing with Her neck bent?", "o": ["She had the same sore in Her throat as the Master", "She was listening to a prayer", "She was weighed down by the garland of heads", "She was looking down at Siva beneath Her feet"], "a": 0, "e": "“I asked Her, ‘Mother, why do you stand like that?’ She replied, ‘It is because of this (pointing to the Master's sore in the throat); I too have it.’” The Mother of the universe, in sympathy with one man's pain. For anyone who finds the fierce form hard to approach, this is the tradition's answer.", "r": "Where do I need to believe that my pain is known and shared?"}, {"t": "mc", "s": 16, "q": "Which of these did Holy Mother say?", "o": ["“Only the pure may call themselves my children.”", "“I am the mother of the virtuous as well as the wicked.”", "“I am the mother of human beings, not of animals.”", "“My children must earn their liberation alone.”"], "a": 1, "e": "She said it in conversation, and when asked whether she was the mother of the birds and animals too she answered, “Yes, of these also.” She also said, “What! You being my child, can you be doomed? Even God can do no harm to my children!”", "r": "If I truly felt held, what fear would I put down today?"}, {"t": "mc", "s": 17, "q": "How does the poem “Kali the Mother” end?", "o": ["“Come, O Mother, come!”", "“The stars are blotted out, The clouds are covering clouds.”", "“Who dares misery love, And hug the form of Death, Dance in Destruction's dance, To him the Mother comes.”", "“Fear not! Fear not!”"], "a": 2, "e": "Those are the closing lines of the poem of 1898. Years later, quoting them, he broke off to say, “It all came true, every word of it... I have proved it. For I have hugged the form of Death!”", "r": "When did something terrible in my life turn out to carry Her blessing?"}, {"t": "match", "s": 18, "q": "Vidya maya or Avidya maya? Choose one for each line.", "rows": ["The taste for holy company, devotion and renunciation", "The objects of the five senses, which make one forget God", "The half of Her power that leads us home", "The half that scatters us among things"], "c": ["Vidya maya", "Avidya maya"], "ans": [0, 1, 0, 1], "e": "“Mahamaya contains both Vidya-maya, the illusion of knowledge, and Avidya-maya, the illusion of ignorance.” Both are Hers. “Bondage and liberation are both of Her making.” The useful exercise is to sort one ordinary day into the two columns.", "r": "Which pulls in my day lead me towards Her, and which make me forget Her?"}, {"t": "match", "s": 19, "q": "The four Shaktis: at which level does each work? Choose one for each line.", "rows": ["Khechari", "Gochari", "Dikchari", "Bhuchari"], "c": ["The knower, the sense of “I”", "The inner organ: mind, intellect, ego", "The senses, going out in all directions", "The existing objects of the world"], "ans": [0, 1, 2, 3], "e": "One power at four distances from us. The Shaiva tradition calls the four the Karanesvaris. The names are not in our three books, so they are given as that tradition's teaching. The remedy is not to crush any of them, since all four are Her, but to align them.", "r": "Which of my four powers is least aligned with my goal just now?"}, {"t": "mc", "s": 20, "q": "A common obstacle is that the short prayers through the day bring no feeling. What does this class advise?", "o": ["Wait until devotion arises, then begin", "Replace them with longer formal worship", "Say them only on festival days", "Say them anyway: the practice is the saying, not the feeling"], "a": 3, "e": "Holy Mother removed the obstacle: “Whether the mind becomes steady or not, practise Japa.” The line is said; the feeling comes in its own time, or it does not, and the line is still said. When it lapses, begin again without self-reproach.", "r": "What has stopped me before, and what will I do differently when it stops me again?"}, {"t": "mc", "s": 21, "q": "Which spirit does the class name as the one to avoid in keeping Diwali?", "o": ["Bargaining: lamps lit so that the year will go well", "Simplicity: one lamp rather than many", "Hospitality: inviting someone who would be alone", "Silence: lighting the lamp without speaking"], "a": 0, "e": "The spirit to avoid is worship as an insurance payment. The spirit to keep is a child making the house ready for its mother. The other three are among the practices suggested for the days before the new moon.", "r": "Which two of the five practices will I actually do, and when?"}, {"t": "mc", "s": 22, "q": "The verse that opens our prayer, jayanti mangala kali, names Her both fiercely and gently. From where is it taken?", "o": ["The Bhagavad Gita, chapter 11", "The Argala Stotram, recited before the Devi Mahatmya", "The Gospel of Sri Ramakrishna", "A song of Ramprasad"], "a": 1, "e": "It is verse 2 of the Argala Stotram, one of the three preliminary hymns recited before the Devi Mahatmya. It names Her as Jayanti, Mangala, Kali, Bhadrakali and Kapalini, and in the same breath as Shiva the gracious, Kshama the forgiving and Dhatri who upholds all.", "r": "Which line of the prayer is mine, the one I would have said if I had found the words?"}, {"t": "mc", "s": 23, "q": "In the guided meditation, what is said about the mind wandering?", "o": ["It shows the practice has failed", "It should be prevented by counting the breath", "The wandering is not failure; the returning is the practice", "It means the sitting should be cut short"], "a": 2, "e": "“When the mind wanders, and it will, bring it back without comment.” In the last part of the sitting the image is the Mother's lap: a child asleep there is not holding on, it has been picked up. Nothing has to be achieved, and nothing has to be felt.", "r": "Do I treat my wandering mind as an enemy or as something to be gently returned?"}, {"t": "mc", "s": 24, "q": "Which three lines does the class suggest for the evening review?", "o": ["What I achieved, what I failed at, what I deserve", "What I read, what I prayed, what I gave", "Who helped me, whom I helped, what I owe", "Where I saw Her, where I forgot Her, one thing for tomorrow"], "a": 3, "e": "Three lines, said before sleep, and then the day handed back: “Done, and offered.” A blank in the record is information, not failure.", "r": "Will I keep the three lines in writing, or only in my head? Which will I actually sustain?"}, {"t": "mc", "s": 17, "q": "Where and when did Swami Vivekananda write “Kali the Mother”?", "o": ["In Kashmir, in 1898, around his pilgrimage to Amarnath and his worship at Kshir Bhavani", "In Chicago, in 1893, after the Parliament of Religions", "At Dakshineswar, in 1886, beside his Master", "In London, in 1896, for Sister Nivedita"], "a": 0, "e": "Kashmir, 1898. Our own books describe his austerities at Amarnath and the seven days of worship and homa at the temple of Kshir Bhavani that year; accounts outside our books place the writing of the poem on the Dal Lake at Srinagar in late September 1898. He later told the painter Ranada Babu, “I have tried to put down some ideas of the terrible aspects of Mother Kali in my English poem, Kali the Mother.”", "r": "Which line of the poem stays with me, and why that one?"}];

 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:var(--fs-text,13.5px);color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:var(--fs-small,12.5px);color:#6B6B6B;text-align:center;margin-top:12px">Your answers are saved as you go, so you can stop at any time and continue later. Sign in to vedanta.nz to continue on any device.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}
function alertBox(){const el=document.getElementById('fb');el.className='fb no';el.innerHTML='<b>Please choose an answer for every line first.</b>'}
function result(){const p=score;try{localStorage.removeItem(SK)}catch(e){}
 const band=p>=90?['Excellent!','You have absorbed the class beautifully. May the Mother dance in your hearts this Diwali.']:p>=70?['Very good','You have understood most of the class. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+TOT+'</span></p><p class="band">'+band[0]+'</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<b>Q'+(k+1)+'</b> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';
 if(EMBED)r=r.replace('<div class="acts">','<p id="savemsg" style="font-size:var(--fs-text,13.5px);background:#E8EEDF;border-radius:10px;padding:10px 12px;margin-top:14px">'+saveMsg()+'</p><div class="acts">');
 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
 document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
function start(){if(!EMBED)return offer(saved());
 let done=false,n=0,tm=null;const go=v=>{if(done)return;done=true;if(tm)clearInterval(tm);offer(v)};
 window.addEventListener('message',e=>{const d=e.data||{};if(d.type!=='resume')return;const a=valid(d.state),b=saved();go(a&&b?((a.t||0)>=(b.t||0)?a:b):(a||b))});
 app.innerHTML='<div class="card"><p>Loading your quiz…</p></div>';
 const ping=()=>{if(done)return;if(++n>6)return go(saved());try{window.parent.postMessage({type:'ready',code:QCODE},'*')}catch(e){}};
 tm=setInterval(ping,500);ping()}
function offer(v){if(!v)return show();
 const n=v.ans.length;i=n;score=v.score;hdr();document.getElementById('pos').textContent='Paused at question '+(n+1)+' of '+Q.length;
 app.innerHTML='<div class="card"><p class="qn">WELCOME BACK</p><p class="q">You have answered '+n+' of '+Q.length+' questions so far, with '+v.score+' marks.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn gold" id="cont">Continue from question '+(n+1)+' ›</button><button class="btn" id="fresh">Start again</button></div></div>';
 document.getElementById('cont').onclick=()=>{ans=v.ans;score=v.score;i=n;show()};
 document.getElementById('fresh').onclick=()=>{i=0;score=0;ans=[];keep();show()}}
start();
</script></body></html>
