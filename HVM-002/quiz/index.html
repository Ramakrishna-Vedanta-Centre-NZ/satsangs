<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz/course/satsang-study" target="_top">Back to the course</a> · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
<script>
const Q=[{"t": "mc", "s": 3, "q": "A friend says: “Kali is for frightening, dark times, and the Diwali lamp is for happy times, so the two do not belong together.” How would this class answer?", "o": ["The friend is right; that is why Kali Puja is kept on a separate day from Diwali.", "Kali belongs to Bengal and Diwali to the rest of India, so they are kept apart.", "They meet on one night: the new moon night of Kartik, when the lamp is lit in the dark, not instead of it. The Mother is the same in the darkness and in the light.", "The lamp is meant to drive Kali away, so that only the gentle forms of the Mother remain."], "a": 2, "e": "In 2026 Kali Puja and Diwali fall together on the new moon night of Kartik, Sunday 8 November. The class held four days before gave practices for the days leading up to that night. The point of the evening is that the dark night and the lamp are not rivals: we light the lamp in the dark, and both belong to the one Mother.", "r": "What is my own dark night just now, and what small lamp could I light in it?"}, {"t": "mc", "s": 4, "q": "A friend who follows the formless Advaita says: “Worship of Kali is a lower stage, to be left behind once one knows Brahman.” Which reply is closest to Sri Ramakrishna?", "o": ["Brahman and Shakti are identical, like fire and its power to burn; if you accept the one you must accept the other.", "The formless is for the wise and the personal Mother for beginners, and each should keep to their stage.", "Brahman is real and Kali only a useful idea, so she may be used and then dropped.", "Brahman first creates Shakti, so Shakti is a later and lesser thing."], "a": 0, "e": "“Brahman and Shakti are identical, like fire and its power to burn. If you accept the one you must accept the other.” He also said, “Kali is verily Brahman, and Brahman is verily Kali. It is one and the same Reality.” A fire that does not burn is not fire, so the Mother is not a step below the Absolute.", "r": "Do I quietly treat the Mother, or the personal God, as a lower rung than the formless?"}, {"t": "match", "s": 4, "q": "Three pictures were used in the class. Which picture answers each of these four questions?", "rows": ["“Can I accept the formless Brahman and put aside the Mother?”", "“Is the Mother at rest at one time and a different being when the world moves?”", "“Is the quiet of meditation the Absolute, and the busy world something made of different stuff?”", "“Is this Kali, with a form, really Brahman?” (Swami Vivekananda was asked this at Belur Math.)"], "c": ["Fire and its power to burn", "The snake still and moving", "The calm sea and the waves"], "ans": [0, 1, 2, 1], "e": "The fire illustration (Sri Ramakrishna): accept one and you must accept the other. The snake (Sri Ramakrishna): “Thinking of the snake, one must think of its wriggling motion”; the same snake, at rest or moving. The sea (Swami Vivekananda, Inspired Talks): “The sea calm is the Absolute; the same sea in waves is Divine Mother.” At Belur Math on a Kali Puja night Swami Vivekananda answered the fourth question by recalling the snake moving and the snake at rest.", "r": "Which of the three pictures helps me most with the question I actually carry, and why that one?"}, {"t": "mc", "s": 5, "q": "Swami Vivekananda said: “She is the sum total of the energy in the universe.” If we take that seriously, what follows for the strength, intelligence and love I find in myself?", "o": ["They are mine, earned by me, and the Mother takes over only when mine run out.", "They are Hers at work in me, so there is no ground for pride in them and no reason to feel I have to find strength entirely alone.", "They are Hers only when they are used for religious purposes.", "Only the great forces of nature are Hers; the small powers of a person are not."], "a": 1, "e": "He said: “Every manifestation of power in the universe is ‘Mother’”, and added, “She is life, She is intelligence, She is Love.” If every power is Hers, then my own strength, mind and love are Hers moving through me. That is the root of both humility and courage. (Swami Vivekananda, Inspired Talks, 2 July 1895.)", "r": "Where did I see power, life, intelligence or love at work today? Whose power was it?"}, {"t": "mc", "s": 6, "q": "After his vision that it was She who had become everything, Sri Ramakrishna fed a cat with the food meant for the Mother. A devotee today wants to take the same truth into daily life. What is the sound way to begin?", "o": ["Offer the food of the shrine to animals, since that is what he did.", "Stop the formal worship, since everything is already Hers.", "Wait for a vision of one's own before treating anyone differently.", "Take one person or creature that is hard to see as Hers, and for a moment today look at them as a form of the Mother."], "a": 3, "e": "“I fed a cat with the food that was to be offered to the Divine Mother. I clearly perceived that the Divine Mother Herself had become everything, even the cat.” He did not drop worship: he saw the Mother in the image and in the one at the door. For us the practice is the small, repeated looking, beginning with the person we find hardest.", "r": "Which person or creature in my day am I least able to see as Hers?"}, {"t": "mc", "s": 8, "q": "Something in my life looks dark and frightening. Using Sri Ramakrishna's answer to Govinda about the Mother's colour, what is the first thing to try?", "o": ["Step further back, so that it looks smaller.", "Paint it in a brighter colour in the mind and refuse to look at it directly.", "Come closer to it and know it more intimately, because things look dark mainly when we stand far away.", "Wait for the sky to change, because colour is a matter of the weather."], "a": 2, "e": "“You see Her as black because you are far away from Her. Go near and you will find Her devoid of all colour.” He compared it to the water of a lake and the blue of the sky, both of which lose their colour as we come near. We do not claim every hardship dissolves on close inspection; the teaching is that distance and unfamiliarity add much of the darkness.", "r": "What in my life looks dark mainly because I have been standing far away from it?"}, {"t": "mc", "s": 9, "q": "A student says: “The image shows the Mother crushing Shiva beneath Her feet.” Which answer follows Sri Ramakrishna's own words?", "o": ["Kali looks at Shiva; the picture shows the union of Purusha and Prakriti: Purusha is inactive, and Prakriti performs all Her activities in conjunction with Purusha.", "She is trampling a defeated enemy, which is why Shiva lies like a corpse.", "Shiva represents the ego of the devotee, flattened beneath Her feet.", "Shiva is dead, and She dances because He no longer matters."], "a": 0, "e": "“Kali stands on the bosom of Siva; Siva lies under Her feet like a corpse; Kali looks at Siva. All this denotes the union of Purusha and Prakriti.” Read as a picture of ourselves: all our activity stands on a ground of awareness that does not act, and is never separate from it.", "r": "Where do I act as though my own deepest Self were lying still and forgotten beneath my busyness?"}, {"t": "mc", "s": 11, "q": "The garland of heads is also read as the garland of letters, each letter a Matrika or mother-power. What follows for the way we speak?", "o": ["Only Sanskrit words carry Her power, so the rest of our speech does not matter.", "Every word we speak is made of Her power, so speech can be offered with care and is not a trivial thing.", "Speech is a distraction, and only silence is holy.", "The letters are a reminder of the demons She defeated, and have no bearing on how we speak."], "a": 1, "e": "In the Shaiva and Tantric tradition the letters are the Matrikas, the mother-powers of sound, and creation is a phonetic manifestation of Shabda Brahman. This reading is from that tradition and from teachers of the Order, not from our three books. Sri Ramakrishna did say, “God and His name are identical.” The practical point: if speech is made of Her, then each word is either an offering or a waste of it.", "r": "If every word I speak is made of Her, which of my words today would I take back?"}, {"t": "match", "s": 10, "q": "These are four worries a devotee might bring to the image. Which detail of the image answers each?", "rows": ["“Will She turn on me if I am afraid of Her?”", "“What must go if I am to come close?”", "“What happens to my ego once I give it up?”", "“What becomes of my ordinary actions when they are done for Her?”"], "c": ["The raised open hand, “Do not fear”", "The sword, cutting bondage and ignorance", "The garland of heads, worn at Her heart", "The girdle of hands, an ornament"], "ans": [0, 1, 2, 3], "e": "Two hands destroy and two hands protect in one figure. The raised hand says do not fear. The sword cuts bondage, not people. The garland is read as egos given up and kept close to Her. The girdle is read as our hands of action, worn as Her ornament once they work for Her. Sri Ramakrishna: “Syama-Kali has a somewhat tender aspect ... She is the Dispenser of boons and the Dispeller of fear.” The symbolic readings are traditional teaching, not quotation.", "r": "What would I have to let Her cut away in order to come closer to Her?"}, {"t": "mc", "s": 12, "q": "Before an important decision, someone has done their honest best and is still anxious. Which attitude matches the kitten rather than the monkey?", "o": ["Hold on tighter by planning every possible outcome in advance, as the baby monkey clings.", "Decide that nothing is worth doing, and wait without effort.", "Pretend there is no worry, so that the Mother is not troubled.", "Cry out to the Mother with real need and place the result in Her hands, as a kitten leaves everything to its mother."], "a": 3, "e": "“The kitten, of itself, cannot cling to its mother. It lies on the ground and cries, ‘Mew, mew!’ It leaves everything to its mother.” Sri Ramakrishna said his own nature was the kitten's. Both ways reach the mother; clinging is tiring, and crying out is honest. He also said, “I move as Thou movest me; I do as Thou makest me do”: action continues, but the weight of the result is handed over.", "r": "In which part of my life am I clinging like the monkey?"}, {"t": "mc", "s": 13, "q": "Sri Ramakrishna prayed: “Here is Thy knowledge, here is Thy ignorance. Take them both and grant me only pure love for Thee.” Why would he hand back even his knowledge and his virtue?", "o": ["Because he considered virtue and knowledge worthless to other people.", "Because he was in despair and had given up the spiritual life.", "So that nothing, good or bad, stands between him and pure love; even virtue and knowledge can become something to be proud of.", "Because he wished to become ignorant and so be rid of responsibility."], "a": 2, "e": "He gave back virtue and vice, knowledge and ignorance, “Take them both”, and asked only for “pure love for Thy Lotus Feet, love that seeks no return.” The prayer is not against goodness; it refuses to let even goodness, or knowledge, become a possession set up between the child and the Mother.", "r": "If I could ask Her for one thing only, what would it be, and is it the thing I really need?"}, {"t": "mc", "s": 14, "q": "A friend thinks surrender, “giving God the power of attorney”, means stopping effort and waiting. How would you answer from Sri Ramakrishna's words?", "o": ["Surrender signs over the authority to decide, while one still cries to Her with a fervent heart and does one's work as She moves one.", "Your friend is right: when all is given to God, nothing is left for us to do.", "It means making a legal will in favour of the temple.", "It means taking a vow of silence until the Mother answers."], "a": 0, "e": "“Give God the power of attorney. Let Him do whatever He wants. Be like a kitten and cry to Him with a fervent heart.” A power of attorney does not end the work; it changes who holds the decision. Compare, “I move as Thou movest me; I do as Thou makest me do.”", "r": "What one decision could I hand over this week?"}, {"t": "mc", "s": 15, "q": "Someone says: “I will keep a time for japa when I feel inspired.” Which of Holy Mother's lines speaks to this?", "o": ["“Japa is only for those who already feel devotion.”", "“There should be a regular time for the practice of Japa and meditation. For no one knows when the auspicious moment will come.”", "“Wait until the mind is quiet, and then begin.”", "“Practise only on festival days, when the heart is open.”"], "a": 1, "e": "She continued: “It comes suddenly, one has no hint of it before hand.” A regular time keeps us at the door when the moment arrives. She also said, “God is realized only through His grace. Nonetheless, one must perform Japa and meditation, for they remove the impurities of one's mind.” The other three options are not hers.", "r": "What hour of the day could hold one fixed minute of japa, starting tomorrow?"}, {"t": "mc", "s": 16, "q": "The Master worshipped Sarada Devi as the Divine Mother on the Phalaharini Kali Puja night of 1872. What does this tell us about where to look for the Mother?", "o": ["The image is only a symbol and should be given up in favour of persons.", "She can be found only in women who have renounced the world.", "It was a private ritual with no meaning beyond that one night.", "She is not only in the image; She can be recognised in a living person, and a mother or woman near us can be honoured as Her embodiment."], "a": 3, "e": "He told her, “Think of her as the direct embodiment of the Divine Mother of the Universe,” and placed the fruits of his practice at her feet. Holy Mother said, “He left me behind this time for demonstrating that Motherhood to the world.” Note that this was a different night from the Kali Puja of Kartik.", "r": "Whom in my life have I failed to see as an embodiment of the Divine Mother, and how could I honour Her in them?"}, {"t": "mc", "s": 17, "q": "In Holy Mother's dream during the Master's throat illness, Mother Kali stood with Her neck bent, because She had the same sore. What does the dream teach about the Mother of the universe?", "o": ["That illness is a punishment which even She cannot lift.", "That She was weary of the world and wished to withdraw from it.", "That She shares our suffering closely, even one man's sore throat, and is not distant from pain.", "That the Master's illness was only an appearance and of no concern to Her."], "a": 2, "e": "“I asked Her, ‘Mother, why do you stand like that?’ She replied, ‘It is because of this (pointing to the Master's sore in the throat); I too have it.’” For anyone who finds the fierce form hard to approach, this is the gentle answer of the tradition.", "r": "Where do I need to believe that my pain is known and shared?"}, {"t": "mc", "s": 18, "q": "A person says: “I have done wrong things, so the Mother has no place for me.” Which words of Holy Mother answer this?", "o": ["“I am the mother of the virtuous as well as the wicked.”", "“Only the pure may call themselves my children.”", "“My children must earn their liberation alone.”", "“I am the mother of human beings, not of animals.”"], "a": 0, "e": "She also said, “Even God can do no harm to my children!” and, asked whether she was the mother of birds and animals, answered “Yes, of these also.” This is not permission to be careless: in the same conversations she insisted on japa and meditation, because they remove the impurities of the mind.", "r": "If I truly felt held, what fear would I put down today?"}, {"t": "mc", "s": 19, "q": "In “Kali the Mother”, Swami Vivekananda wrote: “Who dares misery love, And hug the form of Death ... To him the Mother comes.” Years later he said, “I have proved it. For I have hugged the form of Death!” What is the fairest reading?", "o": ["That one should go looking for misery in order to please Her.", "That one who faces real suffering and death without flinching, and finds the Mother in them, meets Her; not that suffering is to be sought for its own sake.", "That suffering is unreal and need not be taken seriously.", "That the Mother comes only to those who give up life."], "a": 1, "e": "The poem asks us to worship the terrible as well as the sweet, since both are Hers. The reading above is our own interpretation of the lines and of his later remark. It does not say that pain is good, but that to meet it with courage and without pretending is to meet Her.", "r": "When did something terrible in my life turn out to carry Her blessing?"}, {"t": "match", "s": 18, "q": "Sort four moments of an ordinary day: does each belong to Vidya maya, the half of Her power that leads us home, or to Avidya maya, the half that scatters us among things?", "rows": ["A friend invites you to evening prayer and you go gladly.", "You scroll for an hour and forget even to say thank you.", "You feel the pull to put down an old grudge.", "You chase a bigger house in order to feel secure."], "c": ["Vidya maya", "Avidya maya"], "ans": [0, 1, 0, 1], "e": "“Mahamaya contains both Vidya-maya, the illusion of knowledge, and Avidya-maya, the illusion of ignorance.” Sri Ramakrishna named devotion, holy company and renunciation as Vidya maya, and the objects of the five senses that make one forget God as Avidya maya. Both are Hers: “Bondage and liberation are both of Her making.” Sorting a real day is a judgement, not a law, so notice where you would disagree.", "r": "Which pulls in my day lead me towards Her, and which make me forget Her?"}, {"t": "match", "s": 19, "q": "The Shaiva tradition names four powers of the Mother working in us. Which power is at work in each situation?", "rows": ["“I did this. I am not good enough. I am the one who matters here.”", "“My thoughts race and scatter, and I cannot settle on one.”", "“My eyes and ears run after every new thing.”", "“The things in my house and workplace keep pulling my attention.”"], "c": ["Khechari, the knower, the sense of “I”", "Gochari, the inner organ: mind, intellect, ego", "Dikchari, the senses going out in all directions", "Bhuchari, the existing objects of the world"], "ans": [0, 1, 2, 3], "e": "One power at four distances from us. The names and meanings are the Shaiva (Trika) tradition's teaching and are not in our three books. The practice is not to crush any of the four, since all four are Hers, but to align them with the goal so that they lead us home and do not bind us.", "r": "Which of my four powers is least aligned with my goal just now, and what one change would align it?"}, {"t": "mc", "s": 20, "q": "You promised yourself a fixed minute of japa each day, but missed a whole week. Which advice from the class fits?", "o": ["Wait until a feast day, so that the practice starts with fresh energy.", "Give up the discipline, since a missed week shows it is not suited to you.", "Make up the missed week by doing it all in one long sitting.", "Begin again at once, without self-reproach: the practice is the saying, and “Whether the mind becomes steady or not, practise Japa.”"], "a": 3, "e": "Holy Mother: “Whether the mind becomes steady or not, practise Japa.” The line is said whether or not feeling arrives, and when the habit lapses we begin again, not with blame. The Study Companion adds the practical point that a missed day is information, not failure.", "r": "What has stopped me before, and what will I do differently when it stops me again?"}, {"t": "mc", "s": 21, "q": "Which of these is Diwali kept in the right spirit, according to the class?", "o": ["Lighting many lamps so that the Mother will protect the year's business.", "Lighting no lamp at all, since the Mother is beyond form.", "A child making the house ready for its mother, perhaps by inviting someone who would otherwise be alone.", "Keeping the festival only for those in the family who are devout."], "a": 2, "e": "The spirit to avoid is worship as an insurance payment, a lamp lit so that the year will go well. The spirit to keep is a child making the house ready for its mother. Suggested practices for the days before the new moon include the lamp at dusk, japa, an offering before each action, and an evening review.", "r": "Which two of the five practices will I actually do, and when?"}, {"t": "mc", "s": 22, "q": "The prayer's opening verse names the Mother as Kali and Bhadrakali, and in the same breath as Kshama the forgiving and Dhatri who upholds all. What does putting these together teach?", "o": ["That the fierce and the gentle are names of one Mother, so we do not have to choose which face to love.", "That Kali is the angry face and Kshama the real face, so we should keep to the second.", "That these are separate goddesses to be worshipped one at a time.", "That the gentle names are only for beginners who cannot yet face the fierce ones."], "a": 0, "e": "The verse is verse 2 of the Argala Stotram, recited before the Devi Mahatmya: “jayanti mangala kali bhadrakali kapalini | durga shiva kshama dhatri svaha svadha namo'stu te”. The same Mother is Jayanti, Mangala, Kali, Kapalini, Durga, Shiva, Kshama and Dhatri, and Sri Ramakrishna said of Her, “My Divine Mother is not only formless, She has forms as well.”", "r": "Which line of the prayer is mine, the one I would have said if I had found the words?"}, {"t": "mc", "s": 23, "q": "During the guided meditation you notice that for ten minutes you have been planning dinner. What does the class advise?", "o": ["Stop the sitting, since the mind will not settle today.", "Bring the mind back without comment: the returning is the practice, not the failure.", "Scold the mind firmly so that it learns not to wander.", "Count the breath harder, so that the thought cannot come back."], "a": 1, "e": "“When the mind wanders, and it will, bring it back without comment.” In the last part of the sitting the image is the Mother's lap: a child asleep there is not holding on, it has been picked up. Nothing has to be achieved, and nothing has to be felt.", "r": "Do I treat my wandering mind as an enemy, or as something to be gently returned?"}, {"t": "mc", "s": 24, "q": "You keep the evening review and tonight you cannot recall seeing the Mother anywhere in the day. How should this be read?", "o": ["As proof that the practice is not working and should be dropped.", "As a sign that you must have done something wrong that day.", "As a reason to invent a moment of devotion, so the page is not blank.", "As information, not failure: note it, offer the day, and set one thing for tomorrow."], "a": 3, "e": "The three lines are: where I saw Her, where I forgot Her, and one thing for tomorrow. Said before sleep, then the day is handed back: “Done, and offered.” A blank in the record tells you where to look tomorrow; it is not a verdict.", "r": "Will I keep the three lines in writing, or only in my head? Which will I actually sustain?"}, {"t": "mc", "s": 25, "q": "Swami Vivekananda wrote of his early years, “How I used to hate Kali! ... But I had to accept Her at last!” What can we fairly learn from this?", "o": ["That sensitive people are better off avoiding the fierce form altogether.", "That acceptance came only because he was forced against his will.", "That honest struggle with the fierce form is not a barrier to Her; one need not pretend to love Her before one does.", "That argument alone, if clever enough, settles the matter."], "a": 2, "e": "He also said, “She made a slave of me.” The lesson is our own reading: his refusal was honest and his acceptance came in the end, so resistance is not proof that the way is wrong. The struggle is told more fully in the Study Companion.", "r": "What do I resist that may be Her teaching me?"}];
const M=4;let i=0,score=0,ans=[];const TOT=100;

let saveState='';
const SK='rvcQuiz:'+QCODE;
function keep(){const st=(ans.length&&ans.length<Q.length)?{score:score,ans:ans,t:Date.now()}:null;try{if(st)localStorage.setItem(SK,JSON.stringify(st));else localStorage.removeItem(SK)}catch(e){}if(EMBED)try{window.parent.postMessage({type:'progress',code:QCODE,state:st},'*')}catch(e){}}
function valid(v){return v&&Array.isArray(v.ans)&&v.ans.length>0&&v.ans.length<Q.length&&typeof v.score==='number'?v:null}
function saved(){try{return valid(JSON.parse(localStorage.getItem(SK)||'null'))}catch(e){return null}}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='saved')saveState='saved';else if(d.type==='saveError')saveState='error';else if(d.type==='notMember')saveState='guest';else return;const el=document.getElementById('savemsg');if(el)el.innerHTML=saveMsg()});
function saveMsg(){return saveState==='saved'?'✓ Your result has been saved to your account. See all your results on <a href="https://www.vedanta.nz/my-journey" target="_top">My Journey</a>.':saveState==='error'?'Your result could not be saved just now. Please try again, or write to mail@vedanta.nz.':saveState==='guest'?'Sign in to vedanta.nz to save your results.':'Saving your result…'}
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hdr(){document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';document.getElementById('sc').textContent='Score: '+score+' / '+TOT;document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%'}
function fb(ok,gain,ansText,q){const el=document.getElementById('fb');el.className='fb '+(ok?'ok':'no');el.innerHTML='<b>'+(ok?'Correct! +'+gain+' marks':(gain>0?'Partly right: +'+gain+' of 4 marks.':'Not quite.')+(ansText?' The answer is: '+esc(ansText):''))+'</b>'+esc(q.e)+' <i>(See slide '+q.s+'.)</i><div class="refl"><b>Reflect:</b> '+esc(q.r)+'</div>';document.getElementById('nx').style.display='inline-block';keep();hdr()}
function show(){hdr();if(i>=Q.length)return result();const q=Q[i];
 let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · 4 MARKS'+(q.t==='match'?' · MATCHING':'')+'</p><p class="q">'+esc(q.q)+'</p>';
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:var(--fs-text,13.5px);color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:var(--fs-small,12.5px);color:#6B6B6B;text-align:center;margin-top:12px">Your answers are saved as you go, so you can stop at any time and continue later. Sign in to vedanta.nz to continue on any device.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}

function result(){const p=score;try{localStorage.removeItem(SK)}catch(e){}
 const band=p>=90?['Excellent!','You have absorbed the class beautifully. May the Mother dance in your hearts this Diwali.']:p>=70?['Very good','You have understood most of the class. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+TOT+'</span></p><p class="band">'+band[0]+'</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<b>Q'+(k+1)+'</b> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';
 if(EMBED)r=r.replace('<div class="acts">','<p id="savemsg" style="font-size:var(--fs-text,13.5px);background:#E8EEDF;border-radius:10px;padding:10px 12px;margin-top:14px">'+saveMsg()+'</p><div class="acts">');
 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
 document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
function start(){if(!EMBED)return offer(saved());
 let done=false,n=0,tm=null;const go=v=>{if(done)return;done=true;if(tm)clearInterval(tm);offer(v)};
 window.addEventListener('message',e=>{const d=e.data||{};if(d.type!=='resume')return;const a=valid(d.state),b=saved();go(a&&b?((a.t||0)>=(b.t||0)?a:b):(a||b))});
 app.innerHTML='<div class="card"><p>Loading your quiz…</p></div>';
 const ping=()=>{if(done)return;if(++n>6)return go(saved());try{window.parent.postMessage({type:'ready',code:QCODE},'*')}catch(e){}};
 tm=setInterval(ping,500);ping()}
function offer(v){if(!v)return show();
 const n=v.ans.length;i=n;score=v.score;hdr();document.getElementById('pos').textContent='Paused at question '+(n+1)+' of '+Q.length;
 app.innerHTML='<div class="card"><p class="qn">WELCOME BACK</p><p class="q">You have answered '+n+' of '+Q.length+' questions so far, with '+v.score+' marks.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn gold" id="cont">Continue from question '+(n+1)+' ›</button><button class="btn" id="fresh">Start again</button></div></div>';
 document.getElementById('cont').onclick=()=>{ans=v.ans;score=v.score;i=n;show()};
 document.getElementById('fresh').onclick=()=>{i=0;score=0;ans=[];keep();show()}}
start();
