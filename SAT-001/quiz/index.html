<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision Quiz | Satsang SAT-001</title>
<meta name="description" content="Ten-question revision quiz for the satsang on the Divine Mother, Ramakrishna Vedanta Centre NZ.">
<meta property="og:title" content="Revision quiz: The Divine Mother">
<meta property="og:description" content="Ten questions on today's satsang. See how much you remember!">
<meta property="og:image" content="https://ramakrishna-vedanta-centre-nz.github.io/satsangs/SAT-001/cover.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&family=Noto+Sans:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&display=swap">
<style>
:root{--navy:#12285A;--navy2:#1D3770;--cream:#FBF5EA;--card:#FFFDF8;--gold:#C9A24A;--goldt:#6B4E0E;--green:#2F5A2E;--pink:#C2557A;--ink:#1E1E1E;--line:#E6DAC3}
*{margin:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans',Arial,sans-serif;min-height:100vh}
header{background:var(--navy);color:var(--cream);padding:18px 16px 22px;text-align:center}
header img{width:56px;height:66px;object-fit:contain}
.ey{font:700 12px 'Noto Sans',sans-serif;letter-spacing:3px;color:#E6C36A;margin-top:6px}
h1{font:700 26px/1.2 'Noto Serif',serif;margin:6px 0 4px}
header p{font-size:15px;color:#F1ECDF}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:#5A5A5A;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;box-shadow:0 2px 8px rgba(19,41,91,.08)}
.qn{font:700 12px 'Noto Sans',sans-serif;letter-spacing:2px;color:var(--goldt)}
.q{font:700 20px/1.35 'Noto Serif',serif;color:#13295B;margin:8px 0 16px}
.dev{font-family:'Noto Sans Devanagari','Noto Sans',sans-serif}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;font:500 17px 'Noto Sans',sans-serif;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{border-color:var(--green);background:#E3EDDF}
.opt.wrong{border-color:var(--pink);background:#F6E3EA}
.opt:disabled{cursor:default}
input.fill{width:100%;font:500 18px 'Noto Sans',sans-serif;padding:13px 14px;border:2px solid var(--line);border-radius:10px;margin-bottom:10px}
input.fill:focus{outline:none;border-color:var(--gold)}
.btn{display:inline-block;background:var(--navy);color:var(--cream);border:0;border-radius:10px;padding:13px 22px;font:700 16px 'Noto Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);color:var(--navy)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15.5px;line-height:1.55;display:none}
.fb.ok{display:block;background:#E3EDDF;border-left:5px solid var(--green)}
.fb.no{display:block;background:#F6E3EA;border-left:5px solid var(--pink)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:flex-end;margin-top:16px}
.res{text-align:center}
.score{margin:6px 0;color:#13295B}
.score .big{font:700 64px/1 'Noto Serif',serif}
.score .of{font:700 28px 'Noto Serif',serif;color:#5A5A5A}
.band{font:700 20px 'Noto Serif',serif;color:var(--green);margin-bottom:8px}
.res p{font-size:16px;line-height:1.55;margin-bottom:12px}
.rev{text-align:left;margin-top:18px}
.rev div{padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14.5px;line-height:1.45}
.rev .r{background:#E3EDDF}.rev .w{background:#F6E3EA}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
footer{text-align:center;font-size:13px;color:#5A5A5A;padding:0 16px 30px}
footer a{color:#13295B}
</style></head><body>
<header><img src="../logo.png" alt="Ramakrishna Vedanta NZ emblem"><p class="ey">REVISION QUIZ · SAT-001</p><h1>The Divine Mother</h1><p>10 questions · 10 marks each · 100 marks in all</p></header>
<main>
<div class="bar"><i id="prog"></i></div>
<div class="meta"><span id="pos"></span><span id="sc"></span></div>
<div id="app"></div>
</main>
<footer>Ramakrishna Vedanta Centre NZ · <a href="../">Back to the slides</a> · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
<script>
const Q=[
{t:'mc',q:'Sri Ramakrishna said Brahman and Śakti are one, just like…',o:['A potter and the pot he makes','Fire and its power to burn','The sun and the moon','A seed and the tree it becomes'],a:1,e:'He taught that we cannot think of fire without its power to burn. When the Reality is still, we call it Brahman; when it creates, preserves and dissolves, we call it Śakti, the Mother.',s:5},
{t:'mc',q:'In the Devī Sūkta of the Ṛg Veda, who speaks in the first person as the Goddess?',o:['The seer Vāk, daughter of the sage Ambhṛṇa','Gārgī','Maitreyī','Sītā'],a:0,e:'Having realised her oneness with the Goddess, the seer Vāk speaks as the Goddess herself: “I am the sovereign Queen…”',s:6},
{t:'fill',q:'Pratyabhijñāhṛdayam, sūtra 1: “Consciousness (Citi), perfectly free, is the cause of the whole ______.”',a:['universe','world','cosmos'],show:'universe',e:'citiḥ svatantrā viśva-siddhi-hetuḥ: free Consciousness is the cause of the universe. The word Citi is feminine: she is the Mother.',s:9},
{t:'mc',q:'According to Sri Ramakrishna, which of these belongs to Vidyā Māyā, the power that frees?',o:['Attachment to possessions','The sense of “I and mine”','Discrimination, devotion and the company of the holy','Forgetting who we really are'],a:2,e:'Vidyā Māyā leads us inward: discrimination, dispassion, devotion, compassion and holy company. The other three belong to Avidyā Māyā, which binds.',s:11},
{t:'mc',q:'Of her four powers within us, Gocarī moves in…',o:['The sky of consciousness, as the knower','The inner instrument: mind, intellect and ego','The senses of knowing and action','The objects of the outer world'],a:1,e:'Khecarī is the knower, Gocarī the inner instrument (mind, intellect, ego), Dikcarī the senses, and Bhūcarī the objects. Turned outward they bind; turned inward by her grace they reveal her.',s:12},
{t:'fill',q:'Complete the refrain of the Yā Devī chant: “namas tasyai namas tasyai namas tasyai namo ______”',dev:'नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो …',a:['namah','namaha','nama'],show:'namaḥ (नमः)',e:'Salutations to her, salutations to her, salutations to her, salutations again and again.',s:14},
{t:'mc',q:'Which of the five sheaths (kośas) is the Mother’s most contracted, most reduced form?',o:['Ānandamaya, the sheath of bliss','Vijñānamaya, the sheath of intellect','Prāṇamaya, the sheath of vital energy','Annamaya, the physical body'],a:3,e:'Read from the Mother’s side, the sheaths are her step-by-step contraction, from pervasive bliss down to the body, her most reduced form. Beyond all five is Parāśakti: we are bubbles in her ocean.',s:16},
{t:'mc',q:'How many petals does the Anāhata (heart) lotus have, and what is its bīja mantra?',o:['4 petals, laṁ','10 petals, raṁ','12 petals, yaṁ','16 petals, haṁ'],a:2,e:'Mūlādhāra 4 (laṁ), Svādhiṣṭhāna 6 (vaṁ), Maṇipūra 10 (raṁ), Anāhata 12 (yaṁ), Viśuddha 16 (haṁ), Ājñā 2 (oṁ), Sahasrāra a thousand.',s:17},
{t:'mc',q:'Where did Swami Vivekananda begin the Durgā Pūjā in 1901, with Holy Mother’s blessing?',o:['Dakshineswar','Belur Math','Kāmārpukur','Kashmir'],a:1,e:'In October 1901 Swamiji celebrated the first Durgā Pūjā at Belur Math, without animal sacrifice. The worship continues every year in Ramakrishna centres around the world.',s:20},
{t:'fill',q:'Swami Vivekananda, “Kali the Mother”: “Who dares misery love, and hug the form of ______, dance in Destruction’s dance, to him the Mother comes.”',a:['death'],show:'Death',e:'Fearless love of the Mother, accepting the terrible as well as the beautiful, brings her near.',s:21}
];
const M=10;let i=0,score=0,ans=[];
const app=document.getElementById('app');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
function hdr(){document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';document.getElementById('sc').textContent='Score: '+score+' / '+(Q.length*M);document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%'}
function show(){hdr();if(i>=Q.length)return result();const q=Q[i];let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · '+M+' MARKS</p><p class="q">'+q.q+'</p>'+(q.dev?'<p class="dev" style="font-size:20px;color:#13295B;margin:-6px 0 14px">'+q.dev+'</p>':'');
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+o+'</button>');
 else h+='<input class="fill" id="fill" type="text" autocomplete="off" autocapitalize="off" placeholder="Type your answer"><button class="btn" id="chk">Check answer</button>';
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>mark(+b.dataset.k===q.a,b));
 else{const f=document.getElementById('fill');document.getElementById('chk').onclick=()=>{if(!f.value.trim()){f.focus();return}const ok=q.a.some(x=>norm(f.value)===norm(x));f.disabled=true;document.getElementById('chk').style.display='none';f.style.borderColor=ok?'#2F5A2E':'#C2557A';mark(ok,null,f.value)};f.onkeydown=e=>{if(e.key==='Enter')document.getElementById('chk').click()};f.focus()}
 document.getElementById('nx').onclick=()=>{i++;show()}}
function mark(ok,btn,typed){const q=Q[i];if(ok)score+=M;ans.push({ok,typed});
 if(q.t==='mc'){app.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right')});if(!ok&&btn)btn.classList.add('wrong')}
 const fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML='<b>'+(ok?'Correct! +'+M+' marks':'Not quite. The answer is: '+(q.t==='mc'?q.o[q.a]:q.show))+'</b>'+q.e+' <i>(See slide '+q.s+'.)</i>';
 document.getElementById('nx').style.display='inline-block';hdr()}
function result(){const tot=Q.length*M,p=Math.round(100*score/tot);
 const band=p>=90?['Excellent!','You have absorbed the satsang beautifully. May the Mother bless your practice.']:p>=70?['Very good','You remember most of the satsang. Revisit the slides you missed for a deeper understanding.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+tot+'</span></p><p class="band">'+band[0]+' ('+p+'%)</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const ok=ans[k]&&ans[k].ok;r+='<div class="'+(ok?'r':'w')+'">'+(ok?'✓ ':'✗ ')+'<b>Q'+(k+1)+'</b> '+(q.t==='mc'?q.o[q.a]:q.show)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><button class="btn" id="again">Try again</button><a class="btn gold" href="../">Back to the slides</a></div><p style="margin-top:14px;font-size:14px">Bring your questions to the satsang, or post them in our members’ group on <a href="https://www.vedanta.nz" style="color:#13295B">vedanta.nz</a>.</p></div>';
 app.innerHTML=r;window.scrollTo(0,0);document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
show();
</script></body></html>
