<script>
const Q=[{"t": "mc", "q": "A friend says: “I am not holy enough to approach the Divine. I would feel like a fraud in front of the Mother.” How does the satsang’s picture of the Mother answer this?", "o": ["She is the Power behind the universe and far too vast to be approached in a personal way by an ordinary person.", "A child needs no qualification to run to its mother: the Mother is approachable, and he may simply come.", "She is approached through the image in the Durgā Pūjā alone, and nowhere else, so he must wait until the festival.", "She receives only those who have first purified themselves through years of discipline, so he should keep preparing."], "a": 1, "e": "In the Indian spiritual tradition She is the one who gives birth to the universe, nourishes and protects it, and finally draws it back into Herself. Above all a mother is approachable: a child needs no qualification to run to Her. The image in the Durgā Pūjā is a doorway and not a limit, and the same Mother lives in the universe and in us.", "r": "What do I imagine stands between me and the Mother, and would a child feel that obstacle?", "s": 4}, {"t": "mc", "q": "A student says: “Advaita worships Brahman, and Śākta worship adores a Mother. These must be two different realities.” How would Sri Ramakrishna answer?", "o": ["They are one Reality, but the Mother is only a lower, symbolic form that is given up when Brahman is known.", "They are one Reality: Brahman at rest and Śakti in action, as inseparable as fire and its power to burn.", "They are two realities, and only the worshipper of the Mother reaches the higher one in the end.", "They are two realities that cooperate, one inactive and one active, much as two partners share a task."], "a": 1, "e": "Sri Ramakrishna said that when he thought of the Supreme as inactive, neither creating, preserving nor destroying, he called it Brahman, and when he thought of it as active he called it Śakti. They are not two. We cannot think of one without the other, as with fire and its power to burn, milk and its whiteness, or a gem and its lustre. Kashmir Śaivism says the same of Śiva and Śakti.", "r": "Do I tend to think of God as still or as active? What changes if both are one?", "s": 5}, {"t": "mc", "q": "In the Devī Sūkta the seer Vāk says: “I am the sovereign Queen, gatherer of treasures, the Knower.” Why is this not arrogance?", "o": ["She is a queen of the Vedic age and she is simply describing her own rank and her own great achievements.", "She is praising the Goddess in poetic exaggeration, but she herself stays entirely separate from Her.", "She is claiming a rare personal greatness, which the tradition permits to seers but not to ordinary devotees.", "Having realised her oneness with the Goddess, she speaks as the Goddess Herself and not as a limited individual."], "a": 3, "e": "The Devī Sūkta (Ṛg Veda 10.125) is spoken by the seer Vāk, daughter of the sage Ambhṛṇa. Having realised her oneness with the Goddess, she speaks as the Goddess Herself: the power within every god, who rules, gives and knows, and whose breath is the life of the worlds. The voice is the Mother’s. The ego has not claimed it.", "r": "How is speaking from oneness different from speaking from ego, in my own experience?", "s": 6}, {"t": "mc", "q": "A speaker says in a talk: “Worship of God as Mother is a late folk addition, not part of the old Vedic religion.” What from the satsang would you offer in reply?", "o": ["The Devī Sūkta in the Ṛg Veda (10.125) already speaks of the Goddess as the power within all the gods.", "The Chaṇḍī was recited in Vedic times, and it is the oldest of the scriptures that speak of the Mother.", "Sri Ramakrishna’s vision at Dakshineswar, which proves that the worship of the Mother has always been practised.", "The Kashmir Śaiva texts, which are the oldest sources that speak of the Goddess as a conscious Power."], "a": 0, "e": "God as Mother is among the oldest scriptural voices of the Indian spiritual tradition. In the Devī Sūkta She is not one deity among many but the power within all the gods: the knower, the giver and the breath of the worlds. The Chaṇḍī (Devī Māhātmya) belongs to the Mārkaṇḍeya Purāṇa and is traditionally recited together with this hymn. Kashmir Śaivism and Sri Ramakrishna’s life belong to later ages.", "r": "What does it change for me to know that the Mother is a voice of the earliest scripture?", "s": 6}, {"t": "mc", "q": "A listener says: “Physics says matter is energy, so science has now proved the Mother.” How does the satsang frame the relation between the two?", "o": ["There is no connection at all, since physics studies matter and Vedanta deals only with the mind and its liberation.", "It is a proof, because physics has shown that the world is one energy and that energy is what the seers meant by Śakti.", "It is a proof for matter only, and the mind and the senses would need a separate science to be explained.", "It is an analogy and not a proof; what Vedanta adds is that this one energy is conscious: Śakti, the Mother."], "a": 3, "e": "The notes say plainly: an analogy, not a proof. Physics describes matter as concentrated energy, and the seers saw every form as Śakti condensed into name and form. Swami Vivekananda taught that all matter comes from ākāśa and all force from prāṇa, both from one cosmic source. What Vedanta adds is that the one energy is not blind. It is conscious, and the tradition calls Her Mother.", "r": "Where do I draw the line between an analogy that helps me and a proof I am claiming?", "s": 7}, {"t": "match", "q": "In the Chaṇḍī the demons stand for tendencies of the mind, and each is overcome by a different aspect of the Mother. Whose grace does each person most need?", "rows": ["Ben cannot get out of bed to practise, and lets weeks of dullness and spiritual sleep go by.", "Asha is restless, ambitious and quick to anger, and keeps finding new reasons to chase more.", "Raj has made good progress and is now quietly proud: “I am the one who understands, and this is my own.”", "Kiran flares up whenever he is contradicted, and then regrets it for days."], "c": ["Mahākālī (wakes us from inertia)", "Mahālakṣmī (gives strength over restless desire and ego)", "Mahāsarasvatī (gives wisdom that dissolves subtle pride)"], "ans": [0, 1, 2, 1], "e": "A common inner reading sees the demons as tendencies of the mind that match the three guṇas. Madhu and Kaiṭabha, born while Viṣṇu sleeps, are inertia and spiritual sleep (tamas), and Mahākālī wakes us. Mahiṣāsura keeps changing shape like restless desire, anger and ego (rajas), and Mahālakṣmī gives the strength to conquer ourselves. Śumbha and Niśumbha are subtle pride, the sense of “I” and “mine”, and Mahāsarasvatī gives the wisdom that dissolves duality.", "r": "Which of these three tendencies is most active in me this month?", "s": 8}, {"t": "mc", "q": "For years Daniel has tried to defeat his anger by willpower alone, and keeps losing. What does the inner reading of the Chaṇḍī suggest?", "o": ["He should give up effort completely, since the Mother will fight the battle only for a person who does nothing.", "He should keep trying harder, since the story shows that a determined effort always defeats the demon.", "Effort matters, but the battle cannot be won by effort alone: we call on the Mother, and She fights it for us.", "He should look for outer enemies, since the demons in the Chaṇḍī stand for people who threaten us."], "a": 2, "e": "The battle of the Chaṇḍī is fought within us, and the Mother fights it for us. We cannot win it by effort alone, so we call on Her, and She fights. The teaching joins effort and grace. We still make the effort, and it prepares us, while the victory is Hers. This is also the message of the image of the sail: the breeze of grace is always blowing and we need only unfurl the sail.", "r": "Where in my life have I tried hard on my own, and what would it look like to ask for Her help as well?", "s": 8}, {"t": "mc", "q": "A student worries: “If the world is created, where did the material come from, and where is the stage on which it stands?” What do sūtras 1 and 2 of the Pratyabhijñāhṛdayam say?", "o": ["The material was provided by Consciousness and the stage by Matter, so there are two principles at work in creation.", "The question cannot be asked at all, since the sūtras teach that the universe is nothing but an illusion.", "No outside material and no outside stage: She unfolds the universe on Her own screen, like a dream in the dreamer.", "The universe stands on a stage prepared by earlier cycles of creation, which She merely rearranges again and again."], "a": 2, "e": "Citi, free Consciousness, is the one cause of the universe and needs nothing outside Herself. In a dream, the dreamer’s own mind is the stage, the actors and the scenery together. In the same way She is both the painter and the canvas. This echoes Sri Ramakrishna: Brahman and Śakti are one, like fire and its power to burn.", "r": "What does it mean for me that the world appears within Her and not outside Her?", "s": 9}, {"t": "mc", "q": "A meditator is exasperated with his restless mind and calls it his enemy, which he wants to defeat. How does the Kashmir Śaiva teaching (sūtra 5) reframe this?", "o": ["The mind is already the same as the Self, so nothing needs to be done and no practice is required of anyone.", "The mind is Citi Herself in a narrowed form, not an enemy; sādhanā is the return, in which it widens back into Her.", "The mind is a separate and lower thing, which must be silenced completely before the Self can ever be known.", "The mind is an illusion, so a person should simply ignore it and concentrate only on the body and its health."], "a": 1, "e": "Sūtra 5 completes the descent: Citi Herself, narrowing to what She perceives, becomes citta, the mind. Our mind is the Mother in disguise. Even restlessness is Her energy, waiting to be turned. So the mind is not an enemy, and sādhanā expands it back into Her. This is the return journey that the five sheaths describe in stages.", "r": "How would my meditation change if I met my restless mind as the Mother in disguise?", "s": 10}, {"t": "mc", "q": "Someone says: “I feel so small, limited and separate. That is simply who I am.” How does sūtra 4 answer?", "o": ["The feeling is contraction, not our nature: each of us is Consciousness contracted, like a bubble holding the ocean.", "The feeling is a punishment for past errors and must be borne patiently until the next life brings some relief.", "The feeling is a sign of weak faith, and a firmer belief in one’s own greatness and strength will remove it for good.", "The feeling is correct, since only the Mother is great and every individual is truly small and limited beside Her vastness."], "a": 0, "e": "Sūtra 4 says that even the individual, being Consciousness contracted, holds the universe in contracted form. Each of us is the whole of Her, compressed, as a seed holds the tree. Feeling small and separate is the contraction. It is not the nature of the Self. The reflection question asks it directly: if I am a bubble in Her ocean, what do I have to fear?", "r": "If I am a bubble in Her ocean, what do I have to fear?", "s": 10}, {"t": "match", "q": "Sri Ramakrishna taught that Māyā has two faces. Which power is at work in each of these moments?", "rows": ["After a talk by a holy person, her mind turns gently inward and she feels a longing for God.", "A man cannot stop thinking “my reputation, my project, my team”, and feels cut off from others.", "A volunteer feels a wave of compassion for a stranger and quietly offers help.", "Someone chases a bigger house and each new purchase soon feels as empty as the last."], "c": ["Vidyā Māyā (the power that frees)", "Avidyā Māyā (the power that binds)"], "ans": [0, 1, 0, 1], "e": "Avidyā Māyā deludes: it pulls the mind outward through attachment to sense pleasures and possessions, the sense of “I and mine”, and forgetting who we are. Vidyā Māyā liberates: discrimination, devotion, compassion, longing for God and the company of the holy draw us inward. Both are Her powers, and the Upaniṣad says the mind alone is the cause of bondage and liberation, so the same mind can move either way.", "r": "Name one habit in my day that strengthens Avidyā Māyā and one practice that strengthens Vidyā Māyā. What small change could tip the balance this week?", "s": 11}, {"t": "mc", "q": "Some people say: “If the goal lies beyond all Māyā, then devotion, discrimination and service are also Māyā, and I can drop them.” How does Sri Ramakrishna’s image of the steps to the roof answer?", "o": ["The steps are the goal itself, so a person should stay on them and never think about reaching the roof at all.", "He would agree that the steps may be dropped, since a person who knows the goal can jump to the roof directly.", "We need the steps to reach the roof: we take refuge in Vidyā Māyā to climb, and the Mother then takes us beyond.", "Both kinds of Māyā are equally good for climbing, and a person can choose the one that is more convenient."], "a": 2, "e": "Vidyā Māyā is like a ladder that carries us up to the roof, while Avidyā Māyā is like a mist that hides the sun without harming it. We take refuge in Vidyā Māyā, through discrimination, devotion and service, and the Mother Herself then takes us beyond both. The same Mother who binds is the Mother who sets free.", "r": "Which of my present practices am I tempted to drop because I have “moved beyond” it?", "s": 11}, {"t": "mc", "q": "Two people see the same sunset. One is lost in craving to possess it. The other is quietened and turned inward. According to the Pratyabhijñāhṛdayam (sūtras 12 and 13), what accounts for the difference?", "o": ["The second person has simply learned to stop seeing the sunset, so that the senses are shut down altogether.", "Whether the seeing is recognised as Her power: when She turns it inward, the mind rises back towards Consciousness.", "The two are using different sets of powers, which the first person lacks until he has completed his practice.", "The first person is deluded by the world, which is unreal, while the second person has overcome the world."], "a": 1, "e": "The same four powers bind or free, depending on which way She turns them. Turned outward, in Her līlā, they hide Her nature and the jīva is deluded by its own powers: this is saṃsāra. Turned inward by grace, the mind (citta) rises back to Consciousness (citi). Recognising Her is the key. The practice is to recall, in any moment of seeing or thinking, “this too is Her power”.", "r": "In what everyday perception can I practise remembering, “this too is Her power”?", "s": 12}, {"t": "mc", "q": "A colleague’s sharp remark has upset you. The satsang’s practice is to pause and think, “this too is Her energy”. Which description best fits what this practice does?", "o": ["It shows that the colleague was entirely right, so the anger can be dropped without any further thought.", "It lets the feeling run its course, since it is Her energy and ought not to be interfered with at all.", "It neither suppresses nor acts out the feeling: it recognises the energy as Hers, so it can turn inward.", "It pushes the feeling away by an act of will, so that the mind returns to calm as quickly as possible."], "a": 2, "e": "In any moment of seeing or thinking, we can recall that this too is Her power. The energy of irritation is the same energy that, turned inward by Her grace, becomes devotion or clarity. Recognising the energy as Hers loosens its hold on us, neither crushing the feeling nor feeding it. The mind rises towards Consciousness, which is the practical meaning of the four powers turned inward.", "r": "What would I most like to say “this too is Her energy” about this week?", "s": 12}, {"t": "mc", "q": "A devotee says: “My craving and my confusion are the opposite of the Divine, so I must hide them from the Mother.” What does the Yā Devī hymn suggest?", "o": ["The hymn teaches that these states are punishments, sent by the Mother to those who have failed Her in their devotion.", "The hymn salutes only the good qualities, such as peace and compassion, and the others are not Hers at all.", "The hymn salutes the Devī even as longing and confusion: nothing is outside Her, and even these are Her energy.", "The hymn warns that craving and confusion are the work of a different force that stands against the Mother and must be fought."], "a": 2, "e": "The Chaṇḍī hymn salutes the Devī who dwells in all beings as consciousness, intelligence, sleep, hunger, power, patience, peace, faith, memory, compassion and mother, and even as delusion. Every faculty we use is Her power on loan to us. Even confusion is Her play, and nothing is outside the Mother. This does not excuse our faults. It tells us there is nothing we need hide from Her.", "r": "What do I hide from the Mother, and what would it be to bring it to Her?", "s": 15}, {"t": "match", "q": "The five sheaths, read from the Mother’s side, are Her step-by-step contraction. Which sheath is at work in each of these moments?", "rows": ["You keep replaying an old insult and cannot stop imagining what you should have said.", "You decide which task to do first, and feel “I decided this” and “this is mine”.", "In the night you wake and notice that you are being breathed, without any effort of yours.", "You eat, and the food becomes you, while a heart that you never chose keeps beating."], "c": ["Annamaya (the body)", "Prāṇamaya (breath and vitality)", "Manomaya (mind and emotions)", "Vijñānamaya (intellect and ego)"], "ans": [2, 3, 1, 0], "e": "Manomaya is Her movement as feeling, memory and imagination. Vijñānamaya is discernment (buddhi) and the sense of “I” (ahaṁkāra), which can bind or be offered back. Prāṇamaya is the breath that breathes us, waking and sleeping. Annamaya is Her most contracted form, the food that becomes us and the heartbeat we never chose. Beyond and within all five is Parāśakti: we are bubbles in Her ocean.", "r": "Which of my sheaths do I most forget is Hers?", "s": 16}, {"t": "mc", "q": "A friend plans an expensive retreat that promises to “give” him spiritual power. What does the teaching on Kuṇḍalinī say about where that power comes from?", "o": ["The power sits in the physical organs known as the chakras, and a particular exercise can start it moving.", "The power belongs only to yogis, and ordinary people can only admire those who have already awakened it fully.", "The power must be received from a special place or a special teacher who holds it in trust for the rest of us.", "Spiritual life is not getting something from outside: it is waking the Mother’s power already resting within us."], "a": 3, "e": "Yoga describes Kuṇḍalinī as Śakti resting coiled at the base of the spine, our latent spiritual potential. Devotion, japa, longing and grace awaken Her, and as She rises through the centres, awareness rises and widens. Spiritual life is not getting something from outside. It is waking the Mother within.", "r": "What would it change to treat my spiritual life as waking, and not as acquiring?", "s": 17}, {"t": "mc", "q": "A beginner reads about Kuṇḍalinī and plans to practise forceful breathing alone late at night. What does the satsang advise?", "o": ["She awakens safely through purity, devotion and guidance; for most of us the path is japa, prayer and meditation.", "He should put off all practice until he has read every book on the subject and understood it fully, step by step.", "He may begin alone, provided that he practises only for a few minutes each night and builds up very slowly.", "He may go ahead, since the more forceful the practice, the faster the awakening comes to the practitioner."], "a": 0, "e": "Sri Ramakrishna described the rising current in vivid images: moving like an ant, a frog, a snake, a bird or a monkey. The awakening comes safely through purity, devotion and guidance. For most people the path is simple: japa, prayer and meditation on the Mother in the heart. Force and haste are not the way, and the Mother’s grace does the real work.", "r": "Do I have a teacher or friend to practise with, so that I am not alone with my practice?", "s": 17}, {"t": "mc", "q": "A devotee who has meditated for ten years without any vision says: “I must lack the right technique.” What does the life of Sri Ramakrishna suggest he might ask instead?", "o": ["Whether there is intense longing, as of a child for its mother: Sri Ramakrishna wept each evening for Her.", "Whether he has earned enough merit through years of discipline, since merit is what brings the Mother to a devotee.", "Whether he is following the exact order of the steps in his practice, since that is what led to the first vision.", "Whether he is serving as a priest in a temple, since the first vision came to Sri Ramakrishna in that very role."], "a": 0, "e": "Before his first vision, Sri Ramakrishna, then a priest at the Kālī temple, wept each evening that another day had passed without seeing Her. He spoke to Mā as a child speaks to its mother, simply and trustingly. The lesson is longing: if we cry for Her as a child cries for its mother, She cannot stay away. The satsang does not promise a vision on demand. It points to the heart of the practice.", "r": "How alive is my longing, and what feeds it?", "s": 18}, {"t": "mc", "q": "Sri Ramakrishna, in his first vision, saw a boundless, shining ocean of Consciousness. How does this connect with what the satsang said about us?", "o": ["It shows that the Mother lives only in the far ocean, apart from the individual mind and from the everyday world.", "It shows that the sheaths and the chakras can be seen directly by anyone who looks closely enough within.", "The ocean he saw is the same Parāśakti in which we are all bubbles: our own source, not something foreign.", "It shows that the vision belongs to saints alone, and that ordinary people have no share in what he saw."], "a": 2, "e": "The notes say that the ocean he saw is the same Parāśakti in which we are all bubbles. The vision is not a distant event for a special person. It is a glimpse of the source of every one of us, which is why the satsang calls spiritual life a waking and not an acquiring. The experience of the saint and the teaching about the bubble point at the same Reality.", "r": "If the ocean is my own source, what does that change about how I treat my small worries today?", "s": 18}, {"t": "mc", "q": "Sri Ramakrishna worshipped his wife, Sri Sarada Devi, as the Divine Mother and offered at her feet the fruits of all his practices. How might a devotee practise this teaching on an ordinary Monday?", "o": ["By worshipping Holy Mother’s picture in place of all other forms, since she alone is the Mother of the world.", "By reserving the attitude for the Durgā Pūjā week alone, when the Mother is believed to be especially present.", "By greeting every woman, and indeed every being, as a form of the Mother, so that service becomes worship.", "By offering the fruits of his practices to his teacher and keeping them quite separate from his daily life."], "a": 2, "e": "On the night of Phalahāriṇī Kālī Pūjā in 1872 Sri Ramakrishna worshipped Sri Sarada Devi as Ṣoḍaśī, the Divine Mother. He saw all women as manifestations of the Mother and taught his disciples to do the same. The Mother in the image and the Mother in a living person are one. Seeing Mā in all turns every meeting into worship.", "r": "Whom will I greet today as a form of the Mother?", "s": 19}, {"t": "mc", "q": "A devotee loses his job and falls ill, and asks bitterly: “Where is the Mother in all this?” Which attitude from Swami Vivekananda’s “Kali the Mother” would help him?", "o": ["Waiting for the trouble to pass, since the Mother is thought to appear only in good times and in beauty.", "Cold indifference to whatever happens, since the Mother is said to be beyond both comfort and suffering.", "Seeking out suffering deliberately, since the poem teaches that pain and hardship are in themselves the way to the Mother.", "Fearless love that accepts the terrible, as well as the beautiful, as the Mother; to him who dares, She comes."], "a": 3, "e": "Swami Vivekananda wrote “Kali the Mother” in Kashmir in 1898, after an overwhelming experience of the Mother as the terrible and the beautiful in one. The poem does not ask us to look for suffering, nor to be indifferent. It asks for fearless love that meets death and destruction too as Her. The Mother who binds is also the Mother who sets free.", "r": "Where have I found it hardest to see the Mother, and what would fearless love ask of me there?", "s": 21}, {"t": "mc", "q": "Swami Vivekananda held that the worship of Śakti is inseparable from honouring, educating and empowering women. Which action is most consistent with this teaching?", "o": ["Supporting the education of girls and treating the women of his own life with real respect, as part of worship.", "Offering daily worship to the Mother’s image while leaving the care and education of women to other people.", "Keeping the worship of Śakti inside the temple, where it is protected from social and political questions.", "Treating the worship of the Mother as a private matter with no bearing on how society treats its women."], "a": 0, "e": "In October 1901 Swami Vivekananda celebrated Durgā Pūjā at Belur Math, with Holy Mother’s blessing, so that the Math would worship the Mother as Sri Ramakrishna had. For him worship of Śakti was inseparable from strength, fearlessness and the honouring and education of women. The inner and the outer go together: the Mother in the image, in Holy Mother, and in the strength She gives.", "r": "What is one practical way I can honour the Mother in the women of my life this month?", "s": 20}, {"t": "mc", "q": "Anna finds japa dry, but comes alive when she sings bhajans. The satsang lists five paths: japa, stotra and bhajan, seeing Mā in all, meditation and surrender. What does it suggest for her?", "o": ["She should wait for the Mother’s grace to choose a path for her, since the choice makes no difference at all.", "The paths suit different temperaments and most people combine two or three, so she can let bhajan lead and add another.", "She should drop all the other paths, because only the path that gives enjoyment is the one that leads to the Mother.", "She should give up bhajan and persist with japa alone, because the driest practice is the one that purifies most."], "a": 1, "e": "These five paths suit different temperaments. Japa and meditation can be practised anywhere, and stotras and bhajans turn feeling towards Her. All five are ways of unfurling the sail: effort prepares us, and Her grace carries us, since the breeze of grace is always blowing. Sri Ramakrishna and Holy Mother both stressed regular practice done with love.", "r": "Which two of the five paths will I practise this week?", "s": 22}, {"t": "mc", "q": "“The same Mother who binds is the Mother who sets free.” Which attitude to daily life follows from this?", "o": ["Rely on our own effort alone, since the Mother is said to help only those who have first helped themselves.", "Do nothing and wait, since everything depends on Her grace alone, whatever we may do or fail to do.", "Run away from the world as quickly as possible, since it is the source of all our binding and our troubles.", "Neither fight the world nor cling to it: take refuge in Her, use what turns us inward, and trust Her grace."], "a": 3, "e": "Avidyā Māyā and Vidyā Māyā are both Her powers, and the four powers within us bind or free depending on which way they are turned. So we neither fight the world nor cling to it. We take refuge in Vidyā Māyā, use whatever turns us inward, and trust that when She is gracious She turns our energies inward and reveals Herself. Effort and grace work together.", "r": "Where in my life am I fighting, and where am I clinging? What would taking refuge in Her look like in that situation?", "s": "11 and 12"}];

 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
