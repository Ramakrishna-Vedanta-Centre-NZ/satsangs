<script>
const Q=[{"t": "mc", "q": "A friend says, “Brahman is the real God; Śakti is only a lesser power within the world.” How would Sri Ramakrishna answer?", "o": ["Brahman and Śakti are one, like fire and its power to burn: at rest we call it Brahman, in action we call it Śakti.", "Śakti is greater, and Brahman is only an idea.", "They are two different deities who work together.", "He would agree: Śakti belongs to the world of illusion."], "a": 0, "e": "Sri Ramakrishna taught that Brahman and Śakti are inseparable, like fire and its power to burn, milk and its whiteness, a gem and its lustre. When we think of the Reality as inactive, beyond name and form, we call it Brahman; when we think of it as creating, preserving and dissolving, we call it Śakti, Kālī, the Mother. The difference lies only in our way of seeing, not in the Reality itself.", "r": "When you sit quietly in meditation and when you are busy at work, is it the same Mother in both? How might seeing your activity as her power change the way you work today?", "s": "5"}, {"t": "mc", "q": "Why does the Indian spiritual tradition call the ultimate Reality “Mother”?", "o": ["Because she gives birth to the universe, sustains it and draws it back, and above all because she is approachable.", "Because she grants only worldly blessings.", "Because the image in the Durgā Pūjā is the only place she can be found.", "Because the Divine is feminine and not masculine."], "a": 0, "e": "The ultimate Reality is beyond all names, yet the tradition chooses “Mother” because it describes both what she does and how we may relate to her. She brings forth the universe, nourishes and protects it, and at the end draws it back into herself. Above all, a mother is approachable: a child needs no learning or merit to run into her arms. The image in the Durgā Pūjā is a doorway into this relationship, not a limit on where she lives.", "r": "What would change in your prayer if you approached God as a child approaches its mother, without first feeling you must be worthy?", "s": "4"}, {"t": "mc", "q": "In the Devī Sūkta, the seer Vāk declares, “I am the Queen, the Knower, first of those worthy of worship.” What does this tell us?", "o": ["Only women can worship the Divine Mother.", "Having realised her oneness with the Goddess, Vāk speaks as the Goddess herself.", "Vāk was claiming personal greatness.", "The Goddess is a historical queen of the Vedic age."], "a": 1, "e": "The Devī Sūkta (Ṛg Veda 10.125) is spoken by the seer Vāk, who realised her oneness with the Goddess and therefore spoke in the first person as the Goddess herself. This is not pride but the language of realisation: when the small “I” dissolves, what remains speaks as the Divine. It also shows that worship of God as Mother is among the oldest voices of the Indian spiritual tradition.", "r": "Where in your own speech and action does the small “I” get in the way? What would it be like to let the Mother speak and act through you?", "s": "6"}, {"t": "mc", "q": "In the Chaṇḍī, the demon Mahiṣa keeps changing his form before the Mother slays him. What inner enemy does he stand for?", "o": ["Laziness and the sleep of the spirit.", "Physical illness.", "Desire and anger: the restless ego that keeps taking new shapes.", "The subtle ego that even good people carry."], "a": 2, "e": "The Chaṇḍī’s three episodes can be read as inner battles. Madhu and Kaiṭabha, who arise while Viṣṇu sleeps, stand for inertia and the sleep of the spirit (tamas). Mahiṣa, who keeps changing shape, stands for desire and anger (rajas): just when we think one craving is conquered, it reappears in another form. Śumbha and Niśumbha stand for the subtle ego of separateness that even good people carry. In each battle it is the Mother’s power, not our unaided effort, that wins.", "r": "What shape does your “Mahiṣa” take most often? When it next appears, can you call on her rather than fight alone?", "s": "8"}, {"t": "mc", "q": "Modern physics says matter is energy in concentrated form. What does Vedanta add that physics does not?", "o": ["That this one energy is conscious: it is Śakti, and we call her Mother.", "That only the mind exists and matter does not.", "That the energy will one day run out.", "That matter is unreal, so the world can be ignored."], "a": 0, "e": "Physics shows that matter and energy are interchangeable: what looks solid is energy in concentrated form. Vedanta goes further and says this one energy is not blind but conscious; it is Śakti, intelligent and purposeful, and we call her Mother. Swami Vivekananda taught that all matter comes from ākāśa and all force from prāṇa, both arising from the cosmic mind. The science is an analogy that helps us picture the teaching, not a proof of it.", "r": "If the energy in your own body and mind is conscious and divine, how might you care for it and use it differently?", "s": "7"}, {"t": "mc", "q": "Ice, water and steam look different yet are one substance. What does the deck use this example to teach?", "o": ["That a galaxy, a body and a thought look different, yet all are the one Power.", "That the world is always changing, so nothing is real.", "That we should study chemistry to understand God.", "That the Mother has three separate forms."], "a": 0, "e": "Ice, water and steam differ in form and behaviour, yet they are one substance. In the same way, a galaxy, a human body and a passing thought look utterly different, yet all are the one Power appearing in different names and forms (nāma-rūpa). The Upaniṣad sums it up: sarvaṃ khalv idaṃ brahma, all this is indeed Brahman.", "r": "Think of a person you find difficult. Can you see them, like ice and steam, as a different form of the same Mother?", "s": "7"}, {"t": "mc", "q": "Sūtra 1 calls Citi svatantrā, “free”. Why does her freedom matter?", "o": ["It means she needs nothing outside herself: she brings forth the universe by her own will.", "It means the world runs by chance.", "It means we are free to ignore her.", "It means she is unconcerned with the world."], "a": 0, "e": "Svatantrā means self-dependent, free. Citi does not create because she lacks something or because some outside force compels her; the universe arises from her own will, as an expression of her fullness. This is why the next sūtra says she unfolds the universe on her own screen. For us it means the world is not an accident or a prison but the free play (līlā) of the Mother.", "r": "Do you experience your life as something forced on you, or as her play in which you can take part freely? What would shift if you saw it as līlā?", "s": "9"}, {"t": "mc", "q": "In a dream, the dreamer’s own mind is the stage, the actors and the scenery. Which teaching does this best illustrate?", "o": ["Dreams are messages from the Mother.", "The world is a meaningless illusion.", "Sleep is the highest spiritual state.", "“By her own will, on her own screen, she unfolds the universe”: she is both painter and canvas."], "a": 3, "e": "Sūtra 2 says she unfolds the universe by her own will, on her own screen (svabhittau). There is no outside material and no outside canvas: like a dream within the dreamer, the world appears within her. This does not make the world worthless; a dream is fully real while we are in it, but its substance is the dreamer’s own mind. So too, the substance of everything we meet is the Mother.", "r": "If everything you meet today is appearing within the Mother, how might you receive the pleasant, the unpleasant and the ordinary events of your day?", "s": "9 and 10"}, {"t": "mc", "q": "Sūtra 5 says Citi herself, descending, becomes citta, the limited mind. What follows for our spiritual practice?", "o": ["Only the body can be trained, not the mind.", "Nothing can be done, since the mind is fixed.", "The mind is our enemy and must be destroyed.", "The mind is the Mother in narrowed form; sādhanā is the reverse journey back into her."], "a": 3, "e": "Sūtra 5 states that Citi herself, descending from her pure state, contracts and becomes citta, the individual mind. So the mind is not a separate enemy to be crushed; it is the Mother in narrowed form. Spiritual practice (sādhanā) is the reverse journey: the mind expanding back into Consciousness through devotion, meditation and discrimination. Sūtra 13 confirms it: turning inward, the mind becomes Citi again.", "r": "How do you usually treat your restless mind: with impatience, or with respect for what it really is? How could you treat it more kindly when you meditate?", "s": "10"}, {"t": "match", "q": "Vidyā Māyā or Avidyā Māyā?", "rows": ["Discrimination (viveka) between the real and the passing", "The sense of “I and mine”", "The company of the holy", "The restless pull towards sense pleasures"], "c": ["Vidyā Māyā (the power that frees)", "Avidyā Māyā (the power that binds)"], "ans": [0, 1, 0, 1], "e": "Sri Ramakrishna taught that Māyā, the Mother’s power, has two faces. Avidyā Māyā binds us: the sense of “I and mine” and the restless pull of the senses keep the mind turned outward and make us forget who we are. Vidyā Māyā frees us: discrimination, devotion, dispassion, compassion and holy company turn the mind inward and towards God. Both are her powers, and the same mind can move either way.", "r": "Name one habit in your day that strengthens Avidyā Māyā and one practice that strengthens Vidyā Māyā. What small change could tip the balance this week?", "s": "11"}, {"t": "mc", "q": "Sri Ramakrishna compared Vidyā Māyā to the steps that take us up to the roof. What is the point of the image?", "o": ["Vidyā Māyā is the final goal and we stay on the steps.", "Vidyā and Avidyā Māyā are equally useful for climbing.", "We take refuge in Vidyā Māyā to climb, and the Mother then takes us beyond both forms of Māyā.", "Steps are unnecessary; one should jump to the roof."], "a": 2, "e": "Vidyā Māyā is still Māyā, but it is the part of her power that leads us home. In Sri Ramakrishna’s image, we climb to the roof by the steps; once there, we see that the steps are made of the same brick and mortar as the roof. So we take refuge in knowledge, devotion and holy company to climb, and the Mother herself then takes us beyond both forms of Māyā to the Reality they are made of.", "r": "Which steps are you using now: japa, study, service, satsang? Are you climbing them regularly, or only standing at the bottom?", "s": "11"}, {"t": "match", "q": "Which field does this power move in?", "rows": ["Khecarī", "Gocarī", "Dikcarī", "Bhūcarī"], "c": ["The senses of knowing and action", "The objects of the outer world", "The knower, the sense of “I”", "The inner instrument: mind, intellect and ego"], "ans": [2, 3, 0, 1], "e": "In Kṣemarāja’s commentary on sūtra 12, the Mother works in us every moment through four powers. Khecarī moves in kha, the sky of consciousness, as the knower, the sense of “I”. Gocarī moves in the inner instrument: mind, intellect and ego. Dikcarī moves in the “directions”, the senses of knowing and action. Bhūcarī moves in bhū, existence, the objects of the outer world. Together they cover everything we experience.", "r": "As you read this, can you notice all four at work: the one who knows, the thinking, the seeing, and the page itself? All four are her.", "s": "12"}, {"t": "mc", "q": "Stuck in traffic, you feel irritation rising. According to the teaching on her four powers, what happens when her grace turns these energies inward?", "o": ["The same perceptions and thoughts are recognised as her power, and the mind rises towards Consciousness.", "A completely different set of powers takes over.", "The irritation must be crushed by willpower.", "The senses must be shut down until the feeling passes."], "a": 0, "e": "Sūtra 12 says that when we do not recognise her, we are deluded by our own powers: this is saṃsāra. Sūtra 13 says that when we recognise her, the mind turns inward and rises to Consciousness. The powers themselves do not change; only their direction does. The same seeing and thinking that produced irritation become the means of recognising her the moment we remember “this too is her power”. Grace adds nothing and destroys nothing; it turns our energies around.", "r": "Recall a recent moment of irritation or anxiety. What would it have felt like to pause in the middle of it and recognise “this too is her power”?", "s": "12"}, {"t": "mc", "q": "The Yā Devī hymn salutes the Devī who dwells in all beings as sleep, hunger and thirst, and even as delusion. Why include such ordinary, even troubling, states?", "o": ["Because nothing is outside the Mother: every faculty is her power on loan to us.", "To show that the Mother is responsible for our faults.", "To warn us to avoid sleep and hunger.", "Because the hymn was written for the sick."], "a": 0, "e": "The Yā Devī hymn salutes the Devī who dwells in all beings as consciousness, intelligence, sleep, hunger, power, thirst, patience, peace, faith, memory, compassion, the mother, and even delusion. Including ordinary and troubling states teaches that nothing is outside her. Every faculty we use is her power on loan to us; even our confusion is her play, from which she can lead us out. Seeing her in ordinary moments turns the whole day into worship.", "r": "Which of these forms did you meet today without noticing? How could you salute her the next time you feel hunger, tiredness or confusion?", "s": "14 and 15"}, {"t": "match", "q": "What is this sheath made of?", "rows": ["Annamaya", "Prāṇamaya", "Manomaya", "Vijñānamaya"], "c": ["Feeling, memory and imagination", "Discernment (buddhi) and the sense of “I”", "The body, the food that becomes us", "Breath and the life-force"], "ans": [2, 3, 0, 1], "e": "The Taittirīya Upaniṣad describes five sheaths (kośas). Annamaya is the body, made of the food that becomes us. Prāṇamaya is the breath and life-force that animate the body. Manomaya is the mind of feeling, memory and imagination. Vijñānamaya is discernment and the sense of “I”. Ānandamaya, the sheath of bliss, pervades them all. Each is a layer of the Mother’s own Power.", "r": "Which sheath do you identify with most during an ordinary day? Which one do you most often forget is hers?", "s": "16"}, {"t": "mc", "q": "The deck reads the five sheaths “from the Mother’s side”, with Ānandamaya outermost and Parāśakti beyond all five. What does this show?", "o": ["That the sheaths are five separate selves inside us.", "That the sheaths are her step-by-step contraction, from bliss down to the body, and we are bubbles in her ocean.", "That bliss is something we can reach only after death.", "That the body is the most important layer."], "a": 1, "e": "Read from our side, the sheaths are layers we pass through inward in meditation. Read from the Mother’s side, they are her step-by-step contraction: from all-pervading bliss down to the body, her most reduced form. Each subtler sheath pervades the denser ones, as space pervades a room. Beyond and within all five is Parāśakti, the cosmic Power, and we are bubbles in her ocean.", "r": "If you are a bubble in her ocean, what does that say about your fears, and about your sense of separation from others?", "s": "16"}, {"t": "mc", "q": "“Spiritual life is not getting something from outside: it is waking the Mother within.” What does the Kuṇḍalinī teaching mean by this?", "o": ["Only yogis have Kuṇḍalinī.", "Spiritual power must be received from a special place.", "The chakras are physical organs.", "The Mother’s power already rests within us; as she rises, awareness rises and widens."], "a": 3, "e": "Yoga describes Kuṇḍalinī as Śakti resting coiled at the base of the spine (mūlādhāra), our latent spiritual potential. As she awakens and rises through the centres, awareness rises and widens with her, until she unites with Śiva at the crown (sahasrāra). Nothing has to be brought in from outside: the Power we seek is already within us, asleep.", "r": "In what ways do you look outside yourself for what can only be awakened within? What helps you turn inward?", "s": "17"}, {"t": "mc", "q": "What does the deck recommend as the safe way for most of us to awaken this power?", "o": ["Waiting passively for it to happen.", "Purity, devotion and guidance: japa, prayer and meditation on the Mother in the heart.", "Forceful breathing techniques practised alone.", "Reading as many books as possible."], "a": 1, "e": "Kuṇḍalinī awakens safely through purity, devotion and proper guidance. Forceful techniques practised alone can disturb the body and mind. For most of us the path is simple and steady: japa, prayer and meditation on the Mother in the heart. As Sri Ramakrishna showed, sincere longing and devotion awaken her naturally, and her grace does the rest.", "r": "Which simple daily practice could you make steady and regular this fortnight, rather than looking for something dramatic?", "s": "17"}, {"t": "mc", "q": "The practice on “Where you met her today” is to choose one form each day and, when you notice it, say inwardly “namas tasyai”. What is the purpose?", "o": ["To memorise the hymn.", "To replace formal worship.", "To let ordinary moments become places of worship, so the whole day becomes satsang.", "To count how many forms we can find."], "a": 2, "e": "The practice takes the hymn home. Each day we choose one form, such as hunger, sleep, patience or peace, and when we notice it we say inwardly “namas tasyai”, salutations to her. Slowly, ordinary moments become places of worship, and we discover that spiritual life is not separate from ordinary life. The whole day becomes satsang.", "r": "Which form will you choose for tomorrow? Write it down, and at the end of the day notice how often you met her.", "s": "15"}, {"t": "mc", "q": "In the Ṣoḍaśī Pūjā, Sri Ramakrishna worshipped Holy Mother as the Divine Mother. What does this act teach us?", "o": ["That worship in temples is no longer needed.", "That only monks may worship the Mother.", "That Holy Mother was a goddess separate from other people.", "That the Mother in the image and the Mother in a living person are one."], "a": 3, "e": "In 1872, at Dakshineswar, Sri Ramakrishna worshipped Holy Mother as Ṣoḍaśī, the Divine Mother, and at the end offered her his rosary and the fruits of his sādhanā. He saw in his wife the same Power he worshipped in the temple image. The lesson is that the Mother is not only in the shrine: she can be recognised and honoured in living people, especially in women.", "r": "Who in your family or community could you begin to see, and treat, as a form of the Mother?", "s": "19"}, {"t": "mc", "q": "Sri Ramakrishna’s first vision of the Mother came after he wept each evening that another day had passed without seeing her. What is the main lesson for us?", "o": ["Intense longing: cry for her as a child cries for its mother, and she cannot stay away.", "Visions come only to priests.", "We should spend all our time in temples.", "Suffering is the goal of spiritual life."], "a": 0, "e": "As priest of Mā Bhavatāriṇī, Sri Ramakrishna wept each evening that another day had passed without seeing her. When his longing became unbearable, he saw a boundless, shining ocean of Consciousness, and the Mother’s presence filled him. He taught that if we cry for her as a child cries for its mother, she cannot stay away. Longing, not cleverness, is what draws her.", "r": "What do you long for most deeply? Is there room in your daily life to long for her as sincerely as you long for worldly things?", "s": "18"}, {"t": "mc", "q": "“Who dares misery love, and hug the form of Death, dance in Destruction’s dance, to him the Mother comes.” What attitude is Swami Vivekananda describing?", "o": ["Indifference to the suffering of others.", "Fearless love that accepts the terrible as well as the beautiful as the Mother.", "A wish for an early death.", "A love of danger and thrills."], "a": 1, "e": "Swami Vivekananda wrote “Kali the Mother” in Kashmir in 1898, after an overwhelming experience of the Mother as the terrible and the beautiful in one. The closing lines describe fearless love: one who can love the Mother even in suffering, loss and destruction, and not only in pleasant things, finds that she comes near. For Swamiji, worship of Śakti meant strength and fearlessness.", "r": "When hardship comes, do you see it as separate from the Mother? How might accepting it as her touch change the way you face it?", "s": "20 and 21"}, {"t": "match", "q": "Which teaching belongs to this teacher?", "rows": ["Sri Ramakrishna", "Holy Mother", "Swami Vivekananda", "Kṣemarāja"], "c": ["Citi herself, descending, becomes citta, the mind", "Worship of Śakti is inseparable from honouring and educating women", "Brahman and Śakti are one, like fire and its power to burn", "Learn to make the whole world your own; no one is a stranger"], "ans": [2, 3, 1, 0], "e": "Sri Ramakrishna taught that Brahman and Śakti are one, like fire and its power to burn (slide 5). Holy Mother’s last message urged us to make the whole world our own, so that no one is a stranger (slide 23). Swami Vivekananda saw the worship of Śakti as inseparable from honouring, educating and empowering women (slide 20). Kṣemarāja, in the Pratyabhijñāhṛdayam, taught that Citi herself, descending, becomes citta, the mind (slide 10).", "r": "Which of these four teachings speaks most to your life right now, and why?", "s": "5, 10, 20 and 23"}, {"t": "mc", "q": "During the guided meditation your mind keeps wandering. What does the deck advise?", "o": ["Return gently: every return is itself practice.", "Stop meditating, since the attempt has failed.", "Meditate only when the mind is already calm.", "Force the mind to stay still."], "a": 0, "e": "A wandering mind is not a sign of failure; it is the mind’s old habit. Every gentle return to the breath, to the light in the heart or to the Mother’s name is itself practice, while forcing the mind only creates more tension. Over time, these patient returns are how the mind turns inward through the sheaths into her.", "r": "How do you speak to yourself when your mind wanders? Could you bring it back as gently as a mother brings back a wandering child?", "s": "25"}, {"t": "mc", "q": "“The same Mother who binds is the Mother who sets free.” Which attitude to daily life follows from this?", "o": ["Nothing can be done until grace arrives.", "Rely only on our own effort.", "Run away from the world, since it binds us.", "Neither fight the world nor cling to it: take refuge in her, use what turns us inward, and trust her grace."], "a": 3, "e": "Both Vidyā Māyā and Avidyā Māyā are her powers, and her four powers within us bind or free depending on which way she turns them. So we neither run from the world nor cling to it. We take refuge in her, use whatever turns the mind inward (prayer, holy company, discrimination, service), and trust that when she is gracious she turns our energies inward and reveals herself. Effort and grace work together.", "r": "Where in your life are you fighting, and where are you clinging? What would taking refuge in her look like in that situation?", "s": "11 and 12"}];
const M=4;let i=0,score=0,ans=[];const TOT=100;
const EMBED=/[?&]embed=1/.test(location.search)||window.self!==window.top;
const QCODE='SAT-001',QTITLE='The Divine Mother: The One Power That Became All',QPROG='Satsang Study';
let saveState='';
const SK='rvcQuiz:'+QCODE;
function keep(){try{if(ans.length&&ans.length<Q.length)localStorage.setItem(SK,JSON.stringify({score:score,ans:ans,t:Date.now()}));else localStorage.removeItem(SK)}catch(e){}}
function saved(){try{const v=JSON.parse(localStorage.getItem(SK)||'null');if(v&&Array.isArray(v.ans)&&v.ans.length>0&&v.ans.length<Q.length)return v}catch(e){}return null}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='saved')saveState='saved';else if(d.type==='saveError')saveState='error';else if(d.type==='notMember')saveState='guest';else return;const el=document.getElementById('savemsg');if(el)el.innerHTML=saveMsg()});
function saveMsg(){return saveState==='saved'?'✓ Your result has been saved to your account. See all your results on <a href="https://www.vedanta.nz/my-journey" target="_top">My Journey</a>.':saveState==='error'?'Your result could not be saved just now. Please try again, or write to mail@vedanta.nz.':saveState==='guest'?'Sign in to vedanta.nz to save your results.':'Saving your result…'}
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hdr(){document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';document.getElementById('sc').textContent='Score: '+score+' / '+TOT;document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%'}
function fb(ok,gain,ansText,q){const el=document.getElementById('fb');el.className='fb '+(ok?'ok':'no');el.innerHTML='<b>'+(ok?'Correct! +'+gain+' marks':(gain>0?'Partly right: +'+gain+' of 4 marks.':'Not quite.')+(ansText?' The answer is: '+esc(ansText):''))+'</b>'+esc(q.e)+' <i>(See slide '+q.s+'.)</i><div class="refl"><b>Reflect:</b> '+esc(q.r)+'</div>';document.getElementById('nx').style.display='inline-block';keep();hdr()}
function show(){hdr();if(i>=Q.length)return result();const q=Q[i];
 let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · 4 MARKS'+(q.t==='match'?' · MATCHING':'')+'</p><p class="q">'+esc(q.q)+'</p>';
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:14px;color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:13px;color:#6B6B6B;text-align:center;margin-top:12px">Your answers are kept on this device as you go, so you can stop at any time and continue later.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}
function alertBox(){const el=document.getElementById('fb');el.className='fb no';el.innerHTML='<b>Please choose an answer for every line first.</b>'}
function result(){const p=score;try{localStorage.removeItem(SK)}catch(e){}
 const band=p>=90?['Excellent!','You have absorbed the satsang beautifully. May the Mother bless your practice.']:p>=70?['Very good','You have understood most of the satsang. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+TOT+'</span></p><p class="band">'+band[0]+'</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<b>Q'+(k+1)+'</b> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><button class="btn" id="again">Try again</button><a class="btn gold" href="../" target="_blank" rel="noopener">Open the slides</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';
 if(EMBED)r=r.replace('<div class="acts">','<p id="savemsg" style="font-size:14.5px;background:#E8EEDF;border-radius:10px;padding:10px 12px;margin-top:14px">'+saveMsg()+'</p><div class="acts">');
 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
 document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
function start(){const v=saved();if(!v)return show();
 const n=v.ans.length;hdr();
 app.innerHTML='<div class="card"><p class="qn">WELCOME BACK</p><p class="q">You have answered '+n+' of '+Q.length+' questions so far, with '+v.score+' marks.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn gold" id="cont">Continue from question '+(n+1)+' ›</button><button class="btn" id="fresh">Start again</button></div></div>';
 document.getElementById('cont').onclick=()=>{ans=v.ans;score=v.score;i=n;show()};
 document.getElementById('fresh').onclick=()=>{try{localStorage.removeItem(SK)}catch(e){}i=0;score=0;ans=[];show()}}
start();
</script></body></html>
