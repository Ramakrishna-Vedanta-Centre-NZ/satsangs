<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz/course/satsang-study" target="_top">Back to the course</a> · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
<script>
const Q=[{"t": "mc", "q": "Two members each give four hours a month to their branch. After three years one has grown calmer, kinder and less easily hurt; the other is tired and quietly resentful. What does the teaching on yajña see as the deciding difference?", "o": ["The inner attitude: one offers the work and lets go of “I and mine”, the other works for return or from pressure.", "The kind of work each was given, since some tasks are naturally far more uplifting to do than others.", "Their natural temperament, because service can only bring out more clearly what was already in a person.", "The thanks each one received, since warm appreciation from others is what keeps any volunteer growing over the years."], "a": 0, "e": "The Gītā says that work done for any purpose other than yajña binds us, while work offered as yajña sets us free (3.9). The same four hours can bind one person and purify another, because the difference lies in the attitude, not in the hours. The other options hold some truth: tasks differ, temperaments differ, thanks is pleasant. But none of them decides whether service becomes growth. Only the spirit of offering does that, and it is in our own hands.", "r": "After my last piece of service, did I feel lighter or heavier, and what was I holding on to?", "s": 8, "lv": "analyse"}, {"t": "mc", "q": "Four members explain why they joined NZICA. Which one has most fully understood the motto ātmano mokṣārthaṁ jagad-hitāya ca, “for one’s own liberation and for the welfare of the world”?", "o": ["“I come to serve the community. My spiritual life is a separate, private matter that I keep at home.”", "“I come mainly for my own peace of mind. Helping others is a pleasant extra that comes along with it.”", "“First I must become pure and wise myself. Only once I have reached that point will I begin serving others.”", "“Serving with the right attitude purifies my mind, and a purer mind serves better; each helps the other.”"], "a": 3, "e": "The small word ca, “and”, joins the two aims into one path. To grow means to expand from the small self to the larger Self; to serve is to acknowledge our oneness with all. Each of the other three members has kept one half and lost the other: service without inner growth, growth without real service, or growth postponed until some future day. Swami Vivekananda’s ideal is that we grow through serving and serve better as we grow.", "r": "Where in my life do I keep “my spiritual practice” and “my service” in separate boxes?", "s": 8, "lv": "evaluate"}, {"t": "mc", "q": "After a year of regular seva, how could a member best tell whether it has become spiritual growth and not just more activity?", "o": ["By the number of hours worked, events organised and people served, all carefully recorded over the year.", "By the appreciation and recognition received from the community and from the leaders of the association.", "By Swami Ranganathananda’s test: more oneness with others, more inner peace, and that peace radiating around, even in hard moments.", "By a growing certainty that one’s own way of serving is the right one, and that others should follow it."], "a": 2, "e": "Swami Ranganathananda asked: Are you growing spiritually? Can you feel oneness with others? Have you peace within yourself? And do you radiate it around you? These are signs of character, not of activity. Hours and events can grow while the ego grows with them; recognition is a return, not a sign of growth; and certainty that others should follow our way is often ego in a new form.", "r": "Over the past year, has my peace grown, and do the people around me feel it?", "s": 9, "lv": "evaluate"}, {"t": "mc", "q": "Someone objects: “If, in serving others, I am serving my own larger Self, then service is just selfishness in disguise.” What does the objection miss?", "o": ["The Self served is not the small, separate ego but the one Self in all, as a wave serving the ocean serves itself.", "Nothing: the objection is fair, so it is better not to think about this teaching at all while serving others.", "The teaching is only a helpful image to motivate us, and was never meant to be taken as literally true.", "Every motive is selfish anyway, so the question of what motive lies behind our service does not really matter."], "a": 0, "e": "Selfishness serves the small self at the expense of others. Vedanta speaks of the Paramātman, the one Self present in every being. We are all waves of the same ocean. To serve that Self is to widen the self until it includes everyone; this is the opposite of selfishness. The wrong options either give up the teaching, weaken it into a mere image, or give up on motive altogether.", "r": "When I serve, do I feel the other person as separate from me, or as part of the same ocean?", "s": 11, "lv": "analyse"}, {"t": "mc", "q": "Arjun says: “I have worked hard for everything I have. I owe nothing to anyone.” His hard work is real. What does the wheel of yajña (Gītā 3.14 to 3.16) show that his view leaves out?", "o": ["That effort counts for very little in the end, because every result is already decided by fate and the devas.", "That he should give generously now, so that good fortune and success keep flowing back to him in all the years ahead.", "That his effort rests on countless gifts he never earned, so giving back completes the circle rather than being charity.", "That he owes a fixed debt to society which he can repay in full once and then consider closed for good."], "a": 2, "e": "The Gītā describes life as a wheel: beings live on food, food comes from rain, rain from yajña, and yajña from action (3.14). Arjun’s effort stands on the gifts of parents, teachers, the land, the rain and the community. Seeing this does not cancel his effort; it places it inside a larger circle of giving. The wrong options turn the teaching into fatalism, into a business deal, or into a debt that can be paid off and forgotten. Gratitude is not a bill; it is a way of living.", "r": "List five things I received this week without paying for them. What would giving back look like?", "s": 13, "lv": "analyse"}, {"t": "mc", "q": "After reading that one who enjoys life’s gifts without giving is “a thief” (3.12), Maya becomes anxious and guilty, and gives out of fear that she is never doing enough. Which advice would help her most?", "o": ["She should work out roughly what she has received over the years and give back that amount, so the account is settled.", "The word is meant to awaken gratitude, not fear. Giving that flows from gratitude frees the mind; giving from guilt keeps it anxious.", "Her anxiety shows she is taking the verse seriously, so she should keep increasing her giving until the guilt goes away.", "She should set the verse aside, since a teaching first given for ancient fire rituals does not really apply to modern life."], "a": 1, "e": "Strong words in scripture are meant to wake us, not to frighten us. When giving comes from fear or guilt, the mind stays centred on itself: “Am I good enough?” When it comes from gratitude, the mind turns outward and becomes light. Exact accounting misses the spirit, more giving will not cure guilt, and setting the verse aside throws away a teaching that still applies to every one of us.", "r": "Does my giving come more from gratitude or from a sense of obligation? How does each one feel inside?", "s": 14, "lv": "evaluate"}, {"t": "mc", "q": "A busy family rarely eats together, and the teenagers find religious customs dull. Which first step would best bring the spirit of Gītā 3.13, sharing food as prasāda, into this home?", "o": ["Print verse 3.13 in Sanskrit and put it on the fridge, so that everyone in the family sees it every single day.", "Cook more elaborate meals at the weekend, so that the family learns to value food and the time spent eating it.", "Let each person say a private prayer before eating, whenever they eat, so that no one feels the practice is forced.", "Once a week, pause together before a shared meal to remember where the food came from, offer it, then share it."], "a": 3, "e": "Verse 3.13 says that those who eat what remains after offering are freed from faults, while those who cook only for themselves eat sin. The point is a change of attitude: food becomes a gift received and shared. A small, regular, shared pause does this best, and it can grow. A verse on the fridge informs but does not transform. Better food may please without changing the attitude. Private prayer is good, but the verse is about sharing.", "r": "Can I pause before my next meal to remember the many hands that brought it to me?", "s": 14, "lv": "apply"}, {"t": "mc", "q": "At a food drive Raj thinks: “I am the one helping these poor people.” He works hard and means well. What is the hidden error in his feeling, and what corrects it at the root?", "o": ["He is helping too few people; reaching many more would gradually turn his pride into real and lasting compassion.", "He uses the word “poor”; if he simply chose kinder words, the problem in his attitude would disappear by itself.", "He sees himself as the high giver and them as low receivers; seeing all as one Reality (4.24) turns pride into gratitude.", "He is enjoying the work too much; real service should feel like a hard duty, carried out without taking any pleasure in it at all."], "a": 2, "e": "Brahmārpaṇam (4.24): the offering, the fire, the one who offers and the act of offering are all Brahman. Raj’s error is the line he draws between himself and those he serves. Numbers, words and feelings of enjoyment are all on the surface. When he sees the Divine in each person, pride gives way to reverence, and, as Swami Vivekananda taught, he will feel grateful to them for the chance to serve.", "r": "Whom do I sometimes look down on, even slightly, while I help them?", "s": 15, "lv": "analyse"}, {"t": "mc", "q": "Mohan says: “Swami Vivekananda called image worship only preliminary, so I have stopped my shrine worship and use that time to volunteer.” How should we evaluate his decision?", "o": ["He is right, because real worship is service, and time at the shrine is time taken away from people in need.", "He has misread the teaching: a beginning is meant to grow, not to be discarded. Worship and service nourish each other.", "He is right only if he is a monk; householders should keep worship at home and leave service to the Mission.", "He is wrong, because service is only a preparation, and the real worship happens before the sacred image in the family shrine."], "a": 1, "e": "“He who sees Shiva in the poor, in the weak, and in the diseased, really worships Shiva; and if he sees Shiva only in the image, his worship is but preliminary.” Preliminary means a first step, not a mistake. The love and remembrance practised at the shrine are what let us see the same Divine in people. As Swami Ranganathananda put it, spiritual growth comes from meditation inwardly and service outwardly. Mohan has cut one of the two wings.", "r": "How does my time of worship or meditation show itself in the way I serve, and the other way round?", "s": 16, "lv": "evaluate"}, {"t": "mc", "q": "A coordinator notices that some helpers at a community pantry speak down to the guests. Bringing together “the giver is blessed” and serving the living God in people, which change would address this at the root?", "o": ["Help the helpers see each visit as a privilege: greet and thank every guest, serve with respect, and remember who is blessed.", "Make a firm rule that helpers say no more to the guests than is needed, so that hurtful remarks are simply prevented.", "Award helpers a badge for every month of service, so that they feel valued themselves and become more generous.", "Move the service to home delivery, so that guests and helpers no longer meet and there is no chance of disrespect."], "a": 0, "e": "Swami Vivekananda said: “It is not the receiver that is blessed, but it is the giver.” He called it a great privilege to be allowed to worship God by helping our fellow-man. The other changes manage the symptom: silence, rewards and distance do not change how helpers see the guests. Only a change of vision, learned together and practised at every visit, removes the root.", "r": "When I last helped someone, did I feel that I was doing them a favour, or that they were doing me one?", "s": 17, "lv": "synthesise"}, {"t": "mc", "q": "Gopal says: “I have studied Vedanta for years. I know the Self does not act, so service is for beginners.” Which response best reflects the Gītā?", "o": ["He is right: once knowledge has dawned, action serves no further purpose, and he may withdraw from service now.", "He should serve, but only to set a good example for others, since the work can no longer do anything for him.", "Knowledge and service belong to two different paths, so he should keep to his own path and not mix the two.", "Even the wise are purified by yajña, giving and discipline (18.5); unselfish work tests whether “I and mine” has truly gone."], "a": 3, "e": "Sri Krishna says that yajña, dāna and tapas should not be given up, for they purify even the wise (18.5). Understanding the Self in words is not the same as living it. Unselfish service shows, very honestly, whether the ego has really thinned. Setting an example is a real reason for the illumined to work, but Gopal is speaking from study, not from realisation. The paths of knowledge and work support each other.", "r": "Where does my understanding run ahead of my practice?", "s": 18, "lv": "evaluate"}, {"t": "match", "q": "Read each person’s inner attitude. Which step on the ladder of purification best describes where each one stands now? Choose one for each line.", "rows": ["Arun gladly takes on a committee role, but feels let down when his name is left off the thank-you list.", "Meena gives quietly every week and is untroubled whether anyone notices, because giving is simply right.", "Hari inwardly says “This is for You” before each task, at work and at home, and takes the results as prasāda.", "Lila, caring for a frail elder, feels no separation between herself, the care and the one she cares for."], "c": ["Work as worship", "Seeing Brahman in all", "Giving for a return", "Giving because it is right"], "ans": [2, 3, 0, 1], "e": "Arun is giving for a return, here recognition (rājasika, 17.12); notice that the sign is not the act but the disappointment. Meena gives because it is right, seeking nothing (sāttvika, 17.11). Hari offers all his work to the Lord (9.27). Lila sees giver, gift and receiver as one Reality (4.24). Each step loosens “I and mine” a little more, and the same person may stand on different steps on different days.", "r": "Which person is most like me today, and what one change would lift me to the next step?", "s": 18, "lv": "analyse"}, {"t": "mc", "q": "Anita is a retired teacher who lives alone on a small pension. She says: “I have no money, so I cannot really do seva.” Which plan best fits the teaching on the many forms of yajña?", "o": ["Save a little each week until she can make one sizeable donation, since material giving is the clearest form of seva.", "Accept that her years of seva have passed, and support those who still can with her good wishes and her thanks.", "Offer what she has: help children of new families with reading, and pray for others daily. Both are yajña.", "Join the busiest committee she can find, since only public, organised work really counts as service to the community."], "a": 2, "e": "The Gītā lists many offerings: of wealth, of discipline, of study and knowledge (4.25 to 4.30). Swami Vivekananda spoke of physical, intellectual and spiritual help, and called the gift of knowledge “a far higher gift than that of food and clothes”. Anita’s years as a teacher are a treasure to offer, and prayer for others is itself an offering. The other plans assume that only money or public work counts, or that age closes the door.", "r": "What is my particular gift to offer: time, skill, knowledge, care or prayer?", "s": 19, "lv": "apply"}, {"t": "mc", "q": "A branch has some funds and a free weekend. A family nearby is struggling after a job loss. Holding together 4.33 (the yajña of knowledge is higher) and the needs of the moment, which plan is wisest?", "o": ["Spend the weekend on a study class for the family, since material help is the lower gift and not really worth giving.", "Meet the urgent need with practical help, and offer what lasts: help with job applications, budgeting and contacts.", "Give food parcels only, since talk of knowledge is a luxury for anyone who is worried about the next meal.", "Hold a study weekend for members, since the yajña of knowledge must begin with ourselves before we help others."], "a": 1, "e": "Swami Vivekananda placed the gift of knowledge above food and clothes, yet he also insisted that the hungry be fed first. “Higher” does not cancel “lower”; it shows what lasts. The wise plan meets the need of the moment and then gives knowledge and skills that help the family stand on their own feet. One distractor despises material help, another despises knowledge, and the third turns the yajña inward when a neighbour needs us now.", "r": "In my own giving, do I mainly meet immediate needs, or do I also give what lasts?", "s": 19, "lv": "synthesise"}, {"t": "mc", "q": "Ashok says: “Charity begins at home. I will care for my family now, and serve the community later, when the children have grown up.” In the light of the five daily offerings and the widening circles, how should we evaluate this?", "o": ["He is right, because duty to the family must come first, and the wider circles can wait until that duty is done.", "The family is the first field of seva, but the circles widen together. Small offerings to others can start now and teach the children.", "He is wrong, because attachment to family is a form of “mine” and has to be given up for selfless public service.", "Only the widest circle, service to all beings, counts as real yajña, since caring for one’s own is never selfless."], "a": 1, "e": "The pañca mahāyajña, the five daily offerings, widen our care step by step from the self to all beings, and every householder practises them every day, not one after another over a lifetime. Caring for children and elders is truly yajña. But when the wider circles are postponed, the children learn that care stops at the front door. Children learn seva by seeing it. Despising family duty, or calling it never selfless, misses that the home is the first circle.", "r": "Which circle of my care is the narrowest right now, and how could I widen it a little this month?", "s": 20, "lv": "evaluate"}, {"t": "mc", "q": "Vikram works hard at every event, but afterwards he complains about the organisers to anyone who will listen. In terms of yajña in thought, word and deed, where is his offering incomplete, and why does it matter for him?", "o": ["In word and thought: his hands offer, but his speech and mind still grasp, so resentment undoes the purification.", "In deed: if he did even more work at each event, there would be no time left for the complaints to arise.", "Nowhere at all: what counts is the help actually given, and private complaints do not affect the service itself in any way.", "In leadership: he should ask for a role on the committee, so that he can put right the things that annoy him."], "a": 0, "e": "Our spiritual tradition speaks of purity manasā, vācā, karmaṇā: in thought, word and deed. Vikram’s deeds are an offering, but his words and thoughts take back what his hands gave. The work could purify his mind, yet resentment keeps feeding “I and mine”. More work only adds fatigue, saying it does not matter ignores the effect on him and on others, and a committee role would give the same grasping a larger stage.", "r": "In which of the three, thought, word or deed, do I most often take back what I have given?", "s": 21, "lv": "analyse"}, {"t": "match", "q": "Swami Vivekananda taught that real service needs heart, head and hands in harmony. In each case, what is missing? Choose one for each line.", "rows": ["Ravi designs an efficient roster for the meals service, but treats both volunteers and guests as names on a sheet.", "Shanti is moved to tears by a family’s hardship and rushes to give whatever comes to mind, though it is not what they need.", "Mahesh feels for the lonely elders and has a clear plan for weekly visits, but each week something else comes first.", "Uma notices a newcomer struggling, finds out what she really needs, and quietly helps her settle in over several weeks."], "c": ["The hands are missing", "Heart, head and hands are in harmony", "The heart is missing", "The head is missing"], "ans": [2, 3, 0, 1], "e": "Ravi has head and hands but no heart, so his service becomes cold. Shanti has heart and hands but no head, so her help misses the real need. Mahesh has heart and head but no hands, so nothing happens. Uma shows all three together: she feels, she understands the real need, and she carries it through. Heart alone becomes sentimental, head alone becomes cold, hands alone become tiring. Together, giving becomes an art.", "r": "In my own service, which is weakest: heart, head or hands? What would strengthen it?", "s": 22, "lv": "analyse"}, {"t": "mc", "q": "Leela gives a large donation anonymously, but each month she checks the newsletter and feels a little let down that no one has guessed it was her. How would the Gītā’s teaching on sāttvika giving (17.20) assess this, and what is the way forward?", "o": ["Fully sāttvika, because only the anonymous act itself counts, not the passing feelings that come up afterwards.", "Of no spiritual value, since a gift mixed with any wish for credit is spoiled, so she should stop until her motive is pure.", "Outwardly sāttvika, inwardly still seeking a return. Keep giving, notice the wish kindly and offer it too.", "Tāmasika, because giving in secret lacks the honesty and openness of a gift that is made plainly in public."], "a": 2, "e": "The Gītā calls a gift sāttvika when it is given because it is right to give, to a worthy cause, at the right time, expecting nothing in return (17.20). Leela’s act meets this outwardly, but a quiet wish for credit remains. That is how purification usually works: the act comes first and the motive is refined by practice. Calling it already perfect stops her growth; calling it worthless would stop the giving that is purifying her. Secrecy is not tamas.", "r": "When I give, what small return am I still hoping for, and can I offer that too?", "s": 23, "lv": "evaluate"}, {"t": "mc", "q": "Two branches keep competing to hold the bigger Diwali event, and members of each speak a little scornfully of the other. What is really happening, according to the teaching on “I and mine”?", "o": ["This is healthy competition, which spurs both branches on to do more good, so nothing needs to change here.", "The ego has not gone; it has widened to “my branch”. The cure is to see both as offerings to one fire.", "There are simply too many events; if each branch held fewer, the rivalry between them would fade by itself.", "The fault lies mainly with whichever branch began the rivalry, so it is up to that branch to make the first move."], "a": 1, "e": "Swami Vivekananda taught that the whole secret of unselfish work is giving up “I and mine”. Ego can hide inside good work: “my branch, my event, my success”. A wider “mine” is still “mine”. When both branches see their events as offerings into one sacred fire, each can rejoice in the other’s success. Fewer events, blame, or calling it healthy competition all leave the root untouched.", "r": "Where has my “I and mine” quietly grown to include my group, my family or my branch?", "s": 24, "lv": "analyse"}, {"t": "mc", "q": "In a committee meeting Neha is criticised unfairly for a project she leads. Drawing on Gītā 12.13 (free from “mine” and ego, forgiving, even in pain and pleasure) and the idea that the work is the Lord’s, which response shows these qualities growing?", "o": ["She listens calmly, corrects anything true, lets go of the hurt and bears no grudge: the work is not hers to defend.", "She resigns quietly from the project, since a sevak should avoid all conflict and never stand in another’s way.", "She defends herself firmly, to protect the good name of the project and of everyone who has worked hard on it.", "She agrees outwardly but avoids that member afterwards, so that peace is kept without any open argument."], "a": 0, "e": "Verse 12.13 describes one who “hates no being, is friendly and compassionate to all, free from ‘mine’ and from ego, even in pain and pleasure, and forgiving”. If the project is an offering, criticism does not have to wound the ego, and any truth in it can be used. Resigning, defending or quiet avoidance can each look wise, but each is still about protecting “I”. Forgiveness here is not weakness; it is freedom.", "r": "When I am criticised, what am I really trying to protect?", "s": 25, "lv": "synthesise"}, {"t": "mc", "q": "Deepak skipped his morning prayer for months so that he could start volunteering earlier. He is now efficient but often irritable. Combining Swami Ranganathananda’s teaching (meditation inwardly, service outwardly) and the sevak’s day, what would restore balance?", "o": ["Take a month off from all service to meditate full time, and then come back to the work once he feels calm again.", "Carry on just as he is, since service is itself a kind of meditation and the irritation will settle down in time.", "Volunteer fewer hours but keep the same morning routine, since tiredness alone is what is causing the irritation.", "Keep a short, fixed time of meditation or japa before work, and brief remembrance during it, so service is fed from within."], "a": 3, "e": "Swami Ranganathananda taught that spiritual growth is stimulated by meditation inwardly and by work done in a spirit of service outwardly. The sevak’s day begins by filling the cup before pouring it out. Deepak’s irritability shows the inner source running dry. A month away swings to the other extreme, carrying on ignores the warning, and cutting hours treats only the tiredness. A small daily balance of both is the way.", "r": "Is my cup being filled each day as well as poured out? What fills it?", "s": 28, "lv": "synthesise"}, {"t": "mc", "q": "Sunita is a nurse working long shifts. She feels guilty that she has “no time left for seva”. How does work as worship (Gītā 2.50 and 9.27) apply to her?", "o": ["Her nursing, done with skill, care and inner offering, is itself seva; brief remembrance between patients makes her shift a yajña.", "Her work is paid, so it cannot count as seva; she must find some unpaid hours each week for her real service.", "She should cut her hours at the hospital, since service to the community matters more than her career.", "Her work counts as seva only when she cares for patients who come from her own cultural community."], "a": 0, "e": "“Yoga is skill in action” (2.50), and “Whatever you do, do it as an offering to Me” (9.27). A sevak is not only someone who volunteers at weekends; for a sevak the whole day becomes one yajña. Payment does not stop work from being an offering, and the Divine in each patient is the same. Sunita needs a change of attitude, not of job.", "r": "Which part of my daily work could become an offering, without changing anything outwardly?", "s": 29, "lv": "apply"}, {"t": "mc", "q": "At his evening review Rohan notices that he was impatient twice during the day. In the spirit of the sevak’s evening offering, what should he do with this?", "o": ["Make up for it by fasting or doing extra service the next day, so that the fault is properly paid for.", "Note it honestly, offer it with the day’s work to the Lord, resolve gently to do better, and rest without self-condemnation.", "Think only of what went well, since dwelling on faults weakens confidence and the will to serve others.", "Write each fault in detail and read the list every morning, so that he stays humble and does not forget."], "a": 1, "e": "The evening offering asks two gentle questions: Where did I serve? Where did “I and mine” creep in? Then everything, success and failure alike, is offered to the Lord. Holy Mother’s counsel was to look at one’s own faults rather than at the faults of others, and to do so with love, not harshness. Punishment, denial and a list of faults all keep the mind circling around the small self; honest seeing with offering lets it grow.", "r": "Tonight, can I look back on my day honestly, and then let it go into the Lord’s hands?", "s": 30, "lv": "apply"}, {"t": "mc", "q": "NZICA wants its branches to work together on one national project. Which approach best embodies the Saṁjñāna Sūkta, “walk together, speak together, let your minds be of one accord”, and the image of many offerings into one fire?", "o": ["The national office designs every detail, and every branch carries out the same tasks, so that unity is ensured.", "Each branch picks its own separate project, so that freedom is respected and no branch is pushed by any other.", "Agree together on one purpose, let each branch give its own share by its strengths, and celebrate jointly.", "The largest branch leads and the others support it, since one strong centre avoids confusion and wasted effort."], "a": 2, "e": "Ṛg Veda 10.191 asks for a common purpose, a common assembly and a common mind, and the devas each take up their share. Unity is not sameness, and freedom is not separateness. In one sacred fire, each offering is different, yet all rise as one flame. Central control loses the gifts of the branches; separate projects lose the common purpose; a single dominant branch loses the equality the hymn asks for.", "r": "What is my branch’s particular share to offer to the whole of NZICA?", "s": 31, "lv": "synthesise"}, {"t": "mc", "q": "Six months after the retreat, Priya, who heard the talk, read the paper and scored well on the quiz, notices that nothing in her daily life has changed. Which next step best reflects śravaṇa, manana, nididhyāsana and Swami Vivekananda’s idea of assimilation?", "o": ["Read the study paper again and retake the quiz until she gets full marks, so that the ideas are firmly in place.", "Attend more talks on other topics, so that a wider range of knowledge gradually leads to some change in her life.", "Accept that this path does not suit her nature, and look for a different spiritual practice that will work better.", "Choose one idea, such as offering each morning’s work, live it daily until it is natural, then take up another."], "a": 3, "e": "Swami Vivekananda said: “If you have assimilated five ideas and made them your life and character, you have more education than any man who has got by heart a whole library.” Śravaṇa is hearing, manana is reflection, and nididhyāsana is living the idea until it becomes part of us. Priya has done the first two. More reading, more talks or a new path all stay at the level of information; one idea lived daily is what changes character.", "r": "Which one idea from this study will I make part of my life, starting tomorrow?", "s": 32, "lv": "synthesise"}];

 let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · 4 MARKS'+(q.t==='match'?' · MATCHING':'')+'</p><p class="q">'+esc(q.q)+'</p>';
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:var(--fs-text,13.5px);color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:var(--fs-small,12.5px);color:#6B6B6B;text-align:center;margin-top:12px">Your answers are saved as you go, so you can stop at any time and continue later. Sign in to vedanta.nz to continue on any device.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}

 const band=p>=90?['Excellent!','You have absorbed the retreat beautifully. May all your work become an offering, for the good of many and the joy of many.']:p>=70?['Very good','You have understood most of the retreat. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+TOT+'</span></p><p class="band">'+band[0]+'</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<a href="../answers/#q'+(k+1)+'" target="_blank" rel="noopener"><b>Q'+(k+1)+'</b></a> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><a class="btn" href="../answers/" target="_blank" rel="noopener">Read all the answers</a><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';

 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
