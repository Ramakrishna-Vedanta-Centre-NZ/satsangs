<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz/course/satsang-study" target="_top">Back to the course</a> · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
<script>
const Q=[{"t": "mc", "q": "Kavita says: “I joined NZICA to serve others. My own spiritual growth is a private matter for my prayers at home.” How does the talk respond?", "o": ["Growth and service are separate, and keeping them apart stops the motive for service from getting mixed.", "Service offered in the right spirit is itself a means of growth, so her two reasons are one path.", "Growth must come first, because only a person who is already realised can serve others well.", "Service matters more, and wanting personal growth is a selfish aim that a sevak should give up."], "a": 1, "e": "The motto ātmano mokṣārthaṁ jagad-hitāya ca joins “one’s own liberation” and “the welfare of the world” with the small word ca, “and”. To grow means expansion from the small self to the larger Self; to serve is to acknowledge our oneness with all. When work is offered as yajña it purifies the mind, so service becomes growth. Waiting for realisation first, or setting growth aside as selfish, both miss this.", "r": "Where in my life do I keep “my spiritual practice” and “my service” in separate boxes?", "s": 8}, {"t": "mc", "q": "Priya cooks for a branch lunch, thinking of the guests and quietly offering the work to the Lord. In the Gītā’s sense, is this yajña?", "o": ["Yes, because action offered without selfishness, for the good of others and as worship, is yajña.", "Only if mantras are chanted and the offering is made into a sacred fire by a priest.", "No, because cooking is a household duty and belongs to ordinary life, not to spiritual life, however lovingly it is done.", "Only if she also gives money, since yajña always involves some material sacrifice."], "a": 0, "e": "In Vedic times yajña meant the fire ritual. Sri Krishna widens it: any action done as an offering, without selfishness, for the good of all, is yajña. The kitchen stove can be the sacred fire. Verse 3.13 even speaks of cooking: those who cook only for themselves eat sin, while those who share what remains after offering are freed from faults.", "r": "Which ordinary task tomorrow could I turn into an offering?", "s": 12}, {"t": "mc", "q": "The root yaj carries three meanings: worship, coming together and giving. What follows for an association like NZICA?", "o": ["Because yajña means worship, the association should begin every meeting with a fire ceremony.", "An association is a social body; yajña is something each person does privately at home.", "Giving counts as yajña only when it is done alone and no one else is involved in it.", "Members coming together to give is itself a form of yajña, not only a social activity."], "a": 3, "e": "Deva-pūjā (worship), saṅgati-karaṇa (coming together) and dāna (giving) all belong to yajña. When members come together to give for the good of the community, the association itself becomes a place of offering, a yajña-śālā. A ritual at every meeting is not what is meant, and yajña is not only private.", "r": "When I come to a branch meeting, do I come to give or only to receive?", "s": 12}, {"t": "mc", "q": "A friend says: “I have worked hard for everything I have. I owe nothing to anyone.” Which teaching speaks most directly to this?", "o": ["The three kinds of food in chapter 17, which show that what we eat and how we earn it shape the mind.", "Japa as the highest yajña, since the holy name can be repeated anywhere at any time.", "The wheel of yajña (3.12 to 3.16): we live on what others give, and giving back is our share.", "The yajña of knowledge in 4.33, which is higher than any offering of material things."], "a": 2, "e": "The Gītā describes life as a wheel: beings live on food, food comes from rain, rain from yajña, yajña from action (3.14). Nothing lives only for itself. Our effort is real, but it rests on what parents, teachers, the land and the community have given. One who does not help turn the wheel lives in vain (3.16).", "r": "List five things I received this week without paying for them.", "s": 13}, {"t": "mc", "q": "Verse 3.12 calls one who enjoys life’s gifts without giving anything in return “a thief”. What is the best understanding?", "o": ["It warns that the devas will punish anyone who forgets to perform the prescribed fire rituals.", "It calls us to gratitude: what we have came from others, so taking without giving back is a kind of taking.", "It sets a firm rule that each of us must give back exactly as much as we have received, no more and no less.", "It is meant mainly for the wealthy, because they have received far more than other people."], "a": 1, "e": "The strong word is meant to wake us up, not to frighten us. The gifts of life come through nature, family and society; to enjoy them while giving nothing back is a kind of taking. The answer is gratitude and sharing, not exact accounting or fear of punishment, and it applies to everyone, not only the rich.", "r": "Where am I only taking, at home, at work or in my community?", "s": 14}, {"t": "mc", "q": "Offering food before eating and sharing prasāda (3.13) mainly trains us to:", "o": ["see what we receive as a gift to be shared, not as something that exists for ourselves alone.", "make the meal more pleasant, and help the whole family sit down to eat together at the same time each day.", "earn merit that automatically cancels the effects of our past wrong actions.", "keep an old custom alive out of respect, though it has little to do with the inner life."], "a": 0, "e": "Those who eat what remains after yajña are freed from faults; those who cook only for themselves eat sin (3.13). The practice changes the attitude of the one who eats: food becomes a gift received and shared, prasāda. It is an inner training, not a mechanical way to cancel karma or only a custom.", "r": "Can I pause before my next meal to remember where it came from?", "s": 14}, {"t": "mc", "q": "While serving at a food drive, Raj feels proud: “I am the one helping these poor people.” Which verse corrects this most directly?", "o": ["Gītā 17.13: a yajña done carelessly and without faith is called tāmasika, or dull.", "Gītā 10.25: among all the forms of yajña, the Lord is japa, the repetition of the holy name, the simplest offering.", "Gītā 3.14: food comes from rain, and rain comes from yajña performed by human beings.", "Gītā 4.24: the giver, the gift and the receiver are all Brahman, so there is no high and low."], "a": 3, "e": "Brahmārpaṇam: the offering, the fire, the one who offers and the act are all Brahman. Raj, the food and the people he serves are waves of one ocean. The pride of “I am helping them” dissolves when he sees the Divine in those he serves; as Swami Vivekananda said, we should be grateful to them.", "r": "Whom do I sometimes look down on while helping?", "s": 15}, {"t": "mc", "q": "Swami Vivekananda said that one who sees Shiva only in the image has a worship that is “but preliminary”. What does this mean?", "o": ["Image worship is a good beginning that should grow into seeing and serving the Divine in people.", "Image worship is useless and should be given up in favour of social work for the poor.", "Serving people is only a preparation for the real worship of the Lord that happens in the temple before His image.", "Only monks can see Shiva in the poor; householders should keep to worship of images."], "a": 0, "e": "“He who sees Shiva in the poor, in the weak, and in the diseased, really worships Shiva; and if he sees Shiva only in the image, his worship is but preliminary.” Swami Vivekananda does not reject image worship; he calls it preliminary, a beginning. Its fulfilment is to see and serve the living God in human beings, which is open to everyone.", "r": "If I truly saw the Divine in the next person I serve, what would change?", "s": 16}, {"t": "mc", "q": "Swami Vivekananda says: “It is not the receiver that is blessed, but it is the giver.” If this is true, how should a sevak feel towards the person helped?", "o": ["Superior, because the sevak has more to give and has generously chosen to share some of it with others.", "Indifferent, since feelings do not matter as long as the service gets done well.", "Grateful, because that person gives the sevak a chance to grow purer and more loving.", "Anxious, in case the person does not show proper thanks for the help received."], "a": 2, "e": "In Karma-Yoga, “We Help Ourselves, Not the World”, Swami Vivekananda says the world is a moral gymnasium in which we grow strong, and that we should be grateful to the person we help and think of him as God. The giver gains more than the receiver, so gratitude, not superiority or a wish for thanks, is the right feeling.", "r": "Whom do I owe thanks to for letting me serve them?", "s": 17}, {"t": "mc", "q": "Why does the Gītā say that yajña, giving and austerity purify “even the wise” (18.5)?", "o": ["Because the wise have gathered more past faults than others over many lives, and so need more cleansing.", "Because service keeps loosening “I and mine” however far one has come, so it is never outgrown.", "Because without service the wise would slowly forget what they learned from scripture.", "Because the wise must set an outward example, even though service does them no good."], "a": 1, "e": "The ladder of purification rises from living for “I and mine” to seeing Brahman in all. At every step, offering our work keeps the mind clear, like cleaning a window. That is why Sri Krishna says these acts are not to be given up: they purify even the wise. Service is not only for beginners or only for show.", "r": "On which step of the ladder do I usually stand when I serve?", "s": 18}, {"t": "match", "q": "Which step on the ladder of purification best describes each person? Choose one for each line.", "rows": ["Arun volunteers for the committee mainly because the role will look good to others.", "Meena gives quietly every week and never mentions it, simply because it is right.", "Hari offers each task of his day to the Lord, at work and at home alike.", "Lila feels that the elder she cares for, the care and she herself are one Reality."], "c": ["Work as worship", "Seeing Brahman in all", "Giving for a return", "Giving because it is right"], "ans": [2, 3, 0, 1], "e": "Arun gives for a return: recognition (rājasika, 17.12). Meena gives because it is right, seeking nothing (sāttvika, 17.11). Hari offers all his work to the Lord (9.27). Lila sees giver, gift and receiver as one (4.24). Each step loosens “I and mine” a little more.", "r": "Which person is most like me today, and which would I like to become?", "s": 18}, {"t": "mc", "q": "Anita says: “I have no money to give, so I cannot really do seva.” How does the teaching on the many forms of yajña answer her?", "o": ["She is right, because dravya-yajña, the offering of wealth, is the highest of all the forms.", "She should wait until she can afford to give properly, and then join in the branch’s work after that.", "Seva is for people with special skills, so she should keep to private prayer instead.", "Time, skill, knowledge, care, study and even japa are all offerings; wealth is only one form."], "a": 3, "e": "Gītā 4.25 to 4.30 lists many yajñas: wealth, discipline, yoga, study, knowledge, breath, sense restraint. All of them purify. The Gītā ranks the yajña of knowledge above material offerings (4.33), and the Lord says among yajñas He is japa (10.25). Everyone has something to offer.", "r": "What is my particular gift: time, skill, knowledge, wealth, care or prayer?", "s": 19}, {"t": "mc", "q": "The Gītā says the yajña of knowledge is higher than any yajña of material things (4.33). What is the wisest way for a branch to apply this?", "o": ["The branch should stop giving material help so that it can give all its time and energy to classes and lectures.", "Knowledge belongs to scholars, so the branch should keep to food parcels and practical help.", "Material help matters, but helping people grow in understanding lasts longer; the best seva joins both.", "Knowledge here means scripture only, so practical skills such as tutoring do not count."], "a": 2, "e": "Swami Vivekananda describes physical, intellectual and spiritual help, with spiritual help the highest. A hungry person needs food first; but the gift that lasts is the one that makes a person strong within. Teaching a skill, mentoring a student or sharing wisdom is knowledge offered. The two kinds of help work together.", "r": "What knowledge or skill could I share with someone this month?", "s": 19}, {"t": "mc", "q": "After agreeing to help at an event, Vikram works hard but complains about the organisers to others. In terms of thought, word and deed, what is happening?", "o": ["His deed is an offering but his words are grasping; yajña asks that all three be offered.", "Since he helped with the work itself, the words he says afterwards do not really affect the offering at all.", "Only his thoughts need attention; words are neutral and simply express what he feels.", "He should stop helping altogether until his thoughts and feelings are completely pure."], "a": 0, "e": "Manasā, vācā, karmaṇā: in thought, word and deed. Each offers the same choice, to grasp or to offer. Hard work offered while words divide the group is only partly yajña. The answer is not to stop serving, but to bring speech and thought into the offering too: truthful, kind and helpful words.", "r": "Which of the three, thought, word or deed, do I find hardest to offer?", "s": 21}, {"t": "mc", "q": "A volunteer feels deeply for lonely elders but never plans any visits, so nothing happens. Which part of service is missing?", "o": ["The heart: she needs to feel more deeply for the elders before she can begin to help.", "The head and the hands: understanding the need, making a plan and carrying it through.", "Nothing is missing: feeling sincerely for them is already a complete form of seva, even without visits.", "Only money: she should make a donation to an organisation that visits elders instead."], "a": 1, "e": "Swami Vivekananda taught that real service needs the heart that feels, the head that finds a practical way out, and the hands that carry it through. Heart alone becomes sentimental; head alone becomes cold; hands alone become tiring. Her feeling is precious, and it needs planning and steady action.", "r": "In my own service, which is weakest: heart, head or hands?", "s": 22}, {"t": "mc", "q": "Two members organise the same Diwali event. One wants a title and a photograph in the newsletter; the other does it because it ought to be done. What would the Gītā say?", "o": ["Both are equal, because the community enjoys exactly the same event whatever the motive of the organisers.", "The first is better, because a wish for recognition makes people work harder and longer.", "Both are tāmasika, because any public event is bound to be done mostly for show.", "The outward act is the same, but the first is rājasika and the second sāttvika; the spirit decides."], "a": 3, "e": "Gītā 17.11 and 17.12: yajña offered without seeking reward, because it ought to be done, is sāttvika; yajña offered for reward or show is rājasika. The same act can be of different qualities. The community may benefit either way, but only the sāttvika offering purifies the one who offers.", "r": "Think of one recent act of service. What was its quality, and what would make it purer?", "s": 23}, {"t": "mc", "q": "A branch keeps competing with another branch to hold the biggest event. Which remedy does the talk suggest?", "o": ["Make the competition fairer by giving a prize each year to the branch with the best event.", "Avoid joint events altogether so that comparisons between branches cannot arise at all.", "Remember we are waves of one ocean, so another branch’s success is ours; share ideas and plan together.", "Let the larger branch decide for the smaller ones, so that there is less disagreement."], "a": 2, "e": "Comparing and competing is a sign of ego in seva, and between groups it is the ego of a group. The remedy is the oneness of existence: we are waves of the same ocean. Like the devas who each took up their own share, each branch offers its best to a common purpose, coordinated rather than competing.", "r": "Where do I notice competition rather than harmony, and how could I help?", "s": 24}, {"t": "mc", "q": "Gītā 12.13 describes one dear to the Lord as nirmama and nirahaṅkāra. For a sevak this means:", "o": ["owning nothing at all and leaving family life in order to serve full time.", "serving without the sense of “mine” and without the ego of “I am the doer”.", "never accepting any position of responsibility in an association or branch.", "hiding one’s real abilities from others so as to appear humble and modest."], "a": 1, "e": "Nirmama means free from “mine”; nirahaṅkāra means free from ego. These are inner attitudes, not outer renunciation. A householder can hold a committee role and use every talent, as long as the work is not “my project” and “my credit”. Giving up “I and mine” is how the wave merges in the ocean.", "r": "Where in my service do I most often say “my”?", "s": 25}, {"t": "mc", "q": "NZICA suggested that the talk describe what a day looks like in the life of a person dedicated to seva. Which summary is closest to the talk?", "o": ["A day lived as one continuous yajña, from the morning offering through work and home to the evening offering.", "A day spent mostly at community events, leaving little time for family or for paid work.", "A day of strict rules about food and fasting, with service kept for the weekends.", "An ordinary day lived for oneself, with an hour of volunteering added in the evening."], "a": 0, "e": "The key is Gītā 9.27: whatever you do, eat, offer, give or practise, do it as an offering to Me. The fire is lit at dawn and kept burning all day: prayer and meditation, the family as the first field of seva, work done well, time for the community, an evening offering and review.", "r": "Which part of my day is already an offering, and which is most “for me alone”?", "s": 27}, {"t": "mc", "q": "Deepak skips his morning prayer so that he can start volunteering earlier. Why does the talk begin a sevak’s day with prayer and meditation?", "o": ["Because service done before prayer brings no merit and is counted as ordinary work.", "To finish one’s spiritual duty early, so that the rest of the day is free for other things.", "Because meditation done well removes the need for any practical service of others.", "Meditation fills the cup that seva pours out; without inner renewal, service becomes tiring and ego-driven."], "a": 3, "e": "Meditation and service are like two wings of a bird. Meditation turns the wave towards the ocean within and gives strength and purity; service lets it see the same ocean in others and tests the meditation. Without meditation, seva becomes tiring and ego-driven; without seva, meditation can become self-centred.", "r": "What small morning practice would fill my cup before the day begins?", "s": 28}, {"t": "mc", "q": "Sunita is a nurse who feels she has no time left for seva. How does “work as worship” (Gītā 2.50 and 9.27) apply to her?", "o": ["She would need to give up nursing in order to find time for real service of others.", "Paid work can never be seva, because it brings a salary and is done for a reward.", "Her daily work, done with care and offered to the Lord, is itself her main field of seva.", "She should keep seva for her days off, when she is free from the demands of work."], "a": 2, "e": "“Yoga is skill in action” (2.50), and whatever we do can be offered (9.27). For most of us the greatest field of seva is the ordinary day. A salary does not stop work from being an offering; what matters is the spirit: care, excellence and the attitude “I am an instrument; this is Your work”.", "r": "How could I offer my own work tomorrow as worship?", "s": 29}, {"t": "mc", "q": "At his evening review, Rohan notices he was impatient twice during the day. What is the spirit of the review?", "o": ["Firm self-criticism, so that the memory of the mistake stops it from happening again.", "Gentle and honest: notice where “I and mine” crept in, offer the day, and resolve to do better.", "A list of the day’s good deeds, so that he can end the day feeling satisfied.", "A search for whoever caused his impatience, so that he can avoid them in future."], "a": 1, "e": "The evening offering hands over the whole day, its successes and failures, to the Lord (9.27). The review is gentle, not harsh: it notices where the ego came in and resolves to do better tomorrow. Holy Mother’s counsel to see our own faults rather than others’ is the spirit of it.", "r": "What three questions will I ask myself each evening this week?", "s": 30}, {"t": "mc", "q": "“Many offerings, one sacred fire.” What makes an association a powerful force for collective good?", "o": ["Having the largest membership and the biggest budget of any community group in the country.", "One strong leader who makes all the important decisions so that work is done quickly.", "Every branch running exactly the same activities in exactly the same way each year.", "Members and branches, each giving their own share, aligned in one purpose and one spirit of service."], "a": 3, "e": "Ṛg Veda 10.191.3: “I worship with your common offering.” Each member brings a different offering, as the devas each took up their own share, and all go into one fire with one purpose, bahujana hitāya, bahujana sukhāya. Outwardly the community is uplifted; inwardly each member is purified.", "r": "What is my branch’s particular share to offer to the whole of NZICA?", "s": 31}, {"t": "match", "q": "Which teaching of the Gītā speaks most directly to each situation? Choose one for each line.", "rows": ["Someone enjoys the community’s support for years but never helps with anything.", "A volunteer asks whether her service is pure when no one ever sees it.", "A member wonders whom he is really serving when he helps a stranger.", "A busy mother thinks her cooking and caring for the family do not count as seva."], "c": ["Gītā 4.24: the giver, the gift and the receiver are all Brahman", "Gītā 9.27: whatever you do, do it as an offering", "Gītā 3.12: do not take without giving", "Gītā 17.11: offered seeking no reward, it is sāttvika"], "ans": [2, 3, 0, 1], "e": "Taking without giving is the warning of 3.12. Service done unseen, seeking nothing, is sāttvika (17.11). The stranger, the helper and the help are one Reality (4.24). Whatever we do, including cooking and caring, can be offered (9.27).", "r": "Which of these four verses do I most need to remember this week?", "s": 31}, {"t": "mc", "q": "Śravaṇa, manana and nididhyāsana are the three stages of learning. After the retreat, what does manana ask of a member?", "o": ["To reflect on the teaching, question it and make it one’s own, for example with the study paper and its questions.", "To listen to the talk again and again until the words can be repeated from memory.", "To begin teaching the material to others straight away, before thinking it through.", "To put the teaching into practice at once, without spending time thinking about it."], "a": 0, "e": "Śravaṇa is hearing with attention: the talk. Manana is reflection, questioning until the teaching is understood and accepted: the study paper, its reflection questions and the quiz. Nididhyāsana is living it until it becomes part of us: the thirty days of yajña. Memorising is not reflection.", "r": "Which section of the study paper will I reflect on first?", "s": 32}];
const M=4;let i=0,score=0,ans=[];const TOT=100;

const QCODE='RET-001',QTITLE='Yajña: The Spirit of Seva',QPROG='Satsang Study';
let saveState='';
const SK='rvcQuiz:'+QCODE;
function keep(){const st=(ans.length&&ans.length<Q.length)?{score:score,ans:ans,t:Date.now()}:null;try{if(st)localStorage.setItem(SK,JSON.stringify(st));else localStorage.removeItem(SK)}catch(e){}if(EMBED)try{window.parent.postMessage({type:'progress',code:QCODE,state:st},'*')}catch(e){}}
function valid(v){return v&&Array.isArray(v.ans)&&v.ans.length>0&&v.ans.length<Q.length&&typeof v.score==='number'?v:null}
function saved(){try{return valid(JSON.parse(localStorage.getItem(SK)||'null'))}catch(e){return null}}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='saved')saveState='saved';else if(d.type==='saveError')saveState='error';else if(d.type==='notMember')saveState='guest';else return;const el=document.getElementById('savemsg');if(el)el.innerHTML=saveMsg()});
function saveMsg(){return saveState==='saved'?'✓ Your result has been saved to your account. See all your results on <a href="https://www.vedanta.nz/my-journey" target="_top">My Journey</a>.':saveState==='error'?'Your result could not be saved just now. Please try again, or write to mail@vedanta.nz.':saveState==='guest'?'Sign in to vedanta.nz to save your results.':'Saving your result…'}
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hdr(){document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';document.getElementById('sc').textContent='Score: '+score+' / '+TOT;document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%'}
function fb(ok,gain,ansText,q){const el=document.getElementById('fb');el.className='fb '+(ok?'ok':'no');el.innerHTML='<b>'+(ok?'Correct! +'+gain+' marks':(gain>0?'Partly right: +'+gain+' of 4 marks.':'Not quite.')+(ansText?' The answer is: '+esc(ansText):''))+'</b>'+esc(q.e)+' <i>(See slide '+q.s+'.)</i> <a href="../answers/#q'+(i+1)+'" target="_blank" rel="noopener">Read the full answer and reflection</a><div class="refl"><b>Reflect:</b> '+esc(q.r)+'</div>';document.getElementById('nx').style.display='inline-block';keep();hdr()}
function show(){hdr();if(i>=Q.length)return result();const q=Q[i];
 let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · 4 MARKS'+(q.t==='match'?' · MATCHING':'')+'</p><p class="q">'+esc(q.q)+'</p>';
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:var(--fs-text,13.5px);color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:var(--fs-small,12.5px);color:#6B6B6B;text-align:center;margin-top:12px">Your answers are saved as you go, so you can stop at any time and continue later. Sign in to vedanta.nz to continue on any device.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}

 const band=p>=90?['Excellent!','You have absorbed the retreat beautifully. May all your work become an offering, for the good of many and the joy of many.']:p>=70?['Very good','You have understood most of the retreat. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];

 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<a href="../answers/#q'+(k+1)+'" target="_blank" rel="noopener"><b>Q'+(k+1)+'</b></a> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><a class="btn" href="../answers/" target="_blank" rel="noopener">Read all the answers</a><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';
 if(EMBED)r=r.replace('<div class="acts">','<p id="savemsg" style="font-size:var(--fs-text,13.5px);background:#E8EEDF;border-radius:10px;padding:10px 12px;margin-top:14px">'+saveMsg()+'</p><div class="acts">');
 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
 document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
function start(){if(!EMBED)return offer(saved());
 let done=false,n=0,tm=null;const go=v=>{if(done)return;done=true;if(tm)clearInterval(tm);offer(v)};
 window.addEventListener('message',e=>{const d=e.data||{};if(d.type!=='resume')return;const a=valid(d.state),b=saved();go(a&&b?((a.t||0)>=(b.t||0)?a:b):(a||b))});
 app.innerHTML='<div class="card"><p>Loading your quiz…</p></div>';
 const ping=()=>{if(done)return;if(++n>6)return go(saved());try{window.parent.postMessage({type:'ready',code:QCODE},'*')}catch(e){}};
 tm=setInterval(ping,500);ping()}
function offer(v){if(!v)return show();
 const n=v.ans.length;i=n;score=v.score;hdr();document.getElementById('pos').textContent='Paused at question '+(n+1)+' of '+Q.length;
 app.innerHTML='<div class="card"><p class="qn">WELCOME BACK</p><p class="q">You have answered '+n+' of '+Q.length+' questions so far, with '+v.score+' marks.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn gold" id="cont">Continue from question '+(n+1)+' ›</button><button class="btn" id="fresh">Start again</button></div></div>';
 document.getElementById('cont').onclick=()=>{ans=v.ans;score=v.score;i=n;show()};
 document.getElementById('fresh').onclick=()=>{i=0;score=0;ans=[];keep();show()}}
start();
