<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz/course/satsang-study" target="_top">Back to the course</a> · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
<script>
const Q=[{"t": "mc", "q": "A nurse says: “My prayer hour is my spiritual life. My night shift is just a job that takes me away from it.” What does the class say is the real difficulty?", "o": ["The length of her prayer hour, which should be extended until it gradually fills the hours of the working day.", "The split itself: the tasks can stay the same, and what changes is the inner attitude with which they are held.", "Her view of prayer, since real spiritual life belongs only to people who have stepped away from ordinary work.", "The night shift itself, which is too demanding to be spiritual, so she should look for a calmer and quieter line of work than hospital shifts."], "a": 1, "e": "Vedanta does not accept the split between “real life” and “spiritual life”. One Reality is present in all things, so no activity is outside it. The cooking, the emails and the caring stay the same. What changes is the inner attitude, from “this is mine and I must succeed” to “this is offered and I will do my best”. Krishna gives the teaching to Arjuna on a battlefield, the place of greatest duty, which shows that the path is walked in the midst of action.", "r": "Which of my daily hours feels most separate from my spiritual life, and what would it mean to hold it differently without changing the task?", "s": 3}, {"t": "mc", "q": "Two people do exactly the same work with the same skill. According to the teaching on work as offering (Gita 3.9), what decides whether the work binds one and frees the other?", "o": ["Whether the work is religious in kind, such as temple service, or secular.", "Whether the work is offered, as yajña, or done for oneself alone.", "How much money or recognition each one receives for the work.", "How many hours of meditation each one does before starting."], "a": 1, "e": "Gita 3.9 says that work done as an offering frees, and that the world is bound by action done for the self alone. The same work either binds or liberates depending on whether it is offered. The outer action does not decide it. The inner attitude does. This is why the class treats a change of attitude, and not a change of occupation, as the path.", "r": "Is there one task today that I can begin with the silent words “This is Yours”?", "s": 7}, {"t": "match", "q": "Which knot is at work in each of these thoughts? Choose one for each line.", "rows": ["“I did all of this myself. Nobody else made any difference.”", "“I cannot feel satisfied unless I get the reward I have been promised.”", "“The project is finished, but I cannot let go of it. My name must stay on it.”", "“It all rests on me. If this goes wrong, it will be entirely my fault.”"], "c": ["Kartṛtva (the doer)", "Bhoktṛtva (the enjoyer)", "Saṅga (attachment)"], "ans": [0, 1, 2, 0], "e": "Kartṛtva is the sense of being the doer, and it shows in both “I did it all” and “it is entirely my fault”, because in fact health, other people, timing and opportunity all contribute. Bhoktṛtva is the sense of being the one who must receive the reward. Saṅga is clinging to outcomes, praise and ownership. It is not action that binds, but these three ways of relating to it. Together they bring anxiety before a task and elation or disappointment after it.", "r": "Which of the three knots is strongest in me this week, and in what situation did I last notice it?", "s": 4}, {"t": "mc", "q": "A manager hears that Niṣkāma Karma means working without craving for results, and says: “So we should stop setting targets and stop caring how things turn out.” How does the class answer?", "o": ["She is right: any target creates attachment, so a true karma yogi works without any aim at all.", "She is half right: targets may stay, but any real concern for how things turn out must be dropped altogether as attachment.", "She is right, but only for people who have taken up the spiritual path as a full-time practice.", "Goals orient the work and care is welcome; what is released is the dependence of our peace of mind on the result."], "a": 3, "e": "A farmer sows with a purpose. Niṣkāma Karma means full effort and real care without craving for a particular result. It does not mean without purpose, and it does not mean without care. The mind simply does not tie its peace to the outcome. The Vedantic view is that the person without attachment is capable of the warmest and steadiest care, because that care does not depend on being rewarded.", "r": "What is one task where I have been confusing “caring about the work” with “needing the result”?", "s": 5}, {"t": "match", "q": "Gita 2.47 asks us to act, and gives three cautions: do not claim the fruit; do not let the fruit be your motive; do not drift into inaction. Which caution is being broken in each case?", "rows": ["After a hard day, Sam decides there is no point in revising since the exam result is not in his hands anyway.", "Meera works only for praise and stops volunteering the week nobody thanks her.", "Leo is sure that his careful planning alone made the event a success, and he expects the credit.", "Ana is so worried about the outcome of a repair that she keeps postponing the job to avoid failing at it."], "c": ["Do not claim the fruit", "Do not let the fruit be the motive", "Do not drift into inaction"], "ans": [2, 1, 0, 2], "e": "The four instructions of the verse work together: act, and do not claim the fruit, do not make it your motive, and do not drift into inaction. Sam and Ana both retreat from work, so detachment has turned into passivity. Meera acts only for the reward, so the fruit has become her motive. Leo claims the fruit, although outcomes depend on many causes beyond one person’s control. The verse asks for more engagement with a released grip, not for less.", "r": "Which of the four instructions do I most often forget?", "s": 5}, {"t": "mc", "q": "A friend says: “If equanimity is the goal, then I should aim to feel nothing when things succeed or fail.” What corrects this view?", "o": ["Equanimity is not emotionlessness: the mind is not knocked off its centre by outcomes and quickly returns to balance.", "Nothing needs correcting: any feeling of joy or sorrow at an outcome is a sign that the practice is failing.", "Equanimity applies only to failure; success may be enjoyed without limit, since it carries no risk of attachment.", "The aim is to suppress the feeling at once, so that no trace of it is ever noticed by oneself or by anyone else."], "a": 0, "e": "Samatva does not mean feeling nothing. A person with samatva can feel joy and sorrow and still come back quickly to balance. The Gita’s ideal is a steady, clear, warm mind, not a numb one. Suppressing feeling is a different thing from not being thrown off centre by it.", "r": "After my last disappointment, how long did it take me to return to balance, and what helped?", "s": 6}, {"t": "mc", "q": "Before an important presentation, Ana keeps imagining how the audience will judge her, and then stumbles over her own slides. How does the teaching of Gita 2.48 and 2.50 explain this?", "o": ["She cares about the audience at all, so she should simply stop caring about the quality of the talk itself or its content.", "She has not prepared enough, since equanimity is only a substitute for hard preparation and cannot replace it.", "Her mind is too calm before the talk, and a little more anxiety would make her work sharper and more alert.", "Her attention is split between the task and an imagined result; releasing the result frees all attention for the work."], "a": 3, "e": "A mind that swings between hope and fear is divided: part of its attention is on the task and part on the anticipated result. Releasing the result frees the whole attention for the work, which is why the Gita pairs equanimity (2.48) with skill in action (2.50). Excellence and equanimity belong together. Many people find that their work improves when they practise this.", "r": "Recall a time I worked at my best. Was my mind on the task or on the result?", "s": 6}, {"t": "mc", "q": "A friend plans to avoid the binding effect of work by simply doing as little as possible. How does Krishna’s teaching in Chapter 3 answer the plan?", "o": ["It works well, since only inaction is free from consequences, so activity should be kept to a bare minimum.", "It is correct for the wise, while ordinary people are asked to act only out of fear of what inaction would bring upon them.", "It cannot work: no one can remain without action even for a moment, so the real choice is between binding and freeing action.", "It works only if she also meditates for several hours every day to cancel the effects of the little work she does."], "a": 2, "e": "In Chapter 3 Krishna says that no one can remain without action even for a moment (3.5), and that those who refrain from action while the mind dwells on sense objects are deluded (3.6). The only real choice is how to act: with attachment, which binds, or as an offering, which frees. Janaka, a king and householder, is the tradition’s model of perfection reached through action.", "r": "Where in my life am I physically still but mentally busy, or the reverse?", "s": 7}, {"t": "mc", "q": "Gita 4.18 speaks of seeing inaction in action and action in inaction. Which pair of people best illustrates both halves?", "o": ["A person who never rests from work, and a person who refuses every responsibility and sits at home all day.", "A person who meditates for hours each day, and a person who never meditates and only attends to household chores.", "A cook busy in a crowded kitchen with a calm mind, and a person sitting still whose mind churns with resentment.", "A person who works only for money, and a person who works only for praise and recognition from other people."], "a": 2, "e": "At the level of practice, a person can be outwardly very busy while the mind is calm, and another can be outwardly idle while the mind is in turmoil. The second is still acting, because the mind is engaged. At the deepest level the Self stays actionless in the midst of work. Swami Vivekananda gives the ideal as calm in the midst of activity and activity in the midst of calm.", "r": "When was I last busy and calm, and when was I last still and restless?", "s": 7}, {"t": "mc", "q": "Someone reads the Īśā Upaniṣad (“enjoy through renunciation”) and concludes: “Then I must give away everything I own and cut every tie.” How does the class read the verse?", "o": ["It teaches that nothing in the world has any value, so we need not care for our work, our home or our family.", "It asks us to give up the claim of ownership: we use what comes with gratitude, without clutching, as held on trust.", "It asks us to refuse every enjoyment, since the world is an obstacle standing between the person and the Lord.", "It applies only to monastics, so householders may set aside the first verse and keep their possessions as their own."], "a": 1, "e": "The first verse sees the whole world as pervaded by the Lord. From this follows enjoying through renunciation: using what comes to us without ownership, and without coveting. This is a mental renunciation, not a physical one. The second verse then draws the practical conclusion that one need not leave action. By this way, action does not stain.", "r": "What do I treat as “mine” in my work, and what changes if I regard it as held on trust?", "s": 8}, {"t": "mc", "q": "A schoolteacher says: “My days are all noise and demands. I could never live like the lotus leaf in Gita 5.10.” What does the image actually claim?", "o": ["The leaf lives in the water and stays dry: the mind can be fully engaged in the world and remain unstained.", "The leaf avoids contact with the water, so a person should keep away from demanding people and crowded places.", "The leaf is unstained because it does nothing, so a person should reduce activity to the barest possible minimum.", "The leaf grows only in still ponds, so a person must first arrange a quiet life before the teaching can apply."], "a": 0, "e": "The lotus leaf stays in the water yet remains dry. In the same way, one who acts with all actions offered to Brahman, free from attachment, is untouched by what the action leaves behind. The Gita does not ask for a quiet life. It teaches that the mind can be engaged in the world and remain unstained.", "r": "Is there one daily action I can begin to treat as worship this week?", "s": 9}, {"t": "mc", "q": "A colleague says: “I do not believe in a personal God, so offering my work is not for me.” What does the class suggest?", "o": ["He can skip the offering and simply work harder, since the effort is what the teaching actually asks of us.", "The teaching is closed to him, since an offering needs a personal God to receive it, and he has none.", "The offering can be made to whatever he regards as highest: the Truth, the good of all, or the Self within.", "He should first adopt a personal God for the purpose, and only then begin to offer his work to that God."], "a": 2, "e": "The teaching is about the spirit in which work is done. Meaning comes from that spirit and not from the status of the work. The practice of silently saying “This is Yours” before a task and “May it be good, as You will” after it can be addressed to whatever one holds highest. The Gita’s own phrase is mad-arpaṇam, “as an offering to Me”, and the class makes clear that the practice is open to everyone.", "r": "If I had to name what I hold highest, what would I offer my work to?", "s": 9}, {"t": "mc", "q": "A chief executive works anxiously, from fear of losing status. A cleaner in the same building works steadily and freely. Who is working “like a master” in Swami Vivekananda’s sense?", "o": ["The chief executive, because a master is someone in command of other people and of the building’s work.", "The cleaner: master and slave describe an inner attitude, free or compelled, and not an outer position.", "Neither of them, because only a person who has given up all work can be called a master in this sense.", "Both of them, because anyone who works hard and with skill is already a master of the work."], "a": 1, "e": "The slave works under compulsion: from need, from fear of loss, from craving for approval. The master works from inner freedom, and so can give himself fully to the work without being owned by it. A cleaner can work as a master and a chief executive can work as a slave. What decides it is whether the mind is free or compelled. Freedom is not the absence of work but the absence of compulsion.", "r": "Where in my own work do I feel like a slave, and where like a master? What is different in the two cases?", "s": 10}, {"t": "mc", "q": "A listener says: “Unselfish work is just being nice. Why does Swami Vivekananda attach so much weight to it?” Which reply is closest to the class?", "o": ["It makes the world a better place, and that outward benefit to others is the whole purpose of the practice.", "It lets the worker be admired by others, and that admiration builds the confidence needed to take up meditation seriously and keep at it.", "Unselfishness is a practice with a purpose: it weakens the small ego and reveals the Self, so work becomes a means to freedom.", "It earns merit that is stored up in this life and spent on a better birth, which is the real aim of the practice."], "a": 2, "e": "For Swami Vivekananda, Karma-Yoga is the attaining, through unselfish work, of that freedom which is the goal of all human nature. Each action leaves an impression on the mind, and the sum of the impressions forms character. Selfish action strengthens the ego and unselfish action weakens it. In this view work is the great school of character, and unselfishness is a means and not only a virtue.", "r": "Which of my recent actions weakened the small ego, and which strengthened it?", "s": 10}, {"t": "mc", "q": "For weeks Mia has helped a neighbour, and she is growing resentful that he never says thank you. Which shift would be most useful, following Swami Vivekananda’s teaching?", "o": ["Stop helping him until he shows that he values it, since constant giving without any return only breeds resentment.", "Tell him plainly that she expects gratitude, since honest communication is the fair way to settle such feelings.", "See that she is the one receiving a chance to grow, and that, having offered the fruits, she has no claim on thanks.", "Keep helping, but remind herself that he is in need and she is not, so that her patience with him does not run out so quickly."], "a": 2, "e": "Swami Vivekananda turns the usual picture of charity upside down: the giver is the one who is blessed, because service is an occasion to loosen selfishness and grow. If the fruits are offered to the Lord, there is no claim on any return from people. Gratitude then replaces superiority. The option that reminds herself that he is in need and she is not is the high pedestal that he warns against.", "r": "Think of a recent act of help. Did I feel I was giving, or was I also receiving?", "s": 11}, {"t": "mc", "q": "Sri Ramakrishna compared a devotee in the world to a maidservant in a rich man’s house. What does the image teach about how to live and work?", "o": ["She keeps her mind fixed on the rich man’s house, so a devotee should treat the world as the true and lasting home of the soul.", "She works only until her own home is secure, so a devotee should earn first and think of God later.", "She works carelessly because the house is not hers, so a devotee should do the bare minimum at work.", "She works attentively while her mind rests on her own home: full engagement and inner detachment go together."], "a": 3, "e": "The maidservant performs all the household tasks attentively, even brings up the children as if they were her own, yet her mind is on her own home in the village. The tortoise moves in the water with its thought on its eggs on the bank. What matters is the inner anchor, and not the outer role. This is the Gita’s teaching in the speech of ordinary life.", "r": "What is my “home in the village”, the thing my mind returns to while my hands are busy?", "s": 12}, {"t": "mc", "q": "At a shelter, one volunteer thinks: “I feel such compassion for these poor people.” Another serves thinking: “This person is the Lord in front of me.” What does the teaching Śiva-jñāne jīva-sevā say about the difference?", "o": ["Compassion can hide a sense of height; serving in the knowledge that the other is Śiva keeps the giver a worshipper.", "The first volunteer is better, since warm compassion is a fuller expression of love than formal worship of the one served.", "The second volunteer is better, since the people are in fact divine and so do not really need any practical help.", "There is no difference of importance, since the practical help given to the people is exactly the same in both cases."], "a": 0, "e": "At Dakshineswar a visitor spoke of compassion for all beings as an ideal, and Sri Ramakrishna said, in effect: who are you to show compassion? Serve each being as God. Narendra, outside the room, heard in this something new. Service given in the knowledge that the other is Śiva keeps the giver in the posture of a worshipper and the help remains real, because it is an act of worship.", "r": "Whom can I begin to see as the Lord in my daily life?", "s": 13}, {"t": "mc", "q": "A company runs an excellent charity programme, but the staff take part only to improve the company’s reputation. According to the class, what separates Seva Yoga from this?", "o": ["The inner attitude of seeing the Divine in the one served; without it, the same work is good philanthropy but not yet yoga.", "Whether the people served are told that the service is a spiritual practice, since honesty about the motive is what counts.", "The amount given, since Seva Yoga requires the giver to give far more, and more often, than ordinary philanthropy does.", "The setting, since Seva Yoga happens only in temples and centres, and service outside them cannot be yoga at all."], "a": 0, "e": "Seva Yoga rests on the teaching to recognise all as manifestations of God and to serve them as such. In it the inner attitude is the essential element. Without it the same outer work is philanthropy, which is good but not yet yoga. The class is clear that philanthropy is valuable, and that the difference lies in the mind of the giver.", "r": "In my own service, which of these is strongest: duty, kindness, or worship?", "s": 14}, {"t": "mc", "q": "A devotee spends the whole week on service and never prays. Another meditates daily and never serves. What does the motto of the Ramakrishna Mission suggest about both?", "o": ["The second is right, since only the inner life matters and service is a distraction from the real path to liberation and the goal of life.", "Both are right, since every person should follow only the single path that happens to suit their temperament best.", "Service without spiritual practice runs dry, and practice without service becomes self-absorbed; the motto holds both together.", "The first is right, since service is the only real practice and prayer is a private indulgence that helps nobody else."], "a": 2, "e": "The motto Ātmano mokṣārthaṃ jagad-dhitāya ca means “for one’s own liberation and for the welfare of the world”. It holds two aims together. Holy Mother made the same point in her own way: duties keep the mind in good condition, but japa, meditation and prayer are also very necessary. The two practices support each other.", "r": "If I look at my week, which side is missing: the inner practice, or the service?", "s": 14}, {"t": "mc", "q": "A colleague treats cleaning tasks as beneath him and does them carelessly. Which of Holy Mother’s teachings speaks most directly to this?", "o": ["Only work that serves other people directly deserves full attention, and chores may be done in a hurry.", "Cleaning is a lower kind of work, and a person with a spiritual aim should avoid it wherever possible.", "Even an insignificant work is done with respect; there is no ranking of tasks as spiritual or worldly.", "Careful work matters only when someone important is watching, since respect is mostly a social courtesy."], "a": 2, "e": "Holy Mother once corrected someone who dropped a broom carelessly after sweeping, saying that one should perform even an insignificant work with respect. She also taught that through work alone one can remove the bondage of work, not by avoiding it. In the Gita’s view (18.45), each person devoted to their own work attains perfection, so the question is not what the work is but how it is done.", "r": "What small task can I do today with Holy Mother’s respect for even insignificant work?", "s": 15}, {"t": "match", "q": "Which pitfall is each person falling into? Choose one for each line.", "rows": ["Jun tells himself that he is practising detachment, and has stopped caring whether the work is any good.", "Maria keeps checking whether anyone has noticed how much she did.", "Dev works every night until exhaustion, and says he is following “work incessantly”.", "Tom feels that the people he serves are an obstacle to his time."], "c": ["Detachment turned into indifference", "Hidden hope for thanks", "Burnout through misreading “work incessantly”", "Resentment toward those served", "Pride in being a giver"], "ans": [0, 1, 2, 3], "e": "Each pitfall has a correction. Care fully and hold lightly, when detachment turns into indifference. Offer the work and let it go, when a hidden hope for thanks shows that the fruit is still claimed. Remember that rest is part of the offering, because a depleted instrument serves poorly. See the person served as the Lord, when resentment arises. And remember that the giver is the one who is blessed, to meet pride. These are not failures of character, only signs that old habits of ego are still at work. Notice, smile and return to the offering.", "r": "Which of these pitfalls keeps returning in my own life?", "s": 16}, {"t": "mc", "q": "Aroha is inspired and decides to start all five steps of the daily practice tomorrow, every day, without a miss. What does the class advise, and why?", "o": ["Practise only on days when she feels spiritually inclined, so that the practice stays sincere and is never forced or turned into a mechanical habit.", "Begin with the evening review alone and wait several months before adding any other step to the daily practice.", "Start all five steps at once, since half-measures never form a habit and the whole practice depends on every part.", "Begin with one step for one week and add another only when it feels natural: small and steady beats ambitious and abandoned."], "a": 3, "e": "The practice has five steps: a morning offering, remembrance in the middle of work, release of the result when a task ends, seeing the Lord in the one served, and an evening review. The class advises beginning with one step for one week. Small and steady is better than ambitious and abandoned. A notebook with one line each evening helps. If a day is missed, do not catch up and do not scold. Begin again with the morning offering.", "r": "Which one step will I begin with this week?", "s": 17}, {"t": "mc", "q": "During his evening review, Sam finds himself replaying a harsh argument and criticising himself for it. What does the class suggest?", "o": ["Return to the stance of a witness, not a judge: observe kindly, and if it turns to rumination, stop, breathe and offer the thought.", "Go over the argument again in more detail until he understands exactly what he did wrong and why it happened.", "Skip the review for a few weeks, since looking back over the day is harmful for people who are self-critical.", "Resolve to be perfect tomorrow and write the resolution on the checklist, so that the same slip is never repeated again in the days that follow."], "a": 0, "e": "The review is a short reflection of five to ten minutes: settle with three breaths, replay the day as a witness, ask the checklist questions, write one line, and offer the day. The spirit matters most. Vedanta calls the Self the witness (sākṣī), and the review borrows that standpoint in a modest way. Observation with kindness leads to learning, and harsh judgement leads to discouragement.", "r": "How do I speak to myself at the end of a difficult day?", "s": 18}, {"t": "mc", "q": "At the end of a week Lena sees that “pause in the day” is blank on most days, while “morning offering” is ticked every day. How does the class suggest she reads the tracker?", "o": ["The week is useful only if every row is filled, so she should discard the tracker and begin the whole week again from the start.", "The blank row may be too hard or badly timed, so make it smaller; the always-ticked row is natural and another can be added.", "The ticked row shows she has outgrown it, so she can drop the morning offering and keep only the other rows.", "The blank row shows failure, so she should catch up by doing it several times a day all through next week."], "a": 1, "e": "At the end of the week the pattern is read, without scolding. Mostly blank rows may be too hard or badly timed, so make them smaller. Always-ticked rows have become natural, so another can be added. A blank is information, not failure. It is also worth noticing any pride in a full row or disappointment in an empty one, since that is the practice again.", "r": "What helped this week, what got in the way, and what one adjustment will I make?", "s": 20}, {"t": "mc", "q": "After three months of practice, which of these would the class count as a sign of progress?", "o": ["Every row of the weekly tracker is ticked every single day without a gap, as a mark of real discipline.", "The daily practice has become so natural that formal meditation is no longer needed in the morning or evening.", "Anger and worry no longer arise at all, and the mind stays untroubled in every situation she meets.", "Praise and blame disturb the mind less and for less time, and recovery after a slip is quicker."], "a": 3, "e": "Signs of progress are small and quiet: the pause comes more easily, praise and blame disturb the mind less and for less time, work is steadier, patience with difficult people grows, recovery after a slip is quicker, and service brings gratitude and not a sense of being owed. Gita 6.35 reminds us that the restless mind is held by practice and detachment together. If life is overwhelming, speak with a trusted teacher, friend or qualified professional.", "r": "Which practice has become natural for me, and which pitfall keeps returning?", "s": 21}];

 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}

 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<a href="../answers/#q'+(k+1)+'" target="_blank" rel="noopener"><b>Q'+(k+1)+'</b></a> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><a class="btn" href="../answers/" target="_blank" rel="noopener">Read all the answers</a><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';

 app.innerHTML='<div class="card"><p>Loading your quiz…</p></div>';
 const ping=()=>{if(done)return;if(++n>6)return go(saved());try{window.parent.postMessage({type:'ready',code:QCODE},'*')}catch(e){}};
