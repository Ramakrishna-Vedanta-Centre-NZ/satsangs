:root{--navy:#12285A;--navy2:#1D3770;--cream:#FBF5EA;--card:#FFFDF8;--gold:#C9A24A;--goldt:#6B4E0E;--green:#2F5A2E;--pink:#C2557A;--ink:#1E1E1E;--line:#E6DAC3}
*{margin:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans',Arial,sans-serif;font-size:var(--fs-body,15px);line-height:var(--lh-body,1.75);min-height:100vh;-webkit-text-size-adjust:100%}

.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;font:450 var(--fs-text,13.5px)/var(--lh-option,1.5) 'Noto Sans',sans-serif;color:var(--ink);cursor:pointer}

.join a{color:#E6C36A;font-weight:700}

<script>
const Q=[{"t": "mc", "q": "Two ideas carry the whole of this class. Which pair are they?", "o": ["Bhakti Yoga and Haṭha Yoga", "Niṣkāma Karma and Seva Yoga", "Jñāna Yoga and Rāja Yoga", "Dharma and Artha"], "a": 1, "e": "Niṣkāma Karma is action done wholeheartedly without craving for the result. Seva Yoga is work offered as service, seeing the Divine in the one served.", "r": "Which of my daily hours feels most separate from my spiritual life?", "s": 1}, {"t": "mc", "q": "In the classical order of Vedantic learning, the talk at the class corresponds to which stage?", "o": ["Renunciation (saṃnyāsa)", "Reflection (manana)", "Meditation (nididhyāsana)", "Listening (śravaṇa)"], "a": 3, "e": "The talk is listening (śravaṇa). The question time is reflection (manana). The two guided sittings are meditation (nididhyāsana), where the teaching begins to be absorbed.", "r": "What do I usually do in the first five minutes of a study session, and does it prepare my mind?", "s": 2}, {"t": "mc", "q": "Vedanta says that when everyday work becomes spiritual life, what changes?", "o": ["The occupation: we must give up our job", "The hours: we must work less", "The place: we must move to a forest", "The inner attitude, while the tasks stay the same"], "a": 3, "e": "The cooking, the emails and the caring stay. What changes is the attitude, from “this is mine, and I must succeed” to “this is offered, and I will do my best”. The Gita is spoken on a battlefield, not in a forest.", "r": "Think of a recurring task I dislike. Is the discomfort in the task, or in my resistance to it?", "s": 3}, {"t": "match", "q": "Which knot is it? Choose one for each line.", "rows": ["“I am accomplishing this.”", "“I must get the reward.”", "Clinging to praise and to ownership of what we do", "The sense of being the one who acts"], "c": ["Kartṛtva (the doer)", "Bhoktṛtva (the enjoyer)", "Saṅga (attachment)"], "ans": [0, 1, 2, 0], "e": "Kartṛtva is the sense of being the doer, bhoktṛtva the sense of being the enjoyer who must receive the reward, and saṅga is clinging to outcomes, praise and ownership. It is not action itself that binds, but this way of relating to action. Together they bring anxiety before the task and elation or disappointment after it.", "r": "Which of the three knots is strongest in me this week?", "s": 4}, {"t": "mc", "q": "Gita 2.47 begins “karmaṇy evādhikāras te mā … kadācana”. Which word completes the line, “never to its ______”?", "o": ["kāmeṣu (the desires)", "karmaṇi (the action)", "phaleṣu (the fruits)", "yajñeṣu (the offerings)"], "a": 2, "e": "“You have a right to action alone, never to its fruits.” In Devanagari: कर्मण्येवाधिकारस्ते मा फलेषु कदाचन. The verse gives four instructions: act; do not claim the fruit; do not make the fruit your motive; do not drift into inaction.", "r": "What is one task where I confuse caring about the work with needing the result?", "s": 5}, {"t": "mc", "q": "In Gita 2.48, how is yoga defined?", "o": ["Strict fasting", "Withdrawal from all work", "Skill in speech", "Equanimity, being level in success and failure"], "a": 3, "e": "Gita 2.48 says samatvaṁ yoga ucyate: evenness of mind is called yoga. Gita 2.50 adds that yoga is skill in action. Equanimity is the inner side of work and excellence the outer side.", "r": "Recall a time I worked at my best. Was my mind on the task or on the result?", "s": 6}, {"t": "mc", "q": "According to Gita 3.9, what is the one kind of work that does not bind?", "o": ["Work done for payment", "Work done quickly", "Work done as an offering (yajña)", "Work done alone"], "a": 2, "e": "Except for work done as an offering, this world is bound by action. The same work either binds or frees, depending on whether it is offered. Krishna also says no one can remain without action even for a moment.", "r": "Where am I physically still but mentally busy, or the reverse?", "s": 7}, {"t": "mc", "q": "Swami Vivekananda quotes the opening of the Īśā Upaniṣad: “Whatever exists in this universe is to be covered with the …”", "o": ["Wealth of the world", "Veil of māyā", "Silence of the forest", "Lord"], "a": 3, "e": "The vision of the Divine in all things is the ground of Karma Yoga. Seeing the world as pervaded by the Lord, we use what comes to us without ownership.", "r": "What do I treat as “mine” in my work? What changes if I hold it as held on trust?", "s": 8}, {"t": "mc", "q": "Gita 5.10 says that a person who offers all actions to Brahman is untouched, like which image?", "o": ["A rock in a river", "A tree in a storm", "A candle in the wind", "A lotus leaf in water"], "a": 3, "e": "The lotus leaf lives in water yet stays dry. The mind can be fully engaged in the world and remain unstained. Gita 9.27 adds that even eating can be offered, and 18.46 that the work itself is the worship.", "r": "Is there one daily action I can begin to treat as worship this week?", "s": 9}, {"t": "match", "q": "Master or slave? Choose one for each line (Swami Vivekananda, Karma-Yoga).", "rows": ["Works under compulsion, from need, fear of loss or craving for approval", "Works from inner freedom and is not owned by the work", "Is driven by the result and by what others will say", "Can give himself fully to the work without being bound by it"], "c": ["The master", "The slave"], "ans": [1, 0, 1, 0], "e": "Swami Vivekananda: “You should work like a master and not as a slave; work incessantly, but do not do slave’s work.” The slave works under compulsion. The master works from inner freedom. Freedom is not the absence of work but the absence of compulsion.", "r": "Where in my own work do I feel like a slave, and where like a master?", "s": 10}, {"t": "mc", "q": "Swami Vivekananda: “It is not the receiver that is blessed, but it is the …”", "o": ["One who stays silent", "One who prays loudest", "Giver", "One who gives the most"], "a": 2, "e": "He turns the usual picture of charity upside down. Service is an occasion for the giver to loosen selfishness and grow. Gratitude replaces superiority.", "r": "Think of a recent act of help. Did I feel I was giving, or was I also receiving?", "s": 11}, {"t": "mc", "q": "In Sri Ramakrishna’s image, where is the mind of the maidservant in a rich man’s house?", "o": ["On her own home in the village", "On her wages", "On the next meal", "On the master’s wealth"], "a": 0, "e": "She does all the household work attentively, yet her mind is on her own home. In the same way the devotee carries out all duties while the mind rests in God. The tortoise image teaches the same.", "r": "What is my own “hand that holds on to God” while the other hand does the duties?", "s": 12}, {"t": "mc", "q": "What does the teaching Śiva-jñāne jīva-sevā ask of us?", "o": ["To serve only those who thank us", "To serve each living being knowing it is Śiva, the Divine", "To give money to temples", "To show compassion from a height"], "a": 1, "e": "Compassion (dayā) can hide a sense of height. Service given in the knowledge that the other is Śiva keeps the giver in the position of a worshipper, which is why service becomes worship.", "r": "Think of someone I find hard to serve. What changes if I try to see Śiva in them, even for one minute?", "s": 13}, {"t": "mc", "q": "What separates Seva Yoga from ordinary philanthropy?", "o": ["The size of the gift", "The inner attitude: offering, selfless motive and seeing God in the one served", "The number of people helped", "Whether the work is public"], "a": 1, "e": "Without the inner attitude the same outer work is good philanthropy but not yet yoga. Swami Vivekananda founded the Ramakrishna Mission on 1 May 1897 so that service and spiritual practice would support each other.", "r": "Do I have both halves, my own growth and the welfare of others, in my week?", "s": 14}, {"t": "mc", "q": "Holy Mother: “Through work alone one can remove the bondage of work, not by avoiding …”", "o": ["Work", "The world", "Prayer", "Other people"], "a": 0, "e": "Holy Mother lived this teaching in cooking, nursing and running a household. Work purifies; avoiding work does not free us. She also taught that no one is a stranger and that the whole world is our own.", "r": "What task do I habitually do carelessly because it seems small? What would change if I did it with respect?", "s": 15}, {"t": "match", "q": "Match each pitfall to its correction.", "rows": ["Detachment becomes indifference", "Hidden hope for thanks", "Resentment toward those served", "Pride in being a giver"], "c": ["Care fully, hold lightly", "Offer the work, then let it go", "See them as the Lord", "Remember that the giver is the one who is blessed"], "ans": [0, 1, 2, 3], "e": "The path has five typical traps; the fifth is burnout, corrected by treating rest as part of the offering. They are not failures of character, only old habits of ego. Notice the trap without scolding yourself, smile, and return to the offering.", "r": "Which of the five pitfalls is most familiar to me? What small correction can I try this week?", "s": 16}, {"t": "mc", "q": "Which step of the five-step daily practice is “Done, offered.”?", "o": ["Release the result", "Morning offering", "See the Lord in the one served", "Remembrance in the middle of work"], "a": 0, "e": "Releasing the result at the end of a task is Gita 2.47 in practice. The five steps are: morning offering, remembrance in the middle of work, release the result, see the Lord in the one served, and evening review.", "r": "Which step is easiest for me, and which is hardest? Begin with the easiest.", "s": 17}, {"t": "mc", "q": "What is the spirit of the evening review?", "o": ["A strict exam of the day", "Witness, not judge", "A list of other people’s faults", "A way to plan tomorrow’s work only"], "a": 1, "e": "Vedanta describes the Self as the witness (sākṣī). The review borrows that standpoint modestly. Observation with kindness leads to learning; harsh judgement leads to discouragement. Keep it short: three lines are enough.", "r": "When I look back on my day, do I observe like a witness or judge like a critic?", "s": 18}, {"t": "match", "q": "What does each mark on the daily checklist mean?", "rows": ["A tick", "A dash", "A blank", "If you miss a whole day"], "c": ["Done with some attention, even if imperfectly", "Done partly", "Not today: it is information, not failure", "Do not catch up and do not scold: begin again with the morning offering"], "ans": [0, 1, 2, 3], "e": "A blank is information, not failure. Do not aim for twelve ticks: begin with three or four items for a week, then add more. A day with a few honest ticks is worth more than a day of hurried ticks.", "r": "Which three items will I begin with this week?", "s": 19}, {"t": "mc", "q": "On the weekly tracker, a row that is always ticked suggests what?", "o": ["You should stop that practice", "You are cheating", "The practice has become natural and you may add another", "The row is too hard"], "a": 2, "e": "Rows that are mostly blank may be too hard or badly timed: make them smaller. Always-ticked rows have become natural. Notice pride at a full row or disappointment at an empty one: that is the same practice again, at a finer level.", "r": "What would a “good enough” week look like for me?", "s": 20}, {"t": "mc", "q": "Gita 6.35 says the restless mind is held by which two together?", "o": ["Silence and solitude", "Practice (abhyāsa) and detachment (vairāgya)", "Effort and reward", "Study and debate"], "a": 1, "e": "Practice builds the habit and detachment loosens the grip on results. The checklist is practice; releasing the result is detachment. Plateaus and setbacks are normal: return to the offering and keep the practice small.", "r": "Which practice has become natural for me, and which pitfall keeps returning?", "s": 21}, {"t": "mc", "q": "In the Centre’s guided meditation for beginners, what do you see in the region of the heart?", "o": ["A fresh, fully bloomed lotus with a light at its centre", "A river", "A mountain", "A closed door"], "a": 0, "e": "From the centre of the lotus a light shines and fills the whole body and mind. With each breath you breathe in the light of knowledge, peace, purity, bliss and strength. The practice takes about fifteen minutes.", "r": "When the mind wanders, can I return gently to the light, without scolding myself?", "s": 22}, {"t": "mc", "q": "In the meditation on offering the day’s work, each task is pictured as what?", "o": ["A flower placed at the feet of the Divine", "A weight to put down", "A letter to be posted", "A seed to be planted"], "a": 0, "e": "This is arpaṇa, offering. Then silently repeat “Whatever I do, I offer to You”, in the spirit of Gita 9.27, and rest in the stillness beneath the activity. It takes about ten minutes.", "r": "After the meditation, how does the first task of the day feel? Is there any difference in the grip?", "s": 23}, {"t": "mc", "q": "For group study of the reflection questions, how do pairs work together?", "o": ["They debate until one wins", "They write answers for a teacher to mark", "One speaks for two minutes while the other listens without comment, then they swap", "They read the slides aloud"], "a": 2, "e": "There are no correct answers. Take one question a day and write a few lines. If one question is uncomfortable, that may be the one to stay with.", "r": "Which of the five questions made me most uncomfortable?", "s": 24}, {"t": "mc", "q": "When is the next Hamilton Vedanta-Meditation class after HVM-001?", "o": ["Sunday 8 November", "Wednesday 11 November", "Wednesday 4 November", "Wednesday 2 December"], "a": 2, "e": "The Hamilton class meets on the first Wednesday of each month: 4 November, 2 December and 6 January. Entry is free and donations are welcome. Register at www.vedanta.nz/event-list.", "r": "Which one practice will I carry through the coming month?", "s": 25}];
const M=4;let i=0,score=0,ans=[];const TOT=100;
const EMBED=/[?&]embed=1/.test(location.search)||window.self!==window.top;
const QCODE='HVM-001',QTITLE='Spiritualising Everyday Life: Niṣkāma Karma and Seva Yoga',QPROG='Satsang Study';
let saveState='';
const SK='rvcQuiz:'+QCODE;
function keep(){const st=(ans.length&&ans.length<Q.length)?{score:score,ans:ans,t:Date.now()}:null;try{if(st)localStorage.setItem(SK,JSON.stringify(st));else localStorage.removeItem(SK)}catch(e){}if(EMBED)try{window.parent.postMessage({type:'progress',code:QCODE,state:st},'*')}catch(e){}}
function valid(v){return v&&Array.isArray(v.ans)&&v.ans.length>0&&v.ans.length<Q.length&&typeof v.score==='number'?v:null}
function saved(){try{return valid(JSON.parse(localStorage.getItem(SK)||'null'))}catch(e){return null}}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='saved')saveState='saved';else if(d.type==='saveError')saveState='error';else if(d.type==='notMember')saveState='guest';else return;const el=document.getElementById('savemsg');if(el)el.innerHTML=saveMsg()});
function saveMsg(){return saveState==='saved'?'✓ Your result has been saved to your account. See all your results on <a href="https://www.vedanta.nz/my-journey" target="_top">My Journey</a>.':saveState==='error'?'Your result could not be saved just now. Please try again, or write to mail@vedanta.nz.':saveState==='guest'?'Sign in to vedanta.nz to save your results.':'Saving your result…'}
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hdr(){document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';document.getElementById('sc').textContent='Score: '+score+' / '+TOT;document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%'}
function fb(ok,gain,ansText,q){const el=document.getElementById('fb');el.className='fb '+(ok?'ok':'no');el.innerHTML='<b>'+(ok?'Correct! +'+gain+' marks':(gain>0?'Partly right: +'+gain+' of 4 marks.':'Not quite.')+(ansText?' The answer is: '+esc(ansText):''))+'</b>'+esc(q.e)+' <i>(See slide '+q.s+'.)</i><div class="refl"><b>Reflect:</b> '+esc(q.r)+'</div>';document.getElementById('nx').style.display='inline-block';keep();hdr()}
function show(){hdr();if(i>=Q.length)return result();const q=Q[i];
 let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · 4 MARKS'+(q.t==='match'?' · MATCHING':'')+'</p><p class="q">'+esc(q.q)+'</p>';
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:var(--fs-text,13.5px);color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:var(--fs-small,12.5px);color:#6B6B6B;text-align:center;margin-top:12px">Your answers are saved as you go, so you can stop at any time and continue later. Sign in to vedanta.nz to continue on any device.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}
function alertBox(){const el=document.getElementById('fb');el.className='fb no';el.innerHTML='<b>Please choose an answer for every line first.</b>'}
function result(){const p=score;try{localStorage.removeItem(SK)}catch(e){}
 const band=p>=90?['Excellent!','You have absorbed the class beautifully. May your daily work become an offering.']:p>=70?['Very good','You have understood most of the class. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+TOT+'</span></p><p class="band">'+band[0]+'</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<b>Q'+(k+1)+'</b> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';
 if(EMBED)r=r.replace('<div class="acts">','<p id="savemsg" style="font-size:var(--fs-text,13.5px);background:#E8EEDF;border-radius:10px;padding:10px 12px;margin-top:14px">'+saveMsg()+'</p><div class="acts">');
 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
 document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
function start(){if(!EMBED)return offer(saved());
 let done=false,n=0,tm=null;const go=v=>{if(done)return;done=true;if(tm)clearInterval(tm);offer(v)};
 window.addEventListener('message',e=>{const d=e.data||{};if(d.type!=='resume')return;const a=valid(d.state),b=saved();go(a&&b?((a.t||0)>=(b.t||0)?a:b):(a||b))});
 app.innerHTML='<div class="card"><p>Loading your quiz…</p></div>';
 const ping=()=>{if(done)return;if(++n>6)return go(saved());try{window.parent.postMessage({type:'ready',code:QCODE},'*')}catch(e){}};
 tm=setInterval(ping,500);ping()}
function offer(v){if(!v)return show();
 const n=v.ans.length;i=n;score=v.score;hdr();document.getElementById('pos').textContent='Paused at question '+(n+1)+' of '+Q.length;
 app.innerHTML='<div class="card"><p class="qn">WELCOME BACK</p><p class="q">You have answered '+n+' of '+Q.length+' questions so far, with '+v.score+' marks.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn gold" id="cont">Continue from question '+(n+1)+' ›</button><button class="btn" id="fresh">Start again</button></div></div>';
 document.getElementById('cont').onclick=()=>{ans=v.ans;score=v.score;i=n;show()};
 document.getElementById('fresh').onclick=()=>{i=0;score=0;ans=[];keep();show()}}
start();
</script></body></html>
