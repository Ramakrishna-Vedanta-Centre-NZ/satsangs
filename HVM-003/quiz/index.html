<header><img src="../logo.png" alt="Ramakrishna Vedanta NZ emblem"><p class="ey">REVISION QUIZ · HVM-003</p><h1>Free Will and Divine Will</h1><p>25 questions · 100 marks · explanations and reflections</p></header>

<footer>Ramakrishna Vedanta Centre NZ · <a href="https://www.vedanta.nz/course/satsang-study" target="_top">Back to the course</a> · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
<script>
const Q=[{"t": "mc", "q": "You are waiting in a hospital corridor for news, and ten minutes feel like an hour. In the language of this satsang, what is happening, and what would help most?", "o": ["The clock itself slows under stress, so nothing can help until the news finally arrives and the wait ends.", "Δφ has grown too large, so the only remedy is to keep repeating to yourself, over and over, that you are not the doer.", "The mind is far out of tune with what is present; steadying the breath and attending to what is here narrows Δf.", "The future is already fixed, so the sense of dragging time is simply a sign that worrying is pointless."], "a": 2, "e": "Time drags when the mind beats against its situation: a large Δf gives many thin beats, each felt as a tick. Steady breathing and attention to what is actually present bring the mind's rhythm closer to what is unfolding, and the beat slows. The clock does not change (option A), and repeating a formula about the doer (B) works on the other dial, Δφ, not the restlessness. Fatalism (D) offers no help for the mind in front of us.", "r": "Where in my week does time drag most, and what simple act of attention could I bring there?", "s": 11, "lv": "apply"}, {"t": "mc", "q": "A surgeon is completely absorbed in a long operation; hours vanish. Afterwards she thinks, \"That was my finest work; no one else could have done it.\" What does the two-dial picture say about her?", "o": ["Δf closed during the work, but Δφ remained: deep concentration alone does not remove the claim.", "Because time vanished for her, she must have been completely free of the ego all through the operation.", "Her pride shows that she was never truly absorbed, since real concentration cannot exist alongside ego.", "Nothing is amiss, because quiet pride in excellent work is exactly the same thing as offering it."], "a": 0, "e": "The two gaps are separate. Absorption closes Δf, so time vanishes, but the I-maker's tilt, Δφ, can stay and shows itself afterwards as \"my finest work\". This is why the satsang says concentration alone does not free us, and why the subtle ego shows itself most clearly in a concentrated mind. Her absorption was real (against C), but it did not remove the claim (against B), and pride is the claim, not an offering (against D).", "r": "After my best work, what is the first thought that arises? Whose work do I take it to be?", "s": 12, "lv": "analyse"}, {"t": "mc", "q": "A friend says: \"Arjuna saw the war as already fought. So the future is fixed, and nothing I do matters. I'll stop studying for my exam.\" Which response best fits the teaching?", "o": ["He is right in principle, but he should study anyway, simply to keep his parents and teachers content.", "The whole may be seen from above, but the road must still be driven; refusing effort only turns the claim towards doing nothing.", "Arjuna's vision is only a poetic image; the future is entirely open, and effort alone decides every result.", "He should study hard, because results depend wholly on his own effort, and grace plays no part at all in what comes to any of us."], "a": 1, "e": "Sri Krishna showed Arjuna the war as accomplished and in the same verse told him to arise and be an instrument (Gita 11.33). The view from the aeroplane does not take the steering wheel from the driver. Fatalism keeps Δφ, the claim, and simply points it at inaction: \"I need not bother\" is still the little \"i\" deciding. Option A gives the right action for the wrong reason; C and D swing to the other extreme and leave no place for the Divine Will or grace.", "r": "Where do I use \"it is all decided anyway\" to avoid an effort I know I should make?", "s": 25, "lv": "evaluate"}, {"t": "match", "q": "Which of the four ways of living best describes each person?", "rows": ["A gifted manager runs a flawless project, then is shaken for weeks by one critical email.", "A devotee prays sincerely every morning, but at work her mind darts from one worry to the next.", "A nurse on a hard shift gives full attention to each patient and leaves the outcome with the Divine Mother.", "An anxious, distracted student is sure that every poor mark proves he is a failure."], "c": ["Devoted but scattered", "Focused and surrendered", "Restless and self-centred", "Focused but self-centred"], "ans": [3, 0, 1, 2], "e": "The manager is focused (Δf closed while working) but still claims every result, so one criticism wounds: focused but self-centred. The devotee has offered her heart (Δφ released) but her mind is not yet steady: devoted but scattered. The nurse has both: full attention and no claim, the instrument. The student is restless (Δf wide) and holds every result as proof about himself: restless and self-centred. Most of us visit all four in a single day.", "r": "Which of the four do I live in most often at work, and which at home?", "s": 23, "lv": "analyse"}, {"t": "mc", "q": "In Libet's experiment the brain's readiness potential began about half a second before the movement, but the urge was felt only about 0.2 seconds before. Read with the four levels of Vāk, what does this suggest?", "o": ["Consciousness plays no part whatever in action, so all the moral teaching about effort, duty and choice turns out to be mistaken.", "The volunteers simply misread the clock, so the result tells us nothing about where actions really begin.", "The \"i\" is the true starting point, and the brain merely needs a little time to carry out its orders.", "The impulse was already descending through Paśyantī before it took the form the \"i\" could recognise and claim at Madhyamā."], "a": 3, "e": "The satsang lays the levels of Vāk beside Libet's timeline: the rising readiness potential matches Paśyantī, whole and wordless; the felt urge matches Madhyamā, where the impulse first has a form the \"i\" can claim; the movement is Vaikharī. The \"i\" arrives midway (against C). This is a contemplative reading, and science still debates the details, but no reading shows that awareness and effort are meaningless (against A), and method questions do not erase the basic timing (against B).", "r": "Can I catch, today, one impulse that was already moving before I said \"I want\"?", "s": 18, "lv": "analyse"}, {"t": "mc", "q": "Someone argues: \"Libet's veto proves the ego is the real master. It can always overrule any impulse if it tries hard enough.\" Which reply is most accurate?", "o": ["The veto is real but limited: it is a second impulse, discrimination, also from the Source and grown through practice.", "The veto is an illusion: once anything has begun at a subtler level, nothing at all can ever stop it.", "He is right: willpower is the whole of spiritual life, and a determined ego can defeat any impulse that it chooses to oppose.", "The veto belongs only in a laboratory and has no bearing on anger, habit or the way we speak to people."], "a": 0, "e": "Science finds the veto real but limited, with a point of no return (Schultze-Kraft and colleagues, 2016), so C overstates it and B denies it. The satsang reads the veto as a counter-impulse of discrimination that also descends from the Source and meets the first impulse at Madhyamā, carried by the impressions of practice. The Gita shows the limit of the ego's own resolve: a resolve made from egoism against one's nature is vain (18.59 to 60). The pause before reacting is exactly where this matters in daily life (against D).", "r": "Which of my reactions have I learnt to pause before, and how did that pause grow?", "s": 19, "lv": "evaluate"}, {"t": "mc", "q": "Which statement best distinguishes the two gaps of the mind-wave model?", "o": ["Δf and Δφ are two names for a single gap in the mind, and meditation alone closes it completely.", "Δf is felt as \"I am the doer\", while Δφ, the standing tilt that the I-maker brings to every meeting, is felt as the passing of time.", "Δf, the gap in rhythm between attention and its object, is felt as time; Δφ, the I-maker's tilt, is felt as \"I am the doer\".", "Δf belongs only to the body and Δφ only to the mind, so only Δφ has any place in spiritual practice."], "a": 2, "e": "Δf is a difference in rate between the attention wave and the object wave; its beat is felt as the passage of time. Δφ is a standing offset that the I-maker brings to every meeting, felt as \"this is mine\" and \"I did it\". They are separate (against A): Δf can close while Δφ stays. Option B reverses them, and D misplaces both: both act in the meeting of mind and object, and both matter for practice.", "r": "Today, when did I feel time dragging, and when did I feel \"I did that\"? Were they the same moment?", "s": 12, "lv": "understand"}, {"t": "mc", "q": "A colleague criticises your work sharply in front of others. Which of the practices fits best in that very moment?", "o": ["Begin the evening review there and then, by mentally listing every mistake you have made that day.", "Leave the room at once and do japa quietly until the feeling has passed completely, and only then come back to talk.", "Accept what comes by agreeing at once with every criticism, so that the ego is thoroughly humbled.", "Pause in the gap: one breath before replying, so that discrimination can act before the impulse becomes speech."], "a": 3, "e": "The pause is Libet's veto window made conscious: the impulse has taken form at Madhyamā but has not yet become words at Vaikharī. One breath lets discrimination meet it. The evening review (A) belongs to the evening and is not self-blame. Japa (B) steadies the rhythm, but walking out is avoidance, not practice in the moment. Accepting what comes (C) means accepting the situation as Her will for today, not agreeing with whatever is said.", "r": "Where could one breath before speaking change the course of a conversation this week?", "s": 28, "lv": "apply"}, {"t": "mc", "q": "A nurse works night shifts and wants a practice that turns both dials. Which plan brings the teaching together best?", "o": ["Offer the shift before it begins, give full attention to each patient, and review at the end who was the doer.", "Meditate for two hours after each shift, and keep work and spiritual life in two quite separate compartments of the day.", "Repeat \"I am not the doer\" during every task, so that real effort and attention are no longer needed.", "Concentrate harder at work so that time flies, trusting the claim to fade away of its own accord."], "a": 0, "e": "The plan combines practices for each dial: the offering and the review work on Δφ, the claim; full attention to each patient narrows Δf. It brings practice into the shift itself rather than after it (against B). Repeating a formula while dropping effort (C) misunderstands surrender, which is full effort with the claim given up. Concentration alone (D) closes Δf but can leave the claim untouched.", "r": "What would a practice for both dials look like in the busiest part of my own week?", "s": 28, "lv": "synthesise"}, {"t": "mc", "q": "Narada lived twelve years in what was half an hour for Sri Krishna, and Sri Ramakrishna saw millions of universes rise and fall in Chidākāśa. What single principle explains both?", "o": ["Holy people live for longer than others, and so their sense of time is naturally stretched.", "The reality is one, and the experience of time depends on the setting of the mind.", "Both are symbolic stories and say nothing about what minds can actually experience.", "Time runs faster in some places than in others, exactly as Einstein's relativity shows."], "a": 1, "e": "The three cases in Part 3 are read as data: the same span is a long stream of moments for a mind low on the dial and a single whole for a mind at the top. The satsang sets relativity aside (against D), since it concerns clock time, not lived time. Option A confuses length of life with breadth of awareness, and C ignores that the teachers report these states as experience.", "r": "When has a short span held a great deal for me, or a long one held very little?", "s": 6, "lv": "analyse"}, {"t": "mc", "q": "Which statement best expresses true freedom as this satsang presents it?", "o": ["Freedom is independence: the little \"i\" acting without any influence from anything outside it.", "Freedom is a strong will, trained over many years, that can overcome every obstacle in life by sheer force.", "Freedom is giving up all action entirely, so that only the Divine Will is left to act.", "Freedom is the little \"i\" coherent with the universal \"I\": one rhythm, and no tilt of the claim."], "a": 3, "e": "Two waves add fully only when they are coherent (Δf = 0) and in phase (Δφ = 0). So it is with the little \"i\" and the universal \"I\": freedom is not independence from the Divine Will (against A) but coherence with it. A strong will is still bound by cause and effect (against B), as Swami Vivekananda says. Giving up action (C) is not surrender; surrender is full effort without the claim.", "r": "In what part of my life do I still equate freedom with getting my own way?", "s": 24, "lv": "evaluate"}, {"t": "mc", "q": "At six every morning a man wants to meditate, wants to sleep in, and wants to check his messages. Most mornings he does none of them well. What lies at the root of his \"weak will\"?", "o": ["His little wills pull in different directions and cancel; self-control and steady practice line them up.", "He needs more desires, so that one of them grows strong enough to win out over the others.", "He was simply born with a weak will, and nothing he does now can ever really change it.", "His will is strong enough already, but his body is tired, so all that he needs is more sleep and a longer rest."], "a": 0, "e": "Scattered wills cancel and aligned wills add: a hundred waves out of step give only about ten times one, while a hundred in step give a hundred times. Swami Vivekananda teaches that self-control produces a mighty will, and that will is made by character, which is made by karma (Karma-Yoga). So the will can be trained (against C). More desires scatter it further (against B), and rest alone does not align it (against D).", "r": "Which two of my wishes most often pull against each other, and which one would I rather align with?", "s": 15, "lv": "analyse"}, {"t": "mc", "q": "Swami Vivekananda said that the will is not free, but the \"I\" behind the will is free. Someone concludes: \"Then I should stop making choices altogether.\" How should this be judged?", "o": ["It confuses two levels: the will is the instrument we must train, while freedom lies in the Self that good choices help reveal.", "It is correct, since the will is bound and so every act of choosing is simply a waste of effort.", "It is partly correct: one should choose carefully in spiritual matters, but leave all worldly matters entirely to fate and circumstance.", "It is mistaken, because the will is fully free whenever we happen to act from good motives."], "a": 0, "e": "The teaching distinguishes the will, which belongs to the world of cause and effect, from the Self behind it, which is free. That does not make choosing pointless (against B and C): Swami Vivekananda defines education as the training of the will, and the knowing will can free us. Nor is the will itself free when motives are good (against D); good motives make it a better instrument, not an independent one.", "r": "What choice am I avoiding by telling myself it does not matter?", "s": 22, "lv": "evaluate"}, {"t": "mc", "q": "Someone has lost a job and is torn between fear and anger. How do Holy Mother's story of the fish and the Gita's \"grieve not\" come together for this person?", "o": ["Stop struggling against what has happened and simply wait, since the Divine will provide for you without any effort.", "Struggle harder, as the fish that fought the hardest were showing the deepest faith of all.", "Turn inwardly to the Divine and give full effort to the next step, without the burden of being the sole doer.", "Grieve fully first, because surrender becomes possible only after every feeling has been spent."], "a": 2, "e": "The fish that stopped struggling and turned to the Master's feet was saved: it gave up the claim to save itself, and in the same act stopped fighting the current. The Gita's \"take refuge in Me alone ... do not grieve\" (18.66) promises freedom from grief when the burden of being the sole doer is laid down. Surrender is not passivity (against A); Arjuna fought and Holy Mother worked all her life. Struggle driven by the claim (B) is what the other fish did, and grief need not be exhausted before refuge is taken (D).", "r": "Where in my life am I circling in struggle when I could turn to Her feet?", "s": 26, "lv": "synthesise"}, {"t": "mc", "q": "Two friends watch the same football match. One is enthralled; the other keeps checking the time. What does the stroboscope experiment teach about this?", "o": ["The match is the same; each experience is the meeting of the match with a mind, so the two differ.", "Football is enjoyable only to some people, so the experiment has nothing to say about this case.", "One of the two friends must be wrong about how long the match actually lasted, and the clock settles who.", "The enthralled friend's watch was running faster, which is why the match seemed to go so quickly."], "a": 0, "e": "Under the strobe the fan never changed; what changed was its meeting with the instrument. In the same way the match unfolds at one rate, while each mind meets it with its own rhythm. Neither friend is wrong about the clock (against C and D); each is right about his own experience. The point is general, not about football (against B).", "r": "Which activity makes time vanish for me, and what does that tell me about my attention?", "s": 5, "lv": "apply"}, {"t": "mc", "q": "Before an important sentence, you first know what you mean, whole; then words form inwardly; then you speak. Where does the sense \"I am going to say this\" appear, and why does it matter?", "o": ["At Vaikharī, only once the words are actually spoken aloud and heard by someone else.", "At Parā, because the \"i\" is itself the original source of the whole meaning.", "With the inner words, at Madhyamā; the meaning was already whole before the \"i\" claimed it.", "It never appears at all, because speaking always happens without any sense of there being a speaker."], "a": 2, "e": "The meaning comes first, whole and wordless, with the flavour of Paśyantī. The sense of being the speaker arrives with the inner words at Madhyamā, and by the time the sentence is spoken the \"i\" is sure it was the author from the start. It is not at Vaikharī (A), which only unrolls what was already formed, nor at Parā (B), which is the Source, not the ego. Option D denies an experience everyone has.", "r": "Next time I speak about something important, can I notice the moment before the words?", "s": 16, "lv": "analyse"}, {"t": "mc", "q": "After years of meditation someone gains strong concentration and some unusual abilities, and begins to feel spiritually above others. How does the teaching assess this?", "o": ["The abilities prove that the goal has been reached, so the feeling of superiority is justified.", "Concentration closed Δf, but without offering, Δφ grew; a sharp mind can still be a proud mind.", "The concentration must have been false, since true concentration and pride can never coexist.", "Feeling superior does no harm at all, provided the daily meditation simply carries on."], "a": 1, "e": "The satsang warns that powers gained through concentration can strengthen the ego rather than dissolve it. Concentration closes Δf, but freedom needs the second dial: the claim must be offered. The abilities are not freedom (against A). The concentration may be quite real (against C); the problem is the claim that rides on it. Pride is not harmless (against D): it is Δφ itself.", "r": "What gift or ability of mine most easily becomes a source of pride?", "s": 23, "lv": "evaluate"}, {"t": "mc", "q": "Using the image of the cow tied to a post, how can effort and grace both be true at once?", "o": ["The cow should not bother to graze, since the cowherd will feed it whatever it does.", "The cow is free to pull up the post and wander wherever it likes, if only it pulls hard enough on the rope.", "Within the rope the cow must graze by its own effort; when the grass is gone, the cowherd moves the post.", "The rope shows that effort is useless, since the cow can never get beyond the post."], "a": 2, "e": "Within the length of its rope the cow is free, and if it is to eat it must make the effort; the post and the rope are set by past karma. The moving of the post is grace. So effort works within the field that karma sets, and grace changes the field. Effort is not useless (against A and D), and the ego cannot pull up the post by force (against B). Effort prepares the mind to receive grace; it does not compel it.", "r": "Where is the grass within my rope that I have not yet grazed?", "s": 25, "lv": "synthesise"}, {"t": "match", "q": "Each moment is part of one act of speaking to comfort a friend. At which level of Vāk does each belong?", "rows": ["You sense, before any words, exactly what you want your friend to feel.", "You rehearse the sentence silently and change one word.", "The sentence is spoken aloud and your friend hears it.", "A thought arises: \"I am going to say this.\""], "c": ["Paśyantī (will)", "Madhyamā (knowledge)", "Vaikharī (action)"], "ans": [0, 1, 2, 1], "e": "The whole meaning, before any word, has the flavour of Paśyantī. Inner words that can be heard and revised belong to Madhyamā, and so does the sense \"I am going to say this\", because the \"i\" attaches only when the impulse has a form it can recognise. The spoken sentence is Vaikharī. The meaning was complete at the start; speaking only unrolls it in time.", "r": "What changes in my speech when I wait for the whole meaning before I start talking?", "s": 16, "lv": "analyse"}, {"t": "mc", "q": "Bring together the stroboscope and the picture of my will within Thy will. What does the felt conflict between my will and God's will correspond to?", "o": ["A real battle between two independent powers, one of which must in the end defeat the other.", "The beat produced by the gap between them: real as experience, like the strobe's motion, but not the deepest truth.", "A plain error of perception that should simply be ignored, since nothing at all in the experience of conflict is real.", "A test set by the Divine, so the conflict should be made as sharp and painful as possible."], "a": 1, "e": "Under the strobe, the apparent motion is the difference between two rhythms, and the fan itself never changes. In the same way, the struggle of my will against Thy will is the beat of the gap between them. It is real as an experience (against C), but the two are not rival powers (against A): my will lives within Thy will. As surrender grows, the gap closes and the conflict fades, so sharpening it (D) misses the point.", "r": "Where do I most feel my will pulling against what life is bringing, and what would one step closer look like?", "s": 20, "lv": "synthesise"}, {"t": "mc", "q": "Sri Ramakrishna said: \"It is God Himself who keeps this error in man. Otherwise sin would have multiplied.\" What follows for how we hold our own sense of being the doer?", "o": ["It is shameful, and from now on it should be firmly denied in every single situation that arises in life.", "It is the final truth, so the teaching that God alone is the Doer can safely be set aside.", "It is only a trick, so in fact we are not responsible for anything that we do.", "At our present setting it is needed: it keeps us responsible and careful until we see more truly."], "a": 3, "e": "The feeling of being a free doer is not a mistake to be ashamed of (against A). At our present setting of the dial it keeps us responsible and careful. As long as we feel we are the doer, we must also feel responsible (against C). It is not the final truth (against B): the one who has realised God says, \"I am the machine, and Thou, O Lord, art the Operator.\" This is Δφ seen with compassion.", "r": "Can I hold my sense of responsibility without either pride or self-reproach?", "s": 21, "lv": "evaluate"}, {"t": "mc", "q": "After some months of practice, which sign best shows that this teaching is becoming part of one's character?", "o": ["One can now explain Δf, Δφ and the four levels of Vāk clearly and accurately to others.", "One has read every source listed at the end of the study article, from the Bhagavad Gita to Libet's papers.", "Praise and blame move one less, the pause before reacting comes easily, and effort goes on calmly.", "One spends many more hours each week in meditation than one did at the start."], "a": 2, "e": "Swami Vivekananda says that assimilating five ideas and making them one's life and character is more education than a library learnt by heart. Explaining (A) and reading (B) are information. Hours of meditation (D) are good but measure activity, not growth. The signs that the claim is loosening are in life itself: less movement under praise and blame, the pause rising by itself, and effort without anxiety about results.", "r": "Which small change in my reactions this month tells me the teaching is taking root?", "s": 28, "lv": "synthesise"}, {"t": "mc", "q": "You have heard this satsang and read the article. In the order of śravaṇa, manana and nididhyāsana, what is the best next step for these ideas to become your own?", "o": ["Read further books on free will until every scientific and philosophical debate on the question has been settled.", "Reflect on the ideas until doubts clear, test them in daily life, and practise one discipline steadily.", "Memorise the key quotations, so that they can be recalled whenever a difficult moment comes.", "Wait for a spiritual experience first, before attempting to apply any of it in daily life."], "a": 1, "e": "Hearing (śravaṇa) is done. Next comes reflection (manana), turning the ideas over until doubts clear and testing them in real situations, and then sustained contemplation and practice (nididhyāsana), until the idea becomes one's own. More reading (A) and memorising (C) stay at the level of information. Waiting for experience (D) reverses the order: practice prepares the mind for experience.", "r": "Which one idea from this evening will I reflect on and practise this month?", "s": 30, "lv": "synthesise"}, {"t": "mc", "q": "A friend says: \"Science has proved that free will is an illusion.\" Which assessment is fairest to the evidence?", "o": ["Science has proved that free will is real, because volunteers in the experiments could veto movements.", "Science has proved there is no free will, so all spiritual teaching about choice is now out of date.", "Science has nothing at all to say about the mind, and its findings can safely be ignored here.", "Science has not settled it, but in every reading much happens before the \"i\" knows of it."], "a": 3, "e": "The experiments have been debated for forty years: some read them as the brain deciding first, Libet pointed to a veto window, Schurger and colleagues suggested the signal is background activity reaching a threshold, and others question the method. None settles the question either way (against A and B). Yet every reading agrees that much happens before awareness, which fits the teaching that the \"i\" arrives late. Science and the spiritual tradition can light each other (against C).", "r": "How do I respond when science and my faith seem to disagree: with fear, dismissal or curiosity?", "s": 18, "lv": "evaluate"}, {"t": "mc", "q": "Your carefully planned day collapses: the car breaks down and an important appointment is lost. Which response turns both dials together?", "o": ["Decide that planning is useless, and resolve never to make detailed plans again.", "Replay who is to blame for the breakdown, over and over, until the frustration finally wears itself off.", "Pretend not to mind in front of others while privately resenting the whole morning.", "Say inwardly, \"This is Your will for today,\" then calmly do what the situation now needs."], "a": 3, "e": "Accepting what comes is the practice marked for both dials: releasing the claim that the day must go my way loosens Δφ, and as resistance falls the mind steadies and Δf narrows. Then full effort goes into what the situation now needs. Giving up planning (A) is fatalism, not surrender. Blame (B) feeds the claim, and suppressed resentment (C) keeps the beat running underneath.", "r": "What disruption this week could I meet with \"This is Your will for today\"?", "s": 28, "lv": "apply"}];

 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
