<script>
const Q=[{"t": "mc", "q": "A friend says: “Spiritual people should skip the Diwali parties and sweets; only the inner lamp matters.” How does the satsang answer?", "o": ["The outer lamp matters most, because the inner lamp lights itself once the festival has been kept in the proper way.", "The outer lamp is good and joyful and belongs to the festival; the question is whether we also light the inner lamp.", "Neither matters, since Diwali is a custom of the past that has no real use any longer for a sincere seeker of the Self.", "The friend is right: outer celebration is a distraction that has to be given up before the inner lamp can be lit."], "a": 1, "e": "The slide on the two ways to keep Diwali says that lamps, sweets, new clothes, family and friends are “good, and joyful”, and that the inner lamp is “a mind clear enough for the light of the Self to shine through”. The two are not set against each other. The question for the morning is what would make this a year of inner growth.", "r": "When did a festival leave me with something lasting inside?", "s": 3}, {"t": "mc", "q": "A student has read many scriptures and can explain them well, yet remains restless. Ramprasad’s last lines in the song say: “my mind has understood, my heart has not.” What does this suggest the student needs?", "o": ["To drop the study altogether, since the song teaches that knowing the Mother is impossible for every seeker who tries, however sincerely.", "To let what the mind understands travel to the heart through practice and devotion; understanding alone does not reveal Her.", "To read more scriptures, since the heart will follow of itself once the mind has understood enough of them.", "To be content, since the understanding of the mind is all that the Mother asks of a devotee in this life."], "a": 1, "e": "In the Gospel’s English: “But while my mind has understood, alas! my heart has not; Though but a dwarf, it still would strive to make a captive of the moon.” The song does not despise understanding; it admits that the heart is still learning. The Mother is the Inner Self of the yogi, so She is found within, not by learning alone.", "r": "Where do I understand something with the mind that my heart has not yet taken up?", "s": 6}, {"t": "mc", "q": "Someone objects: “The verse says ‘I am Shiva, the auspicious.’ That is arrogance.” Which reply is closest to the satsang?", "o": ["The practitioner becomes divine after enough practice, and the verse celebrates that personal achievement.", "It is a poetic flourish with no meaning for daily life, so it can safely be skipped by the practical person.", "It is a prayer asking Shiva to bless the one who chants, and not a statement about the Self at all.", "It does not say the small ego is God; it points to the Self that every being is, the light in all."], "a": 3, "e": "The talk note on the verse says: “‘I am Shiva’ does not mean that the small ego is God; it points to the Self that every being is.” The same verse speaks of the light within, the light without and the light in every being, so the “I” in question is not one person’s ego. (The verse is attributed to Adi Shankaracharya; the English is a free rendering for satsang.)", "r": "Which of the five lights in the verse is easiest for me to feel, and which hardest?", "s": 7}, {"t": "mc", "q": "A devotee has practised for years and says: “The light has not come, so I must be unworthy.” Using Gita 10.10 and 10.11, what is the best answer?", "o": ["The darkness is ignorance, not a measure of worth: the Lord lights the lamp within out of compassion; we bring devotion.", "The Lord lights the lamp only for those who have earned it, so the devotee must practise harder to deserve it.", "The darkness is the devotee’s sin, which has to be cleared away completely before the Lord will act at all.", "The lamp is lit by the devotee’s own intellect, so the answer is to study more and to understand each teaching more deeply."], "a": 0, "e": "Gita 10.11: “Out of compassion for them alone I, residing in their hearts, destroy the darkness born of ignorance by the shining lamp of Self-knowledge.” Gita 10.10 says the Lord grants the enlightenment to those “ever devoted and adore Me with love”. The darkness is ignorance (ajñāna), and our part is love and readiness.", "r": "What would it mean to trust that the light is already there, waiting to be seen?", "s": 8}, {"t": "mc", "q": "One devotee says: “Everything depends on God’s grace, so I need not practise.” Another says: “Everything depends on my effort.” What do the slides on Sri Ramakrishna’s teaching offer both?", "o": ["The second is right, because the Master said that a house without light is a sign of poverty, so effort is all.", "The first is right, because the Master said that God can be seen the moment His grace descends, with no further effort.", "Both are wrong, because seeing God depends on neither grace nor effort, but on a gift that comes without any cause.", "Grace descends and we light the lamp in our own hearts; neither is left out, and the Lord turns the light on Himself."], "a": 3, "e": "Sri Ramakrishna said both: “God can be seen the moment His grace descends,” and “A house without light indicates poverty. So one must light the lamp of Knowledge in one’s heart.” In the sergeant’s-lantern story we see His face only if He turns the light on Himself. Grace is real, and effort is ours.", "r": "When did I suddenly understand something I had long missed?", "s": 9}, {"t": "mc", "q": "Sri Ramakrishna said: “The mind will take the colour you dye it with. It is like white clothes just returned from the laundry.” A person notices more irritability after months of constant company that complains. What follows?", "o": ["The irritability is the person’s fixed nature, so the company around them has no effect on it at all.", "The mind is always stained by the world, so the only remedy is to wait patiently for grace to come.", "The mind has taken the colour of what it was dipped in, so company, words and habits are worth changing.", "Nothing can be done about it, since bondage and liberation are decided by fate and not by the mind."], "a": 2, "e": "The slide says: “A mind takes the colour of what it is dipped in: company, words, food, thoughts, habits.” The Master’s words are “Bondage and liberation are of the mind alone.” Because the cloth is white to begin with, what is added can be washed away.", "r": "What is the dust on my own mirror just now?", "s": 10}, {"t": "mc", "q": "A student wants to produce a spiritual experience by straining harder each day. According to Swami Vivekananda’s image of the mirror, what is the better approach?", "o": ["Polish the image in the mirror until it shines more brightly, since the clearer image is the experience.", "Look away from the mirror and wait patiently, because the dust settles and the glass cleans itself in time.", "Clean the mirror: the light does not need to be made, so clearing ignorance and impurity is the work.", "Bring a brighter lamp, because a stronger light will show the image right through the dirt on the glass."], "a": 2, "e": "Swami Vivekananda said: “If there is dirt and dust on a mirror, we cannot see our image. So ignorance and wickedness are the dirt and dust that are on the mirror of our hearts.” The slide’s point: the light does not need to be made; the mirror needs to be cleaned.", "r": "What is the one thing that clouds my mind most often, and what clears it?", "s": 10}, {"t": "mc", "q": "Gita 5.11 says the karma-yogis work “for the purification of the heart”. A volunteer serves in the kitchen but mostly wants to be noticed and thanked. What would bring the work closer to the Gita’s meaning?", "o": ["Keeping the work just as it is, so long as the dishes are clean and everyone has been fed on time.", "Working without attachment, as an offering, so that the work clears the heart and not the credit.", "Working harder and for longer hours, so that people cannot help noticing what has been done for them.", "Stopping the service, since work done among other people can never purify the heart of the one who does it."], "a": 1, "e": "Gita 5.11: “By giving up attachment, the Karma-yogis undertake work merely through the body, mind, intellect and even the senses for the purification of the heart.” Swami Vivekananda says that “Karma-Yoga is purifying the mind by means of work.” Work done for the heart’s clearing leaves less room for the wish for credit.", "r": "If purity of mind comes first in the Gita’s list, what would I put first in my own week?", "s": 11}, {"t": "mc", "q": "The satsang uses two images: dust on a mirror, and noise on a signal (lowering the noise floor). Someone compares themselves to a calmer person and feels inferior. What does the course’s way of putting it say?", "o": ["It is a difference in noise and not in worth: the Light is not missing, only the clarity of the instrument.", "Noise means the person has sinned, so the right remedy is repentance and a firm resolve to improve.", "There is no noise floor to lower, since the phrase is only a figure of speech and has no practical use for anyone trying to understand the mind.", "The calmer person is morally superior, so the other must work hard to catch up with the better one."], "a": 0, "e": "The slide quotes Lesson 3.4: “Neither of these people is morally superior or inferior.” It is a difference in noise. What lowers the noise: meditation, breath regulation, ethical living, the repetition of sacred names, silence and simplicity. Chitta-shuddhi is lifelong and gentle: not self-punishment and not perfection by Sunday.", "r": "What one thing clouds my mind most often, and what clears it?", "s": 12}, {"t": "match", "q": "Which picture from the satsang speaks to each person’s situation? Choose one for each line.", "rows": ["Mia knows she is no worse a person than her calm friend, but a busy mind drowns the quiet signal beneath it.", "After months among constant complaining, Rhea finds her own mind has turned sour.", "Sam has done all he can and still cannot see God; he feels the face will show itself only if the Lord turns the light on it.", "Tom strains for an experience, and does not see that his own ignorance and impurity hide what is already there."], "c": ["White clothes just back from the laundry", "Dirt and dust on a mirror", "The noise of a busy mind hiding a signal", "A sergeant whose lantern shows everyone’s face but his own"], "ans": [2, 0, 3, 1], "e": "Sri Ramakrishna’s cloth: the mind takes the colour you dye it with. Swami Vivekananda’s mirror: ignorance and wickedness are the dust on the mirror of the heart. The course’s signal: lowering the noise floor lets the stillness, the witness, become audible. The sergeant’s lantern: we see God’s face only if He turns the light of knowledge on His own face.", "r": "Which of these four pictures helps me most, and why that one?", "s": 12}, {"t": "mc", "q": "Gita 14.6 says sattva, being pure, illuminates and is harmless, yet “it binds through attachment to happiness and attachment to knowledge”. A person is proud of being calm and well read and looks down on restless people. What is happening?", "o": ["The Gita is mistaken here, since a quality that is pure and illuminating cannot possibly bind anyone.", "Nothing is wrong; pride in being calm and well read is the sign that sattva has finally matured in the person.", "Even sattva can bind: the person is attached to their own peace and knowledge. Sattva is a window, not the house.", "The person has fallen into tamas, because only tamas can produce pride and contempt for other people."], "a": 2, "e": "The slide’s plain words: “even sattva binds (14.6): we can become attached to our own peace and to our own knowledge. Sattva is a window, not the house.” The remedy is to keep the light and let go of clinging to it.", "r": "Which of the three (calm, restless, heavy) do I feel strongest in me this week?", "s": 13}, {"t": "mc", "q": "Someone says: “I am just a restless person, it is my nature, and nothing will change it.” What does Gita 14.10 suggest?", "o": ["The guṇas are fixed at birth, so the person should accept the nature they have and stop struggling with it.", "Nobody is only one guṇa: each rises by overpowering the other two, so what leads changes with what we feed it.", "Rajas can never be reduced, but it can be hidden from other people so that it does less harm in company.", "Only the study of the scriptures changes the guṇas, whatever else the person does or does not do."], "a": 1, "e": "Gita 14.10: “sattva increases by subduing rajas and tamas, rajas by over-powering sattva and tamas and tamas by dominating over sattva and rajas.” The slide adds that what leads changes with company, food, speech and thought (our reading of the verse). Sattva leads upward (14.18).", "r": "What fed my restlessness or my heaviness this week, and what fed my calm?", "s": 14}, {"t": "mc", "q": "Gita 14.11 gives a sign that sattva has increased. Which of these is closest to that sign?", "o": ["Spending long hours in meditation, whatever the state of the mind may be when the sitting is over.", "Winning arguments about the scriptures with more people than before, since knowledge shows in debate.", "The light of knowledge shows through all the doors of the body, in how we see, listen, speak and act.", "Feeling nothing at all and wanting to withdraw from other people so that the mind is not disturbed by them."], "a": 2, "e": "Gita 14.11: “When the illumination that is knowledge radiates in this body through all the doors (of the senses), then one should know that sattva has increased greatly.” The slide’s examples: eyes, ears, speech, action.", "r": "Which of the six marks could I show a little more of by tonight?", "s": 13}, {"t": "mc", "q": "A colleague is promoted to a post you wanted. Using Gita 12.13 (“friendly and compassionate”, “even-minded in sorrow and happiness”), which response shows a sattvic mind?", "o": ["Avoiding the colleague for a while, since being near them is too hard until the feeling has gone.", "Congratulating the colleague politely while keeping a quiet grudge, which is good enough for a working life.", "Being truly glad for the colleague and letting the disappointment pass without taking it out on anyone.", "Congratulating the colleague loudly and often, so that everybody can see how generous you are being."], "a": 2, "e": "Gita 12.13 describes one who is “not hateful towards any creature, who is friendly and compassionate, who has no idea of ‘mine’ and the idea of egoism (‘I’), who is even-minded in sorrow and happiness, who is forgiving.” The slide’s plain pictures include “someone who is glad at another’s good fortune”. The marks are a direction to walk in, not a list to tick.", "r": "Which one of the six marks could I show a little more of by tonight?", "s": 16}, {"t": "mc", "q": "You know a true fact that would hurt a colleague and help no one. Gita 17.15 describes sattvic speech as words that cause no distress, that are true, kind and beneficial. What does the verse suggest?", "o": ["Say something false instead, since a kind falsehood is better than a painful truth in this situation.", "Say it only behind the colleague’s back, so that the colleague is spared being hurt in a direct and obvious way to their face.", "Say it, because truth is the only test of speech and kindness has no part to play in the matter at all.", "Truth alone is not the whole test: if it is not kind or beneficial, hold it back or find a way to say it that helps."], "a": 3, "e": "Gita 17.15, as paraphrased on the slide: “words that cause no distress, that are true, kind and beneficial.” Four tests: no distress, true, kind, beneficial. Compare the week’s practice from Holy Mother’s teaching: before speaking of another, ask whether it adds light.", "r": "If every word I speak were an offering, which of my words today would I take back?", "s": 17}, {"t": "match", "q": "Gita chapters 17 and 18 name the sattvic form of each area of life. In which area is each person being tested?", "rows": ["Priya is tempted to tell a colleague a true fact that would only wound.", "Dan shows reverence to his teacher, keeps clean, is straightforward and harms no one.", "Ana, stirred by a sharp remark, keeps her mind serene and gentle and rests in silence.", "At a family gathering Leo meets a hard relative and sees one imperishable Being in them."], "c": ["Conduct (17.14)", "Speech (17.15)", "Mind (17.16)", "Knowing (18.20)"], "ans": [1, 0, 2, 3], "e": "These are paraphrases of Gita 17.14, 17.15, 17.16 and 18.20 (the English is ours). The Gita calls them the austerities of the body, speech and mind, and the knowledge that sees one Being in all. In 17.16 purity of heart (bhāva-saṁśuddhi) is the Gita’s word for chitta-shuddhi.", "r": "Which of the eight pictures is already strongest in me, and which did I least expect to find on the list?", "s": 17}, {"t": "mc", "q": "Gita 18.23 and 18.26 describe the sattvic action and the sattvic doer. A person is anxious before every task and flat or elated after it. What shift do the verses suggest?", "o": ["Work as duty with full effort and enthusiasm, without grasping at the fruit, steady in success and failure.", "Care only about the result, since results are the only thing that finally matters to anyone who works.", "Stop all action, because every action that is done binds the doer more tightly to the world of results.", "Give less effort to the work, so that a disappointment cannot hurt so much when the result finally comes in at the end."], "a": 0, "e": "Paraphrase of Gita 18.23: “action done as duty, without attachment, without love or hatred, by one who does not seek its fruit.” Gita 18.26: free from attachment, not boastful, firm and enthusiastic, unmoved by success or failure. Peace is no longer held hostage to results.", "r": "Where am I working for the result more than for the work?", "s": 19}, {"t": "mc", "q": "Someone gives up a spiritual discipline because it is bitter and hard at first. Gita 18.37 says sattvic happiness is “at first like poison, at the end like nectar”. What is the sound lesson?", "o": ["Judge a practice by where it ends, in the serenity of a mind turned to the Self, not by how it feels at first.", "Happiness has no place in the spiritual life, so only the bitterness of the practice is of any importance.", "Whatever is unpleasant must be good for the mind, so the person should choose the hardest practices on offer.", "A practice that is hard at the beginning is always wrong for that person and should be dropped quickly."], "a": 0, "e": "Paraphrase of Gita 18.37: “at first like poison, at the end like nectar, born of the serenity of a mind turned to the Self.” The slide’s note: the verses that follow describe the reverse, the happiness of the senses. Discomfort is not good in itself; the test is the serenity at the end.", "r": "What practice have I dropped that I might return to, kindly?", "s": 19}, {"t": "mc", "q": "At a family gathering you meet a relative you find difficult. Gita 18.20 calls the knowledge “by which one sees one imperishable Being in all beings, undivided in the divided” sattvic. How would this knowledge show itself?", "o": ["In avoiding every disagreement by saying nothing to anyone for the whole of the day, so that peace is kept.", "In treating the relative as unreal, since only the one Being is real and the person is merely appearance.", "In treating the relative with respect, seeing the same Being in them despite the differences between you.", "In explaining kindly to the relative that you are further along the path and understand the family better."], "a": 2, "e": "The slide’s note: “The heart of it: seeing the one in the many, which is the same as seeing the Divine in others.” The Gita’s verse does not erase the differences; the one Being is seen undivided in the divided. This is why seva, seeing Shiva in the one we serve, clears our own mirror.", "r": "Whom could I see differently this Diwali, and how?", "s": 18}, {"t": "mc", "q": "Swami Vivekananda read the Ramayana as the story of the soul (as recorded): Lanka is the body, Sita the Jivatman, Rama the Paramatman. A seeker held by restlessness and heaviness hears a teacher’s words and for the first time feels the truth of the Self. Whom does the teacher play in that story?", "o": ["Ravana, whose rajas keeps the soul in the body and who is to be won over by patient argument.", "Rama, because the teacher is the Supreme Self who has come in person to take the soul home.", "Hanuman, who shows the captive soul the Lord’s ring, the wisdom that destroys all illusions.", "Sita, because the teacher is the individual soul that has already become free of the body."], "a": 2, "e": "Lanka is the body; Sita is the Jivatman, held in it; Rama is the Paramatman, whom Sita longs to be one with; Hanuman is the Guru who shows Sita the ring “which is Brahma-Jnana, the supreme wisdom that destroys all illusions.” Our texts report this as spoken, hence “as recorded”.", "r": "Which guard am I most often held by this week: rajas, tamas, or my own goodness?", "s": 20}, {"t": "mc", "q": "Sri Ramakrishna said: “Ravana had an excess of rajas, Kumbhakarna of tamas, and Bibhishana of sattva. That is why Bibhishana was able to receive the grace of Rama.” What does this teach about sattva and grace?", "o": ["Only the one born with sattva can ever receive grace, and everyone else is shut out of it for good.", "Sattva and grace are rivals: the more a person has of the one, the less there is room for the other.", "Sattva earns salvation, so grace plays no part once a person has become good enough in this life.", "Sattva turns us towards the Lord and readies us to receive grace, which then finishes the work."], "a": 3, "e": "The slide on the Ramayana of the body: Vibhishana, the sattvic brother, leaves Lanka and takes refuge at Rama’s feet. Sattva turns us towards Him, and the grace of Rama finishes the work. Rajas and tamas are guards that keep Sita from Rama until the Guru’s wisdom and grace come.", "r": "Where in my own life is the turning-towards, and where is the waiting for grace?", "s": 20}, {"t": "mc", "q": "You catch yourself finding fault with a neighbour. Holy Mother said: “If you want peace of mind, do not find fault with others. Rather see your own faults. Learn to make the whole world your own.” What is a fitting first step?", "o": ["Look at your own faults first, ask whether your words would add light, and then treat the neighbour as your own.", "Tell the neighbour everything you see wrong in them, because plain honesty is the only way to peace.", "Say nothing to the neighbour but speak of the faults to others, so that the faults are known and dealt with.", "Decide that the neighbour is a stranger and have as little more to do with them as you possibly can from that day on."], "a": 0, "e": "Holy Mother, five days before her passing: “No one is a stranger. The whole world is your own.” She also said: “The mind is everything. It is in the mind alone that one feels pure and impure.” The week’s practice from the talk: before speaking of another person, ask whether it adds light.", "r": "Whom could I see differently this Diwali, and how?", "s": 22}, {"t": "mc", "q": "A devotee meditates for two hours each morning but declines to help in the centre’s kitchen, saying “my work is inner”. Which reading of Swami Vivekananda’s teaching on worship fits best?", "o": ["Neither is worship unless it happens in front of an image, with the proper offerings and in the proper form.", "Both wings are needed: service that sees the Divine in the one served is itself part of purifying the mind.", "Service is the higher one, so meditation can be dropped by anyone who is busy helping other people all week.", "Inner work is the higher one, so service is for those who are not yet able to sit and meditate for long."], "a": 1, "e": "Swami Vivekananda: “This is the gist of all worship--to be pure and to do good to others. He who sees Shiva in the poor, in the weak and in the diseased, really worships Shiva.” The slide’s reading: inner stillness without service becomes withdrawal, and service without inner clearing becomes restless doing.", "r": "One act of seva I will do this month, seeing the Divine in the one I serve.", "s": 23}, {"t": "mc", "q": "A devotee judges growth by hours of meditation and the number of verses memorised. Swami Ranganathananda asks: “Can you love others? Can you feel oneness with others? Have you peace within yourself and do you radiate it around you?” What is the best response?", "o": ["Rank the devotees by their answers to the five questions and encourage the ones who come lowest on the list.", "Stop asking questions about growth altogether, since the asking is itself a sign of failure and of pride.", "Keep counting hours and verses, since they are the clearest outward proof of growth that a person can have in practice.", "Use the five gentle questions as a direction and not a score; compare yourself with a year ago, not with a neighbour."], "a": 3, "e": "Swami Ranganathananda: spiritual growth is “stimulated by meditation, inwardly and by work done in a spirit of service outwardly.” Swami Vivekananda: “This unselfishness is the test of religion.” The slide’s line: no marks, no comparison, a direction and not a score.", "r": "Which of these five questions would I have answered differently last Diwali?", "s": 24}, {"t": "mc", "q": "At the end of the satsang a devotee writes ten big resolutions on the Lamp card. What does the satsang suggest instead?", "o": ["Skip the card altogether, because writing resolutions only makes the restless mind more restless than before.", "Choose one quality, one practice and one act of service: three small things kept are worth more than ten promised.", "Keep all ten, so that nothing is left out and the year ahead is as full as the heart’s wishes can make it.", "Choose three promises for the whole of life and make them as large as possible, so that the effort is real."], "a": 1, "e": "The year-ahead slide gives three lines to fill: one quality to grow, one practice to keep, one act of service to do. “Choose one of each. Three small things kept are worth more than ten promised.” Say one aloud to a neighbour for company on the road, and keep the card in the shrine until next Diwali.", "r": "One quality I will grow, one practice I will keep, one act of service I will do.", "s": 26}];
const M=4;let i=0,score=0,ans=[];const TOT=100;
const EMBED=/[?&]embed=1/.test(location.search)||window.self!==window.top;
const QCODE='SAT-002',QTITLE='Lighting the Inner Lamp: The Light of Diwali Within',QPROG='Satsang Study';
let saveState='';
const SK='rvcQuiz:'+QCODE;
function keep(){const st=(ans.length&&ans.length<Q.length)?{score:score,ans:ans,t:Date.now()}:null;try{if(st)localStorage.setItem(SK,JSON.stringify(st));else localStorage.removeItem(SK)}catch(e){}if(EMBED)try{window.parent.postMessage({type:'progress',code:QCODE,state:st},'*')}catch(e){}}
function valid(v){return v&&Array.isArray(v.ans)&&v.ans.length>0&&v.ans.length<Q.length&&typeof v.score==='number'?v:null}
function saved(){try{return valid(JSON.parse(localStorage.getItem(SK)||'null'))}catch(e){return null}}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='saved')saveState='saved';else if(d.type==='saveError')saveState='error';else if(d.type==='notMember')saveState='guest';else return;const el=document.getElementById('savemsg');if(el)el.innerHTML=saveMsg()});
function saveMsg(){return saveState==='saved'?'✓ Your result has been saved to your account. See all your results on <a href="https://www.vedanta.nz/my-journey" target="_top">My Journey</a>.':saveState==='error'?'Your result could not be saved just now. Please try again, or write to mail@vedanta.nz.':saveState==='guest'?'Sign in to vedanta.nz to save your results.':'Saving your result…'}
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hdr(){document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';document.getElementById('sc').textContent='Score: '+score+' / '+TOT;document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%'}
function fb(ok,gain,ansText,q){const el=document.getElementById('fb');el.className='fb '+(ok?'ok':'no');el.innerHTML='<b>'+(ok?'Correct! +'+gain+' marks':(gain>0?'Partly right: +'+gain+' of 4 marks.':'Not quite.')+(ansText?' The answer is: '+esc(ansText):''))+'</b>'+esc(q.e)+' <i>(See slide '+q.s+'.)</i> <a href="../answers/#q'+(i+1)+'" target="_blank" rel="noopener">Read the full answer and reflection</a><div class="refl"><b>Reflect:</b> '+esc(q.r)+'</div>';document.getElementById('nx').style.display='inline-block';keep();hdr()}
function show(){hdr();if(i>=Q.length)return result();const q=Q[i];
 let h='<div class="card"><p class="qn">QUESTION '+(i+1)+' · 4 MARKS'+(q.t==='match'?' · MATCHING':'')+'</p><p class="q">'+esc(q.q)+'</p>';
 if(q.t==='mc')q.o.forEach((o,k)=>h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>');
 else{h+='<p style="font-size:var(--fs-text,13.5px);color:#5A5A5A;margin:-8px 0 10px">Choose an answer for each line, then check. 1 mark for each correct match.</p>';q.rows.forEach((r,ri)=>{h+='<div class="mrow"><p>'+esc(r)+'</p><div class="ch" data-r="'+ri+'">'+q.c.map((c,ci)=>'<button data-c="'+ci+'">'+esc(c)+'</button>').join('')+'</div></div>'});h+='<button class="btn" id="chk">Check my matches</button>'}
 h+='<div class="fb" id="fb"></div><div class="nav"><button class="btn gold" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question ›')+'</button></div><p style="font-size:var(--fs-small,12.5px);color:#6B6B6B;text-align:center;margin-top:12px">Your answers are saved as you go, so you can stop at any time and continue later. Sign in to vedanta.nz to continue on any device.</p></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');const g=ok?M:0;score+=g;ans.push({g});fb(ok,g,ok?'':q.o[q.a],q)});
 else{const pick=q.rows.map(()=>-1);app.querySelectorAll('.ch').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;pick[+row.dataset.r]=+b.dataset.c;row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))}));
  document.getElementById('chk').onclick=()=>{if(pick.some(x=>x<0)){alertBox();return}let g=0;app.querySelectorAll('.ch').forEach(row=>{const ri=+row.dataset.r;row.querySelectorAll('button').forEach(x=>{x.disabled=true;const ci=+x.dataset.c;if(ci===q.ans[ri])x.classList.add('right');else if(ci===pick[ri])x.classList.add('wrong')});if(pick[ri]===q.ans[ri])g++});document.getElementById('chk').style.display='none';score+=g;ans.push({g});fb(g===4,g,'',q);if(g<4){const b=document.querySelector('#fb b');b.textContent+=' The correct matches are shown in green.'}}}
 document.getElementById('nx').onclick=()=>{i++;show()}}
function alertBox(){const el=document.getElementById('fb');el.className='fb no';el.innerHTML='<b>Please choose an answer for every line first.</b>'}
function result(){const p=score;try{localStorage.removeItem(SK)}catch(e){}
 const band=p>=90?['Excellent!','You have absorbed the satsang beautifully. May the inner lamp burn steadily and light the way for others.']:p>=70?['Very good','You have understood most of the satsang. Revisit the slides for the questions you missed.']:p>=50?['A good start','Go back through the slides at your own pace, especially those marked below, and try again.']:['Keep going','Every return to the teaching is practice. Read through the slides again, reflect, and take the quiz once more.'];
 let r='<div class="card res"><p class="qn">YOUR RESULT</p><p class="score"><span class="big">'+score+'</span><span class="of"> / '+TOT+'</span></p><p class="band">'+band[0]+'</p><p>'+band[1]+'</p><div class="rev">';
 Q.forEach((q,k)=>{const g=ans[k]?ans[k].g:0;r+='<div class="'+(g===4?'r':'w')+'">'+(g===4?'✓ ':(g>0?'◐ ':'✗ '))+'<a href="../answers/#q'+(k+1)+'" target="_blank" rel="noopener"><b>Q'+(k+1)+'</b></a> '+g+'/4 · '+esc(q.t==='mc'?q.o[q.a]:q.q)+' <i>(slide '+q.s+')</i></div>'});
 r+='</div><div class="acts"><a class="btn" href="../answers/" target="_blank" rel="noopener">Read all the answers</a><button class="btn" id="again">Try again</button><a class="btn gold" href="https://www.vedanta.nz/course/satsang-study" target="_top">Open the course</a></div><div class="join">Join <b>Satsang Study</b> on our website, free, to study each satsang and Hamilton class, share reflections with other members, and keep your progress: <a href="https://www.vedanta.nz/course/satsang-study" target="_top">vedanta.nz/course/satsang-study</a></div></div>';
 if(EMBED)r=r.replace('<div class="acts">','<p id="savemsg" style="font-size:var(--fs-text,13.5px);background:#E8EEDF;border-radius:10px;padding:10px 12px;margin-top:14px">'+saveMsg()+'</p><div class="acts">');
 app.innerHTML=r;window.scrollTo(0,0);
 if(EMBED){const full=ans.filter(a=>a&&a.g===4).length;try{window.parent.postMessage({type:'quizResult',code:QCODE,title:QTITLE,programme:QPROG,score:score,maxScore:TOT,percent:score,questionsCorrect:full,questionCount:Q.length,answers:ans.map((a,k)=>({q:k+1,marks:a?a.g:0}))},'*')}catch(e){}}
 document.getElementById('again').onclick=()=>{i=0;score=0;ans=[];show()}}
function start(){if(!EMBED)return offer(saved());
 let done=false,n=0,tm=null;const go=v=>{if(done)return;done=true;if(tm)clearInterval(tm);offer(v)};
 window.addEventListener('message',e=>{const d=e.data||{};if(d.type!=='resume')return;const a=valid(d.state),b=saved();go(a&&b?((a.t||0)>=(b.t||0)?a:b):(a||b))});
 app.innerHTML='<div class="card"><p>Loading your quiz…</p></div>';
 const ping=()=>{if(done)return;if(++n>6)return go(saved());try{window.parent.postMessage({type:'ready',code:QCODE},'*')}catch(e){}};
 tm=setInterval(ping,500);ping()}
function offer(v){if(!v)return show();
 const n=v.ans.length;i=n;score=v.score;hdr();document.getElementById('pos').textContent='Paused at question '+(n+1)+' of '+Q.length;
 app.innerHTML='<div class="card"><p class="qn">WELCOME BACK</p><p class="q">You have answered '+n+' of '+Q.length+' questions so far, with '+v.score+' marks.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn gold" id="cont">Continue from question '+(n+1)+' ›</button><button class="btn" id="fresh">Start again</button></div></div>';
 document.getElementById('cont').onclick=()=>{ans=v.ans;score=v.score;i=n;show()};
 document.getElementById('fresh').onclick=()=>{i=0;score=0;ans=[];keep();show()}}
start();
</script></body></html>
